<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Picker Pendency Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" type="image/png" href="https://disprz.ai/hubfs/Favicon_64%20px%20reverse-final%20(2).png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<style>
  ::-webkit-scrollbar{display:none!important}
  *{scrollbar-width:none!important;-ms-overflow-style:none!important;box-sizing:border-box}
  :root{
    --primary:#4f46e5;--primary-soft:#eef2ff;--danger:#ef4444;--danger-hover:#dc2626;
    --success:#10b981;--warn:#f59e0b;--bg-grad-1:#e0e7ff;--bg-grad-2:#f8fafc;
    --panel-bg:rgba(255,255,255,.95);--panel-border:rgba(255,255,255,.8);
    --text-main:#1e293b;--text-muted:#64748b;--card-bg:#fff;--table-head-bg:#f8fafc;
    --row-hover:#f8fafc;--input-border:#e2e8f0;--chip-bg:#e2e8f0;
  }
  body.dark{
    --bg-grad-1:#1e1b3a;--bg-grad-2:#0f172a;--panel-bg:rgba(30,41,59,.92);--panel-border:rgba(71,85,105,.4);
    --text-main:#e2e8f0;--text-muted:#94a3b8;--card-bg:#1e293b;--table-head-bg:#0f172a;
    --row-hover:#0f172a;--input-border:#334155;--chip-bg:#334155;--primary-soft:#312e81;
  }
  body{background:linear-gradient(135deg,var(--bg-grad-1) 0%,var(--bg-grad-2) 100%);margin:0;padding:24px 14px 70px;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;color:var(--text-main);display:flex;justify-content:center;transition:background .3s}
  #appLoader{position:fixed;inset:0;background:var(--bg-grad-2);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .7s cubic-bezier(.8,0,.2,1)}
  .slide-up{transform:translateY(-100%)}
  .spinner{width:46px;height:46px;border:5px solid var(--input-border);border-top:5px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite}
  .loading-text-anim{margin-top:18px;font-weight:800;font-size:16px;color:var(--primary);letter-spacing:.5px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .glass-panel{background:var(--panel-bg);border-radius:20px;padding:28px 22px;box-shadow:0 15px 35px rgba(0,0,0,.08);width:100%;max-width:900px;backdrop-filter:blur(12px);border:1px solid var(--panel-border);z-index:10}
  .ui-locked{pointer-events:none;opacity:.6}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .top-row h2{margin:0;font-weight:800;font-size:1.4rem}
  .top-row .sub{color:var(--text-muted);font-size:12.5px;font-weight:600;margin-top:2px}
  .icon-btn{border:none;background:var(--chip-bg);color:var(--text-main);width:38px;height:38px;border-radius:10px;font-size:16px;cursor:pointer;transition:.2s}
  .icon-btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
  .tab-container{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .btn-tab{border:none;padding:11px 18px;border-radius:12px;font-weight:700;background:var(--chip-bg);color:var(--text-muted);transition:.25s;flex:1;min-width:130px;font-size:13.5px;cursor:pointer}
  .btn-tab:hover:not(.active){filter:brightness(.95);transform:translateY(-1px)}
  .btn-tab.active{background:var(--primary);color:#fff}
  .btn-refresh{border:none;padding:10px 16px;border-radius:12px;font-weight:700;background:var(--chip-bg);color:var(--text-muted);font-size:13px;cursor:pointer;transition:.25s;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .btn-refresh:hover{filter:brightness(.95);transform:translateY(-1px)}
  .btn-refresh.spinning .refresh-icon{display:inline-block;animation:spin 1s linear infinite}
  .refreshed-at{font-size:11px;color:var(--text-muted);text-align:right;margin-top:4px}
  select,.field-input{width:100%;border-radius:12px;padding:13px 14px;border:2px solid var(--input-border);background:var(--card-bg);color:var(--text-main);font-weight:700;font-size:14.5px;transition:.2s}
  select:focus,.field-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .row-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
  @media(max-width:600px){.row-fields{grid-template-columns:1fr}}
  .store-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:16px 0}
  .store-card{background:var(--card-bg);border:2px solid var(--input-border);border-radius:14px;padding:14px;cursor:pointer;text-align:left;transition:.2s}
  .store-card:hover{border-color:var(--primary);transform:translateY(-2px)}
  .store-card.active{border-color:var(--primary);background:var(--primary-soft)}
  .store-card .sc-name{font-weight:800;font-size:13px;color:var(--text-main);display:block;margin-bottom:6px;word-break:break-word}
  .store-card .sc-count{font-weight:800;font-size:20px;color:var(--primary)}
  .store-card .sc-count.zero{color:var(--success)}
  #resultArea{display:none;margin-top:22px;flex-direction:column}
  .stats-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .stat-chip{background:var(--text-main);color:var(--bg-grad-2);padding:10px 18px;border-radius:50px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
  body.dark .stat-chip{background:var(--primary);color:#fff}
  .stat-chip b{background:var(--card-bg);color:var(--text-main);padding:2px 12px;border-radius:12px;font-size:13.5px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .toolbar .field-input{flex:1;min-width:160px}
  .btn-sort{border:none;padding:12px 16px;border-radius:12px;font-weight:700;background:var(--chip-bg);color:var(--text-main);font-size:13px;cursor:pointer;white-space:nowrap}
  .action-buttons{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
  .btn-action{border:none;padding:12px 20px;border-radius:10px;font-weight:700;font-size:13.5px;transition:.25s;flex:1;min-width:150px;cursor:pointer;color:#fff}
  .btn-action:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.18)}
  .btn-pdf{background:var(--text-main)}
  body.dark .btn-pdf{background:#334155}
  .btn-sheet{background:var(--success)}
  .btn-csv{background:var(--warn)}
  .table-holder{background:var(--card-bg);border-radius:12px;overflow-x:auto;width:100%;border:1px solid var(--input-border);-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;min-width:460px}
  thead th{background:var(--table-head-bg);color:var(--text-muted);border-bottom:2px solid var(--input-border);padding:14px;font-size:12.5px;font-weight:800;text-align:center}
  tbody tr{border-bottom:1px solid var(--input-border);transition:background-color .15s}
  tbody tr:hover{background-color:var(--row-hover)}
  td{padding:15px;font-weight:700;font-size:13.5px;text-align:center;color:var(--text-main)}
  .btn-page{background:var(--chip-bg);border:none;padding:8px 16px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--text-main);cursor:pointer}
  .btn-page:disabled{opacity:.5;cursor:not-allowed}
  .badge-count{background-color:var(--text-main);color:var(--bg-grad-2);padding:6px 0;border-radius:20px;font-size:13.5px;min-width:56px;display:inline-block}
  .na-bg{background-color:#fee2e2;color:#dc2626;padding:5px 12px;border-radius:8px;font-weight:800;border:1px solid #fca5a5;display:inline-block}
  .btn-main-rep{background:var(--danger);color:#fff;border:none;padding:9px 22px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer}
  .btn-main-rep:hover{background:var(--danger-hover)}
  .reason-group{display:none;gap:6px;justify-content:center;flex-direction:column;align-items:center}
  .btn-reason{border:none;padding:8px 14px;border-radius:8px;font-size:11.5px;color:#fff;font-weight:700;width:100%;max-width:150px;cursor:pointer}
  #toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:none;width:92%;max-width:420px;text-align:center;pointer-events:none}
  .toast-msg{background:var(--text-main);color:var(--bg-grad-2);padding:12px 22px;border-radius:50px;font-weight:700;font-size:13.5px;box-shadow:0 10px 25px rgba(0,0,0,.25);display:inline-block}
  .empty-state{padding:36px 20px;text-align:center;color:var(--text-main)}
  .empty-state h4{font-weight:800;color:var(--success);margin:8px 0 0}
  .config-banner{background:#fef3c7;color:#92400e;border:1px solid #fbbf24;border-radius:12px;padding:14px 16px;font-size:13px;font-weight:600;margin-bottom:16px;text-align:left;display:none}
  .skeleton{background:linear-gradient(90deg,var(--chip-bg) 25%,var(--input-border) 37%,var(--chip-bg) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:8px;height:14px}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
</style>
</head>
<body>
<div id="appLoader"><div class="spinner"></div><div class="loading-text-anim">Loading Dashboard...</div></div>

<div class="glass-panel" id="mainPanel">
  <div class="top-row">
    <div>
      <h2>Picker Pendency Dashboard</h2>
      <div class="sub" id="dataSummary">&nbsp;</div>
    </div>
    <button class="icon-btn" id="darkToggle" onclick="toggleDark()" title="Toggle theme">🌙</button>
  </div>

  <div id="configBanner" class="config-banner"></div>

  <div class="tab-container">
    <button id="btnNormal" class="btn-tab active" onclick="setMode(0)">Dark Store Wise</button>
    <button id="btnManager" class="btn-tab" onclick="setMode(1)">Cluster Manager</button>
    <button class="btn-refresh" id="btnRefresh" onclick="refreshData()"><span class="refresh-icon">↻</span> Refresh</button>
  </div>
  <div class="refreshed-at" id="refreshedAt"></div>

  <div class="row-fields">
    <select id="citySelect"></select>
    <select id="storeSelect" style="display:none"></select>
  </div>

  <div id="storeCardsWrap"></div>

  <div id="resultArea">
    <div class="stats-strip">
      <div class="stat-chip">Total Pendency <b id="countBadge">0</b></div>
      <div class="stat-chip" id="filteredChip" style="display:none">Showing <b id="filteredBadge">0</b></div>
    </div>

    <div class="toolbar">
      <input class="field-input" id="searchBox" placeholder="Search by name or Casper ID..." oninput="onSearch()">
      <button class="btn-sort" id="sortBtn" onclick="toggleSort()">Sort: Name A→Z</button>
    </div>

    <div class="action-buttons">
      <button class="btn-action btn-pdf" onclick="exportData()">Download PDF</button>
      <button class="btn-action btn-csv" onclick="exportCSV()">Download CSV</button>
      <button id="btnGSheet" class="btn-action btn-sheet" onclick="exportToGSheet()">Open As Google Sheet</button>
    </div>

    <div class="table-holder"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>

    <div id="paginationBar" style="display:none;justify-content:center;gap:15px;margin-top:18px;">
      <button class="btn-page" id="btnPrev" onclick="changePage(-1)">Previous</button>
      <span id="pageInfo" style="font-weight:800;font-size:13px;display:flex;align-items:center;">Page 1 of 1</span>
      <button class="btn-page" id="btnNext" onclick="changePage(1)">Next</button>
    </div>
  </div>
</div>

<div id="toast-container"><div class="toast-msg" id="toastText"></div></div>

<script>
  // !! UPDATE THIS IF YOU REDEPLOY GAS (Deploy > Manage deployments > Edit > New version keeps the same URL; "New deployment" does NOT) !!
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoX6ic4XRBNhZN0dMjxWbnUOivc3hOcMlhadOoyaoF9b6-Sc2R7efWQj24f4adIDh0/exec";

  let db=[], filtered=[], displayed=[], managerMode=false, reportedIds=new Set();
  let citySelectInstance, storeSelectInstance;
  let isProcessing=false, currentPage=1, toastTimer=null, sortDir=1;
  const PAGE_SIZE=50;
  const loginTxt="(Download: Disprz App From Playstore | User ID: Casper ID (452346) | Password: Edl@123)";

  // --- theme ---
  function toggleDark(){
    const dark=document.body.classList.toggle('dark');
    localStorage.setItem('picker_theme', dark?'dark':'light');
    document.getElementById('darkToggle').textContent = dark ? '☀️' : '🌙';
  }
  (function initTheme(){
    if(localStorage.getItem('picker_theme')==='dark'){
      document.body.classList.add('dark');
      document.addEventListener('DOMContentLoaded',()=>{document.getElementById('darkToggle').textContent='☀️';});
    }
  })();

  function remoteLogError(msg,stack,details){
    fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"log_error",message:String(msg||"Error"),stack:String(stack||"N/A"),details:String(details||"GitHub")})}).catch(()=>{});
  }
  window.onerror=(msg,src,lineno,colno,err)=>remoteLogError(msg,err?err.stack:`Line:${lineno}`,`Source:${src}`);
  window.addEventListener('unhandledrejection',e=>remoteLogError(e.reason,e.reason&&e.reason.stack,"Promise Rejection"));

  const escHtml=(s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const checkNA=(str)=>{
    const val=String(str).trim().toUpperCase();
    if(!val||val==="N/A"||val==="#N/A"||val==="#NA")return `<span class="na-bg">N/A</span>`;
    return escHtml(str);
  };

  function showToast(msg,isError=false){
    const c=document.getElementById('toast-container'),t=document.getElementById('toastText');
    t.innerText=msg;t.style.background=isError?"var(--danger)":"var(--text-main)";
    c.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{c.style.display='none';},3500);
  }
  function setUILock(lock){isProcessing=lock;document.getElementById('mainPanel').classList.toggle('ui-locked',lock);}
  function hideLoader(){
    const l=document.getElementById('appLoader');
    if(l&&!l.classList.contains('slide-up')){l.classList.add('slide-up');setTimeout(()=>{l.style.display='none';},700);}
  }
  function stampRefreshed(){
    document.getElementById('refreshedAt').innerText = "Last updated " + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  }
  function showConfigError(kind, detail){
    const b=document.getElementById('configBanner');
    if(kind==='stale'){
      b.innerHTML = "⚠️ <b>Can't reach the dashboard backend (HTTP 404).</b> This almost always means the Apps Script deployment URL changed. Open the Apps Script project → Deploy → Manage deployments, confirm the active Web App URL, and update <code>SCRIPT_URL</code> in this file if it differs.";
    } else {
      b.innerHTML = "⚠️ <b>Network error reaching the backend.</b> " + escHtml(detail||"Check your connection or the deployment's access setting (should be \"Anyone\").");
    }
    b.style.display='block';
  }
  function clearConfigError(){ document.getElementById('configBanner').style.display='none'; }

  const onNetworkError=(err,ctx)=>{
    setUILock(false);hideLoader();
    const is404 = /404/.test(err.message||'');
    showToast("Network Error: "+(err.message||"Could not reach server."),true);
    if(is404) showConfigError('stale'); else showConfigError('other', err.message);
    remoteLogError(err.message,err.stack,ctx||"GitHub");
  };

  function apiPost(body){
    return fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body)})
      .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});
  }

  window.onload=()=>{
    citySelectInstance=simpleSelect("citySelect","Select City",onCityChange);
    storeSelectInstance=simpleSelect("storeSelect","Select Dark Store",()=>{currentPage=1;render();});
    loadData(true);
  };

  // lightweight dependency-free select wrapper (keeps native <select>, styled via CSS)
  function simpleSelect(id, placeholder, onChange){
    const el=document.getElementById(id);
    el.innerHTML=`<option value="">${placeholder}</option>`;
    el.addEventListener('change', onChange);
    return {
      clearOptions(){ el.innerHTML=`<option value="">${placeholder}</option>`; },
      addOption({value,text}){ const o=document.createElement('option'); o.value=value; o.textContent=text; el.appendChild(o); },
      clear(){ el.value=""; },
      getValue(){ return el.value; },
      setValue(v){ el.value=v; }
    };
  }

  function loadData(isInitial){
    fetch(`${SCRIPT_URL}?action=getData`)
      .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(d=>{
        if(isInitial) hideLoader();
        clearConfigError();
        if(d&&d.error){showToast("Load Failed: "+d.error,true);remoteLogError(d.error,"N/A","Initial Data Fetch");return;}
        db=Array.isArray(d)?d:[];
        const cities=[...new Set(db.map(i=>i.city))].sort();
        citySelectInstance.clearOptions();
        cities.forEach(c=>citySelectInstance.addOption({value:c,text:c}));
        document.getElementById('dataSummary').innerText = `${db.length} pending picker${db.length===1?'':'s'} across ${cities.length} cit${cities.length===1?'y':'ies'}`;
        stampRefreshed();
      })
      .catch(err=>onNetworkError(err, isInitial?"Initial Data Fetch":"Refresh"));
  }

  function refreshData(){
    if(isProcessing)return;
    const btn=document.getElementById('btnRefresh');
    btn.classList.add('spinning');btn.disabled=true;
    reportedIds=new Set();currentPage=1;
    document.getElementById('resultArea').style.display='none';
    document.getElementById('storeCardsWrap').innerHTML='';
    citySelectInstance.clear();storeSelectInstance.clearOptions();storeSelectInstance.clear();
    fetch(`${SCRIPT_URL}?action=getData`)
      .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(d=>{
        btn.classList.remove('spinning');btn.disabled=false;
        clearConfigError();
        if(d&&d.error){showToast("Refresh Failed: "+d.error,true);return;}
        db=Array.isArray(d)?d:[];
        const cities=[...new Set(db.map(i=>i.city))].sort();
        citySelectInstance.clearOptions();
        cities.forEach(c=>citySelectInstance.addOption({value:c,text:c}));
        document.getElementById('dataSummary').innerText = `${db.length} pending picker${db.length===1?'':'s'} across ${cities.length} cit${cities.length===1?'y':'ies'}`;
        stampRefreshed();
        showToast("Data Refreshed ✓");
      })
      .catch(err=>{btn.classList.remove('spinning');btn.disabled=false;onNetworkError(err,"Refresh");});
  }

  function setMode(m){
    if(isProcessing)return;
    managerMode=!!m;currentPage=1;
    document.getElementById('btnNormal').classList.toggle('active',!m);
    document.getElementById('btnManager').classList.toggle('active',m);
    document.getElementById('storeSelect').style.display=m?'none':'block';
    document.getElementById('resultArea').style.display='none';
    document.getElementById('storeCardsWrap').innerHTML='';
    citySelectInstance.clear();storeSelectInstance.clearOptions();storeSelectInstance.clear();
  }

  function onCityChange(){
    if(isProcessing)return;
    const c=citySelectInstance.getValue();currentPage=1;
    const cardsWrap=document.getElementById('storeCardsWrap');
    if(!c){document.getElementById('resultArea').style.display='none';cardsWrap.innerHTML='';return;}
    if(managerMode){
      cardsWrap.innerHTML='';
      render();
    } else {
      const storeCounts={};
      db.filter(i=>i.city===c).forEach(i=>{storeCounts[i.darkStore]=(storeCounts[i.darkStore]||0)+1;});
      const stores=Object.keys(storeCounts).sort();
      storeSelectInstance.clearOptions();storeSelectInstance.clear();
      stores.forEach(s=>storeSelectInstance.addOption({value:s,text:s}));
      cardsWrap.innerHTML = `<div class="store-cards">${stores.map(s=>`
        <button type="button" class="store-card" onclick="pickStore('${escHtml(s)}')">
          <span class="sc-name">${escHtml(s)}</span>
          <span class="sc-count ${storeCounts[s]===0?'zero':''}">${storeCounts[s]}</span>
        </button>`).join('')}</div>`;
      document.getElementById('resultArea').style.display='none';
    }
  }

  function pickStore(s){
    storeSelectInstance.setValue(s);
    currentPage=1;
    document.querySelectorAll('.store-card').forEach(el=>el.classList.toggle('active', el.querySelector('.sc-name').textContent===s));
    render();
  }

  function changePage(dir){currentPage+=dir;renderTable();}

  function render(){
    const c=citySelectInstance.getValue(),s=storeSelectInstance.getValue();
    if(!c||(!managerMode&&!s)){document.getElementById('resultArea').style.display='none';return;}
    filtered=db.filter(i=>i.city===c&&(managerMode||i.darkStore===s)&&!reportedIds.has(String(i.casperId)));
    document.getElementById('countBadge').innerText=filtered.length;
    document.getElementById('resultArea').style.display='flex';
    document.getElementById('searchBox').value='';
    applySearchSort();
  }

  function onSearch(){ currentPage=1; applySearchSort(); }

  function toggleSort(){
    sortDir*=-1;
    document.getElementById('sortBtn').innerText = "Sort: Name " + (sortDir===1?"A→Z":"Z→A");
    applySearchSort();
  }

  function applySearchSort(){
    const q=document.getElementById('searchBox').value.trim().toLowerCase();
    displayed = !q ? [...filtered] : filtered.filter(i=>
      String(i.name).toLowerCase().includes(q) || String(i.casperId).toLowerCase().includes(q) ||
      (managerMode && String(i.clusterManager).toLowerCase().includes(q))
    );
    if(!managerMode){
      displayed.sort((a,b)=> sortDir * String(a.name).localeCompare(String(b.name)));
    }
    const chip=document.getElementById('filteredChip');
    if(q){ chip.style.display='flex'; document.getElementById('filteredBadge').innerText=displayed.length; }
    else chip.style.display='none';
    renderTable();
  }

  function renderTable(){
    const tHead=document.getElementById('tableHead'),tBody=document.getElementById('tableBody'),pBar=document.getElementById('paginationBar');
    if(displayed.length===0){
      tHead.innerHTML='';
      tBody.innerHTML=`<tr><td colspan="${managerMode?2:3}" class="empty-state"><h4>No Pending Pickers</h4><p style="margin:6px 0 0;color:var(--text-muted)">All Clear For This Selection</p></td></tr>`;
      pBar.style.display='none';return;
    }
    if(managerMode){
      pBar.style.display='none';
      const sum={};
      displayed.forEach(i=>{sum[i.clusterManager]=(sum[i.clusterManager]||0)+1;});
      tHead.innerHTML='<tr><th>Cluster Manager</th><th>Pendency Count</th></tr>';
      tBody.innerHTML=Object.entries(sum).sort((a,b)=> sortDir * a[0].localeCompare(b[0])).map(([n,v])=>`<tr><td>${checkNA(n)}</td><td><span class="badge-count">${v}</span></td></tr>`).join('');
    } else {
      const totalPages=Math.max(1,Math.ceil(displayed.length/PAGE_SIZE));
      currentPage=Math.min(currentPage,totalPages);
      document.getElementById('pageInfo').innerText=`Page ${currentPage} of ${totalPages}`;
      document.getElementById('btnPrev').disabled=(currentPage===1);
      document.getElementById('btnNext').disabled=(currentPage===totalPages);
      pBar.style.display='flex';
      const start=(currentPage-1)*PAGE_SIZE;
      tHead.innerHTML='<tr><th style="width:40%">Picker Name</th><th style="width:30%">Casper ID</th><th style="width:30%">Action</th></tr>';
      tBody.innerHTML=displayed.slice(start,start+PAGE_SIZE).map(i=>`
        <tr>
          <td>${checkNA(i.name)}</td>
          <td style="text-transform:none;">${checkNA(i.casperId)}</td>
          <td><div id="box-${escHtml(i.casperId)}">
            <button class="btn-main-rep" onclick="showOpt('${escHtml(i.casperId)}')">Report</button>
            <div class="reason-group" id="opt-${escHtml(i.casperId)}">
              <button class="btn-reason" style="background:var(--danger)" onclick="initiateSubmit('${escHtml(i.casperId)}')">Exit / Left</button>
            </div>
          </div></td>
        </tr>`).join('');
    }
  }

  function showOpt(id){
    document.getElementById('opt-'+id).style.display='flex';
    document.querySelector('#box-'+CSS.escape(id)+' .btn-main-rep').style.display='none';
  }

  function initiateSubmit(id){
    const p=filtered.find(x=>String(x.casperId)===String(id));
    if(!p)return;
    const backupDb=[...db];
    db=db.filter(i=>String(i.casperId)!==String(id));
    reportedIds.add(String(p.casperId));
    render();showToast("Processing update...");
    apiPost({action:"report",n:p.name,id:p.casperId,ds:p.darkStore,c:p.city,r:'Exit'})
      .then(res=>{
        if(res.status==="Success")showToast("Report Submitted Successfully ✓");
        else{db=backupDb;reportedIds.delete(String(p.casperId));render();showToast("Report Failed.",true);remoteLogError(res.error,"N/A","Backend rejected");}
      })
      .catch(err=>{db=backupDb;reportedIds.delete(String(p.casperId));render();onNetworkError(err,"Report Submission");});
  }

  function currentExportRows(){ return displayed.length ? displayed : filtered; }

  function exportData(){
    if(isProcessing||filtered.length===0){if(filtered.length===0)showToast("No Data To Export",true);return;}
    setUILock(true);
    try{
      const c=citySelectInstance.getValue(),s=storeSelectInstance.getValue();
      const f=(managerMode?c:s)+" Pendency",h=(managerMode?c+" Summary":s+" Pendency").replace(/\b\w/g,l=>l.toUpperCase());
      const {jsPDF}=window.jspdf,doc=new jsPDF(),w=doc.internal.pageSize.getWidth();
      const st={halign:'center',textColor:0,lineColor:[0,0,0],lineWidth:.2,fontStyle:'bold'};
      const hst={fillColor:[253,253,150],textColor:0,lineColor:[0,0,0],lineWidth:.2};
      doc.setFontSize(16).text(h,w/2,15,{align:"center"});
      doc.setFontSize(9).text(loginTxt,w/2,22,{align:"center"});
      if(managerMode){
        const sortedFiltered=[...filtered].sort((a,b)=>a.clusterManager.localeCompare(b.clusterManager));
        const sd=Object.entries(filtered.reduce((acc,item)=>{acc[item.clusterManager]=(acc[item.clusterManager]||0)+1;return acc;},{})).sort((a,b)=>a[0].localeCompare(b[0]));
        doc.autoTable({head:[['CLUSTER MANAGER','PENDENCY']],body:sd,startY:28,theme:'grid',styles:st,headStyles:hst});
        doc.addPage();
        doc.setFontSize(14).text("Entire Pendency",w/2,15,{align:"center"});
        doc.setFontSize(9).text(loginTxt,w/2,21,{align:"center"});
        doc.autoTable({head:[['CM','STORE','PICKER','ID']],body:sortedFiltered.map(i=>[i.clusterManager,i.darkStore,i.name,i.casperId]),startY:28,theme:'grid',styles:{...st,fontSize:8},headStyles:hst});
      } else {
        doc.autoTable({head:[['PICKER NAME','CASPER ID']],body:currentExportRows().map(i=>[i.name,i.casperId]),startY:30,theme:'grid',styles:st,headStyles:hst});
      }
      doc.save(f+".pdf");setUILock(false);showToast("PDF Downloaded ✓");
    }catch(err){setUILock(false);showToast("Failed to generate PDF",true);remoteLogError(err.message,err.stack,"PDF Export");}
  }

  function exportCSV(){
    if(filtered.length===0){showToast("No Data To Export",true);return;}
    const rows = managerMode
      ? [['Cluster Manager','Pendency'], ...Object.entries(filtered.reduce((a,i)=>{a[i.clusterManager]=(a[i.clusterManager]||0)+1;return a;},{}))]
      : [['Picker Name','Casper ID'], ...currentExportRows().map(i=>[i.name,i.casperId])];
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const c=citySelectInstance.getValue(),s=storeSelectInstance.getValue();
    a.href=url; a.download=(managerMode?c:s)+" Pendency.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("CSV Downloaded ✓");
  }

  function exportToGSheet(){
    if(isProcessing||filtered.length===0){if(filtered.length===0)showToast("No Data To Export",true);return;}
    const btn=document.getElementById('btnGSheet'),c=citySelectInstance.getValue();
    btn.innerText="Generating Sheet...";setUILock(true);
    const f=c+" - Picker Pendency Export";
    const sumData=[['Cluster Manager','Total Pendency'],...Object.entries(filtered.reduce((acc,item)=>{acc[item.clusterManager]=(acc[item.clusterManager]||0)+1;return acc;},{})).sort((a,b)=>a[0].localeCompare(b[0]))];
    const detData=[['Cluster Manager','Store','Name','Casper ID'],...filtered.map(i=>[i.clusterManager,i.darkStore,i.name,i.casperId])];
    apiPost({action:"export",f,summaryData:sumData,detailData:detData})
      .then(data=>{
        btn.innerText="Open As Google Sheet";setUILock(false);
        if(data&&data.url&&!data.url.startsWith("Error")){showToast("Sheet Generated ✓");window.open(data.url,'_blank');}
        else{showToast("Failed To Create Sheet",true);remoteLogError(data.error||data.url,"N/A","GSheet Export");}
      })
      .catch(err=>{btn.innerText="Open As Google Sheet";onNetworkError(err,"GSheet Export");});
  }
</script>
</body>
</html>
