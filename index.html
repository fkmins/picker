<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picker Pendency Dashboard</title>
    
    <!-- Fast CDN styling via Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom dark mode scrollbar -->
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>

<body class="bg-[#0f172a] text-slate-200 min-h-screen flex flex-col items-center justify-start py-10 px-4 font-sans antialiased">

    <!-- Main Container: Centered Alignment -->
    <main class="w-full max-w-4xl flex flex-col gap-6">

        <!-- Title Header (No logo, No refresh button) -->
        <header class="text-center mb-2">
            <h1 class="text-3xl font-bold text-white tracking-wide">Picker Pendency Dashboard</h1>
        </header>

        <!-- Location Cards -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-[#1e293b] border border-slate-700/70 rounded-lg p-4 shadow-md flex items-center justify-center">
                <span class="font-bold text-slate-100 text-lg">Asansol</span>
            </div>
            <div class="bg-[#1e293b] border border-slate-700/70 rounded-lg p-4 shadow-md flex items-center justify-center">
                <span class="font-bold text-slate-100 text-lg">Asn Vivekananda Pally</span>
            </div>
        </section>

        <!-- Metric Cards -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-[#1e293b] border border-slate-700/70 rounded-lg p-8 shadow-md flex flex-col items-center justify-center">
                <div id="pending-count" class="text-5xl font-black text-indigo-500 mb-3">4</div>
                <div class="text-xs font-bold text-slate-400 tracking-wider uppercase">PENDING PICKERS</div>
            </div>
            <div class="bg-[#1e293b] border border-slate-700/70 rounded-lg p-8 shadow-md flex flex-col items-center justify-center">
                <div id="exits-count" class="text-5xl font-black text-indigo-500 mb-3">0</div>
                <div class="text-xs font-bold text-slate-400 tracking-wider uppercase">REPORTED EXITS</div>
            </div>
        </section>

        <!-- Auto Updated Timestamp -->
        <div class="text-center text-xs text-slate-400 mt-[-10px]">
            Data updated: <span id="last-updated">11:03:53 PM</span>
        </div>

        <!-- Picker Pendency Table -->
        <section class="bg-[#1e293b] border border-slate-700/70 rounded-lg overflow-hidden shadow-xl mt-1">
            <div class="overflow-x-auto">
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="bg-[#0f172a] border-b border-slate-700 text-xs text-slate-400 uppercase tracking-wider">
                            <th class="px-6 py-5 font-bold text-center">USER NAME</th>
                            <th class="px-6 py-5 font-bold text-center">USER ID</th>
                            <th class="px-6 py-5 font-bold text-center">ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="picker-rows" class="divide-y divide-slate-700/70">
                        <!-- Static fallback / dynamic rows -->
                        <tr class="hover:bg-[#334155] transition-colors duration-150">
                            <td class="px-6 py-5 text-center font-medium text-slate-200 text-lg">Subha Dhibar</td>
                            <td class="px-6 py-5 text-center font-bold text-indigo-400 text-lg">4326384</td>
                            <td class="px-6 py-5 text-center">
                                <button onclick="handleExitBtn('4326384', this)" class="bg-[#ef4444] hover:bg-red-600 text-white font-bold py-2.5 px-8 rounded shadow-md transition-all focus:outline-none">
                                    Exit
                                </button>
                            </td>
                        </tr>
                        <tr class="hover:bg-[#334155] transition-colors duration-150">
                            <td class="px-6 py-5 text-center font-medium text-slate-200 text-lg">Fahan Alam</td>
                            <td class="px-6 py-5 text-center font-bold text-indigo-400 text-lg">4332841</td>
                            <td class="px-6 py-5 text-center">
                                <button onclick="handleExitBtn('4332841', this)" class="bg-[#ef4444] hover:bg-red-600 text-white font-bold py-2.5 px-8 rounded shadow-md transition-all focus:outline-none">
                                    Exit
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Client Script for Background Execution -->
    <script>
        // Automatic background refresh interval (in milliseconds)
        const REFRESH_RATE = 15000; 

        function runBackgroundSync() {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(updateUI)
                    .withFailureHandler(function(err) {
                        console.warn("Silent sync error:", err);
                    })
                    .getDashboardData();
            } else {
                // Fallback timestamp for standalone testing
                const now = new Date();
                document.getElementById('last-updated').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            }
        }

        function updateUI(data) {
            if (!data) return;
            
            // Update time & metrics silently
            document.getElementById('last-updated').innerText = data.timestamp;
            document.getElementById('pending-count').innerText = data.pendingPickers;
            document.getElementById('exits-count').innerText = data.reportedExits;
        }

        function handleExitBtn(userId, btnElement) {
            btnElement.disabled = true;
            btnElement.innerText = "...";
            
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function() {
                        const row = btnElement.closest('tr');
                        row.remove();
                        runBackgroundSync();
                    })
                    .processPickerExit(userId);
            } else {
                const row = btnElement.closest('tr');
                row.remove();
            }
        }

        // Initialize background loop
        document.addEventListener('DOMContentLoaded', function() {
            runBackgroundSync();
            setInterval(runBackgroundSync, REFRESH_RATE);
        });
    </script>
</body>
</html>
