<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Picker Pendency Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2874F0">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://2dioqsev90.ucarecd.net/1e9d129e-8ea7-488c-919d-345bc4d7dcc4/l71720260823162158.webp">
<link rel="icon" type="image/webp" href="https://2dioqsev90.ucarecd.net/1e9d129e-8ea7-488c-919d-345bc4d7dcc4/l71720260823162158.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://cdnjs.cloudflare.com/ajax/libs/tom-select/2.2.2/css/tom-select.bootstrap5.min.css" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/tom-select/2.2.2/js/tom-select.complete.min.js"></script>
<script>
(function(){
  try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark-mode')}catch(e){}
  var w=['https://rukminim2.flixcart.com/fk-p-flap/1600/780/image/9058b9427a302777.jpg'];
  var c=w[Math.floor(Math.random()*w.length)];
  var s=document.createElement('style');s.textContent='body::before{background-image:url("'+c+'")}';document.head.appendChild(s);
})();
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{display:none}
html,body{scrollbar-width:none;-ms-overflow-style:none}
.table-holder::-webkit-scrollbar{display:none}

:root{
  --fk-blue:#2874F0;--fk-yellow:#FFB400;
  --gold:#D4AF37;--gold-light:#F5E6B8;--gold-glow:rgba(212,175,55,0.25);
  --danger:#ef4444;--success:#10b981;
  --bg-panel:rgba(255,255,255,0.82);--card-bg:rgba(255,255,255,0.97);
  --table-header:rgba(248,250,252,0.99);--table-hover:rgba(241,245,249,0.99);
  --dropdown-hover:rgba(40,116,240,0.10);
  --text-main:#0f172a;--text-muted:#64748b;
  --border-color:rgba(203,213,225,0.8);
  --shadow-panel:0 24px 64px rgba(0,0,0,0.20);
  --shadow-card:0 4px 16px rgba(0,0,0,0.07);
  --blur:blur(22px);
}
:root.dark-mode{
  --bg-panel:rgba(15,23,42,0.88);--card-bg:rgba(15,23,42,0.98);
  --table-header:rgba(8,14,31,0.98);--table-hover:rgba(30,41,59,0.98);
  --dropdown-hover:rgba(40,116,240,0.18);
  --text-main:#f1f5f9;--text-muted:#94a3b8;
  --border-color:rgba(51,65,85,0.8);
}

body::before{content:"";position:fixed;top:0;left:0;width:100vw;height:100vh;background-size:cover;background-position:center;z-index:0}
body::after{content:"";position:fixed;inset:0;background:rgba(15,23,42,0.45);z-index:1;transition:background .3s ease}
:root.dark-mode body::after{background:rgba(5,10,25,0.65)}

#appLoader{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(20,15,5,0.96),rgba(5,10,25,0.98));z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .45s ease}
#appLoader.hidden{opacity:0;pointer-events:none}
.loading-text{font-family:Inter,sans-serif;font-weight:800;font-size:14px;color:var(--gold-light);text-align:center;letter-spacing:.5px}

body{font-family:Inter,system-ui,sans-serif;color:var(--text-main);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;position:relative;z-index:3;text-align:center;}
.glass-panel{background:var(--bg-panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:28px;padding:36px 32px;width:100%;max-width:980px;border:1px solid var(--border-color);box-shadow:var(--shadow-panel);position:relative;z-index:10;}

.header-wrapper{display:flex;align-items:center;justify-content:center;margin-bottom:26px;width:100%;gap:12px;flex-wrap:wrap}
.brand-header{display:flex;align-items:center;gap:12px;flex:1;}
.brand-logo{width:80px;height:44px;border-radius:12px;box-shadow:0 4px 14px rgba(40,116,240,.3);}
.dash-title{font-weight:900;font-size:24px;letter-spacing:-.6px;color:var(--text-main)}
.dash-subtitle{font-size:12px;font-weight:700;color:var(--fk-blue);text-transform:uppercase;}
.header-actions{display:flex;gap:8px;}
.icon-btn{background:var(--card-bg);border:1.5px solid var(--border-color);color:var(--text-main);border-radius:50px;padding:7px 15px;font-size:12px;font-weight:800;cursor:pointer;text-decoration:none}
.icon-btn:hover{border-color:var(--gold)}

.tab-container{display:flex;justify-content:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.btn-tab{border:1.5px solid var(--border-color);padding:11px 26px;border-radius:50px;font-weight:800;font-size:13px;background:var(--card-bg);color:var(--text-muted);cursor:pointer;}
.btn-tab.active{background:var(--fk-blue);color:#fff;border-color:var(--fk-blue);}

.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-bottom:16px;}
.filter-col{flex:1 1 260px;max-width:420px;text-align:center;position:relative;z-index:20}
.filter-col:first-child{z-index:30}

.ts-wrapper .ts-control{border-radius:14px!important;padding:13px 18px!important;border:1.5px solid var(--border-color)!important;font-weight:700!important;font-size:14px!important;background:var(--card-bg)!important;color:var(--text-main)!important;}
.ts-dropdown .option{background:var(--card-bg)!important;color:var(--text-main)!important;text-align:center!important;font-weight:600!important;border-radius:12px!important;}
.search-box{width:100%;border-radius:14px;padding:14px 22px;border:1.5px solid var(--border-color);font-weight:600;font-size:14px;background:var(--card-bg);color:var(--text-main);text-align:center;}

#resultArea{display:none;margin-top:22px;flex-direction:column;align-items:center;width:100%;}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;width:100%;margin-bottom:18px}
.metric-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:18px;padding:22px 18px;text-align:center;}
.metric-card .val{font-size:36px;font-weight:900;color:var(--fk-blue);line-height:1;margin-bottom:8px;}
.metric-card .lbl{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text-muted);}

.action-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:22px;width:100%}
.btn-action{border:none;padding:13px 22px;border-radius:14px;font-weight:800;font-size:13px;flex:1;min-width:150px;cursor:pointer;}
.btn-pdf{background:#1e293b;color:#fff}
.btn-sheet{background:var(--success);color:#fff}
.btn-batch{background:#d97706;color:#fff;display:none}
.btn-batch.visible{display:inline-flex}

.table-holder{background:var(--card-bg);border-radius:18px;width:100%;border:1px solid var(--border-color);max-height:460px;overflow-y:auto;}
.table{border-collapse:collapse;width:100%;min-width:400px;color:var(--text-main);text-align:center}
.table th,.table td{padding:15px 16px;border-bottom:1px solid var(--border-color);}
.table thead th{background:var(--table-header);color:var(--text-muted);font-size:11px;font-weight:800;text-transform:uppercase;}
.table tbody tr:nth-child(even) td{background:var(--table-hover)}

.status-badge{padding:4px 10px;border-radius:8px;font-weight:800;font-size:12px;display:inline-block;}
.status-yes{background:rgba(16,185,129,.15);color:var(--success);}
.status-no{background:rgba(239,68,68,.1);color:var(--danger);}

.btn-exit{background:var(--danger);color:#fff;border:none;padding:8px 20px;border-radius:10px;font-weight:800;font-size:12px;cursor:pointer;}
.btn-exit:disabled{opacity:0.5;cursor:wait;}

#paginationBar{display:none;justify-content:center;align-items:center;gap:14px;margin-top:18px;width:100%;}
.btn-page{background:var(--card-bg);border:1.5px solid var(--border-color);color:var(--text-main);border-radius:50px;padding:8px 18px;font-weight:800;font-size:12px;cursor:pointer;}

#toast-container{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;}
.toast-msg{background:var(--text-main);color:var(--card-bg);padding:13px 28px;border-radius:50px;font-weight:700;font-size:13px;}
.toast-msg.hidden{display:none;}

.exit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99998;display:none;align-items:center;justify-content:center;}
.exit-modal{background:var(--card-bg);border:1.5px solid var(--border-color);border-radius:24px;padding:36px 28px;width:90%;max-width:380px;text-align:center;}
.exit-modal-title{font-weight:900;font-size:20px;margin-bottom:6px;}
.exit-modal-name{font-weight:800;font-size:16px;color:var(--fk-blue);margin-bottom:20px;}
.exit-modal-btn{padding:12px 30px;border-radius:14px;font-weight:800;font-size:14px;border:none;cursor:pointer;}
.exit-btn-confirm{background:var(--danger);color:#fff}
.exit-btn-cancel{background:var(--card-bg);color:var(--text-main);border:1.5px solid var(--border-color)!important}
</style>
</head>
<body>

<div id="appLoader">
  <div class="loading-text">Loading Mix Up Data...</div>
</div>

<div class="glass-panel" id="mainPanel">
  <div class="header-wrapper">
    <div class="brand-header">
      <div class="brand-text">
        <h2 class="dash-title">Picker Pendency Dashboard</h2>
        <div class="dash-subtitle">East - L&amp;D [Flipkart Minutes]</div>
      </div>
    </div>
    <div class="header-actions">
      <a href="completion.html" class="icon-btn">Completion Report</a>
      <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()">Dark Mode</button>
    </div>
  </div>
  
  <div class="tab-container">
    <button id="btnNormal" class="btn-tab active" onclick="setMode(0)">Dark Store Wise</button>
    <button id="btnManager" class="btn-tab" onclick="setMode(1)">Cluster Manager Wise</button>
  </div>
  
  <div class="filter-row">
    <div class="filter-col"><select id="citySelect" autocomplete="off"></select></div>
    <div class="filter-col" id="storeWrapper"><select id="storeSelect" autocomplete="off"></select></div>
  </div>
  
  <div id="resultArea">
    <div class="metrics-grid">
      <div class="metric-card"><div class="val" id="countBadge">0</div><div class="lbl">Total Pendency</div></div>
      <div class="metric-card"><div class="val" id="totalReportedBadge">0</div><div class="lbl">Pending Exits</div></div>
    </div>
    
    <div class="search-wrapper" id="searchWrapper" style="width:100%; margin-bottom:15px;">
      <input type="text" id="searchInput" class="search-box" placeholder="Search Name or Casper ID" oninput="onSearchInput()">
    </div>
    
    <div class="action-buttons">
      <button class="btn-action btn-pdf" id="btnPdf" onclick="exportData()">Export PDF</button>
      <button id="btnGSheet" class="btn-action btn-sheet" onclick="exportToGSheet()">Open as G-Sheet</button>
      <button class="btn-action btn-batch" id="btnBatchExit" onclick="showBatchExitModal()">Batch Exit (<span id="batchCount">0</span>)</button>
    </div>
    
    <div class="table-holder">
      <table class="table">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    
    <div id="paginationBar">
      <button class="btn-page" id="btnPrev" onclick="changePage(-1)">&larr; Prev</button>
      <span class="page-info" id="pageInfo" style="font-size:13px; font-weight:bold;">Page 1</span>
      <button class="btn-page" id="btnNext" onclick="changePage(1)">Next &rarr;</button>
    </div>
  </div>
</div>

<div id="exitModal" class="exit-overlay">
  <div class="exit-modal">
    <div class="exit-modal-title" id="exitModalTitle">Confirm Exit</div>
    <div class="exit-modal-name" id="exitModalName"></div>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button class="exit-modal-btn exit-btn-confirm" id="exitConfirmBtn">Yes, Exit</button>
      <button class="exit-modal-btn exit-btn-cancel" onclick="closeExitModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="toast-container"><div class="toast-msg hidden" id="toastText"></div></div>

<script>
var SCRIPT_URL='https://script.google.com/macros/s/AKfycbxH_jWtTRoLLJHZc7N2JHzfkq7n1virJkuYQbS3mx_onClfwac0UuIsn5jltaA2X4kn/exec';
var PAGE_SIZE=50;

var db=[],filtered=[],reportedIds=new Set(),pendingRowIds=new Set(),selectedIds=new Set();
var cityTS,storeTS,managerMode=false,currentPage=1,isProcessing=false;
var searchQuery='',searchTimer=null,toastTimer=null,pendingExitId=null,isBatchMode=false;

function toggleTheme(){
  var d=document.documentElement.classList.toggle('dark-mode');
  document.getElementById('themeToggleBtn').textContent=d?'Light Mode':'Dark Mode';
}

function showToast(msg){
  var t=document.getElementById('toastText');
  t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.add('hidden')},3000);
}

function apiFetch(url,opts){
  return fetch(url,opts).then(function(r){return r.json()});
}

function loadData(){
  apiFetch(SCRIPT_URL+'?action=getData').then(function(d){
    document.getElementById('appLoader').style.display='none';
    if(d.error) return showToast('Error: '+d.error);
    db=d;
    populateCityOptions();
  }).catch(function(){
    showToast('Network Error');
  });
}

window.onload=function(){
  cityTS=new TomSelect('#citySelect',{placeholder:'Select City', onChange:onCityChange});
  storeTS=new TomSelect('#storeSelect',{placeholder:'Select Dark Store', onChange:function(){currentPage=1;render()}});
  loadData();
};

function populateCityOptions(){
  var cities=[], seen={};
  db.forEach(function(i){
    if(i.ct && !seen[i.ct]){ seen[i.ct]=1; cities.push(i.ct); }
  });
  cities.sort().forEach(function(c){cityTS.addOption({value:c,text:c})});
}

function setMode(m){
  managerMode=!!m; currentPage=1; searchQuery=''; selectedIds.clear();
  document.getElementById('btnNormal').classList.toggle('active',!m);
  document.getElementById('btnManager').classList.toggle('active',!!m);
  document.getElementById('storeWrapper').style.display=m?'none':'';
  document.getElementById('searchWrapper').style.display=m?'none':'';
  if(cityTS.getValue()){ if(managerMode) render(); else onCityChange(); }
}

function onCityChange(){
  var c=cityTS.getValue(); currentPage=1;
  if(!c) return;
  if(!managerMode){
    storeTS.clearOptions(); storeTS.clear();
    var stores=[], seen={};
    db.filter(function(i){return i.ct===c}).forEach(function(i){
      if(i.ds && !seen[i.ds]){ seen[i.ds]=1; stores.push(i.ds); }
    });
    stores.sort().forEach(function(s){storeTS.addOption({value:s,text:s})});
  } else {
    render();
  }
}

function onSearchInput(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(function(){
    searchQuery=document.getElementById('searchInput').value.trim().toLowerCase();
    currentPage=1; render();
  },300);
}

function changePage(d){currentPage+=d; renderTable();}

function render(){
  var c=cityTS.getValue(), s=storeTS.getValue();
  if(!c||(!managerMode&&!s)){document.getElementById('resultArea').style.display='none';return}
  
  filtered=db.filter(function(i){
    if(i.ct!==c) return false;
    if(!managerMode && i.ds!==s) return false;
    if(reportedIds.has(String(i.id))) return false;
    if(searchQuery && !managerMode){
      return String(i.nm).toLowerCase().includes(searchQuery) || String(i.id).toLowerCase().includes(searchQuery);
    }
    return true;
  });
  
  document.getElementById('countBadge').textContent=filtered.length;
  document.getElementById('totalReportedBadge').textContent=reportedIds.size;
  document.getElementById('resultArea').style.display='flex';
  renderTable();
}

function renderTable(){
  var tH=document.getElementById('tableHead'), tB=document.getElementById('tableBody');
  var pB=document.getElementById('paginationBar');
  
  if(!filtered.length){
    tH.innerHTML=''; tB.innerHTML='<tr><td colspan="6">No Records Found</td></tr>';
    pB.style.display='none'; return;
  }
  
  if(managerMode){
    pB.style.display='none';
    var sm={}; var total=0;
    filtered.forEach(function(i){sm[i.cm]=(sm[i.cm]||0)+1; total++;});
    tH.innerHTML='<tr><th>Cluster Manager</th><th>Pendency Count</th></tr>';
    tB.innerHTML=Object.entries(sm).map(function(e){
      return '<tr><td>'+e[0]+'</td><td><b>'+e[1]+'</b></td></tr>';
    }).join('') + '<tr><td><b>TOTAL</b></td><td><b>'+total+'</b></td></tr>';
  } else {
    var tot=Math.ceil(filtered.length/PAGE_SIZE);
    var st=(currentPage-1)*PAGE_SIZE, end=Math.min(st+PAGE_SIZE,filtered.length);
    document.getElementById('pageInfo').textContent='Showing '+(st+1)+' - '+end+' of '+filtered.length;
    pB.style.display='flex';
    
    tH.innerHTML='<tr><th><input type="checkbox" onchange="toggleAll(this)"></th><th>Picker Name</th><th>Casper ID</th><th>Induction</th><th>Refresher</th><th>Action</th></tr>';
    
    tB.innerHTML=filtered.slice(st,end).map(function(i){
      var checked=selectedIds.has(i.id)?'checked':'';
      var indCls=i.ind==='Yes'?'status-yes':'status-no';
      var refCls=i.ref==='Yes'?'status-yes':'status-no';
      return `<tr>
        <td><input type="checkbox" value="${i.id}" ${checked} onchange="toggleRow(this)"></td>
        <td>${i.nm}</td>
        <td><b>${i.id}</b></td>
        <td><span class="status-badge ${indCls}">${i.ind}</span></td>
        <td><span class="status-badge ${refCls}">${i.ref}</span></td>
        <td><button class="btn-exit" onclick="showExitModal('${i.id}')">Exit</button></td>
      </tr>`;
    }).join('');
    
    var btnBatch=document.getElementById('btnBatchExit');
    document.getElementById('batchCount').textContent=selectedIds.size;
    btnBatch.style.display=selectedIds.size>0?'inline-flex':'none';
  }
}

function toggleAll(el){
  var st=(currentPage-1)*PAGE_SIZE, end=Math.min(st+PAGE_SIZE,filtered.length);
  filtered.slice(st,end).forEach(function(i){
    if(el.checked) selectedIds.add(i.id); else selectedIds.delete(i.id);
  });
  renderTable();
}

function toggleRow(el){
  if(el.checked) selectedIds.add(el.value); else selectedIds.delete(el.value);
  renderTable();
}

function showExitModal(id){
  isBatchMode=false; pendingExitId=id;
  document.getElementById('exitModalName').textContent='Exit ID: '+id+'?';
  document.getElementById('exitModal').style.display='flex';
}
function showBatchExitModal(){
  isBatchMode=true;
  document.getElementById('exitModalName').textContent='Exit '+selectedIds.size+' Picker(s)?';
  document.getElementById('exitModal').style.display='flex';
}
function closeExitModal(){ document.getElementById('exitModal').style.display='none'; }

document.getElementById('exitConfirmBtn').onclick=function(){
  closeExitModal();
  if(isBatchMode) processBatchExit();
  else processExit(pendingExitId);
};

function processExit(id){
  var p=filtered.find(function(x){return x.id===id});
  reportedIds.add(id); render(); showToast('Processing...');
  apiFetch(SCRIPT_URL,{method:'POST', body:JSON.stringify({action:'report', id:id, n:p.nm, ds:p.ds, c:p.ct})})
  .then(function(){ showToast('Exited Successfully'); })
  .catch(function(){ showToast('Failed to exit'); reportedIds.delete(id); render(); });
}

function processBatchExit(){
  var ids=Array.from(selectedIds);
  ids.forEach(function(id){reportedIds.add(id)});
  selectedIds.clear(); render(); showToast('Processing Batch...');
  apiFetch(SCRIPT_URL,{method:'POST', body:JSON.stringify({action:'batch_report', ids:ids})})
  .then(function(){ showToast('Batch Exited Successfully'); })
  .catch(function(){ showToast('Batch Failed'); ids.forEach(function(id){reportedIds.delete(id)}); render(); });
}

function exportToGSheet(){
  document.getElementById('btnGSheet').textContent='Generating...';
  var smMap={}; filtered.forEach(function(i){smMap[i.cm]=(smMap[i.cm]||0)+1});
  var sm=[['Cluster Manager','Total Pendency']].concat(Object.entries(smMap));
  var dt=[['Casper ID','Picker Name','Induction','Refresher','City','Store','Cluster Manager']].concat(
    filtered.map(function(i){return[i.id, i.nm, i.ind, i.ref, i.ct, i.ds, i.cm]})
  );
  
  apiFetch(SCRIPT_URL,{method:'POST', body:JSON.stringify({
    action:'export', f:'Pendency_Export', summaryData:sm, detailData:dt
  })}).then(function(d){
    if(d.url) window.open(d.url,'_blank');
    document.getElementById('btnGSheet').textContent='Open as G-Sheet';
  });
}

function exportData(){
  alert("Use Open as G-Sheet or standard print-to-PDF functions for current format exports.");
}
</script>
</body>
</html>
