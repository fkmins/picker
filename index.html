<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <title>Picker Pendency Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="https://disprz.ai/hubfs/Favicon_64%20px%20reverse-final%20(2).png">

    <!-- CDNs: Bootstrap 5.3, TomSelect, Lucide Icons, jsPDF -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tom-select/2.3.1/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tom-select/2.3.1/js/tom-select.complete.min.js"></script>

    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --bg-gradient-light: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
            --bg-gradient-dark: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --glass-bg-light: rgba(255, 255, 255, 0.9);
            --glass-bg-dark: rgba(30, 41, 59, 0.85);
            --glass-border-light: rgba(255, 255, 255, 0.6);
            --glass-border-dark: rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; box-sizing: border-box; }

        body {
            background: var(--bg-gradient-light);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 30px 15px;
            transition: background 0.3s ease;
        }

        [data-bs-theme="dark"] body {
            background: var(--bg-gradient-dark);
            color: #f8fafc;
        }

        .glass-panel {
            background: var(--glass-bg-light);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            max-width: 1000px;
            margin: 0 auto;
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border-light);
            transition: all 0.3s ease;
        }

        [data-bs-theme="dark"] .glass-panel {
            background: var(--glass-bg-dark);
            border-color: var(--glass-border-dark);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .kpi-card {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        [data-bs-theme="dark"] .kpi-card {
            background: rgba(15, 23, 42, 0.5);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .kpi-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.7; }
        .kpi-value { font-size: 24px; font-weight: 800; color: var(--primary-color); margin-top: 4px; }

        .btn-tab {
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            background: #e2e8f0;
            color: #64748b;
            transition: 0.2s;
        }
        [data-bs-theme="dark"] .btn-tab { background: #334155; color: #94a3b8; }
        .btn-tab.active { background: var(--primary-color) !important; color: #fff !important; }

        .table-holder {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        [data-bs-theme="dark"] .table-holder { border-color: rgba(255, 255, 255, 0.08); }

        #appLoader {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #fff;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
        [data-bs-theme="dark"] #appLoader { background: #0f172a; color: #fff; }

        .toast-container-custom {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
        }
    </style>
</head>
<body>

<div id="appLoader">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
    <div class="mt-3 fw-bold color-primary">Loading Dashboard...</div>
</div>

<div class="glass-panel">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0">Picker Pendency Dashboard</h3>
            <small class="text-muted" id="backendBadge">Connecting API...</small>
        </div>
        <button class="btn btn-outline-secondary btn-sm" onclick="toggleTheme()" id="themeBtn">
            <i data-lucide="moon" class="me-1"></i> Dark Mode
        </button>
    </div>

    <!-- Navigation & Refresh -->
    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
        <div class="d-flex gap-2">
            <button id="btnNormal" class="btn-tab active" onclick="setMode(false)">Dark Store Wise</button>
            <button id="btnManager" class="btn-tab" onclick="setMode(true)">Cluster Manager</button>
        </div>
        <button class="btn btn-light btn-sm fw-bold border" onclick="refreshData()" id="btnRefresh">
            <i data-lucide="refresh-cw" class="me-1" id="refreshIcon"></i> Refresh Data
        </button>
    </div>

    <!-- Dropdowns -->
    <div class="row g-2 mb-3">
        <div class="col-12 col-md-6">
            <select id="citySelect" autocomplete="off" onchange="onCityChange()"></select>
        </div>
        <div class="col-12 col-md-6" id="storeWrapper">
            <select id="storeSelect" autocomplete="off" onchange="currentPage=1; render()"></select>
        </div>
    </div>

    <!-- KPI Summary Row -->
    <div class="row g-2 mb-4 d-none" id="kpiRow">
        <div class="col-4">
            <div class="kpi-card">
                <div class="kpi-title">Total Pendency</div>
                <div class="kpi-value" id="kpiTotal">0</div>
            </div>
        </div>
        <div class="col-4">
            <div class="kpi-card">
                <div class="kpi-title">Active Stores</div>
                <div class="kpi-value" id="kpiStores">0</div>
            </div>
        </div>
        <div class="col-4">
            <div class="kpi-card">
                <div class="kpi-title">Managers</div>
                <div class="kpi-value" id="kpiManagers">0</div>
            </div>
        </div>
    </div>

    <!-- Search & Actions -->
    <div id="resultArea" style="display: none;">
        <div class="row g-2 mb-3 w-100 align-items-center">
            <div class="col-12 col-md-6">
                <div class="input-group">
                    <span class="input-group-text"><i data-lucide="search" style="width:16px;"></i></span>
                    <input type="text" id="searchInput" class="form-control" placeholder="Search picker name or Casper ID..." oninput="onSearchInput()">
                </div>
            </div>
            <div class="col-12 col-md-6 d-flex gap-2 justify-content-md-end">
                <button class="btn btn-dark btn-sm fw-bold" onclick="exportData('pdf')"><i data-lucide="file-text" class="me-1"></i> PDF</button>
                <button class="btn btn-outline-success btn-sm fw-bold" onclick="exportData('csv')"><i data-lucide="download" class="me-1"></i> CSV</button>
                <button class="btn btn-success btn-sm fw-bold" onclick="exportToGSheet()"><i data-lucide="sheet" class="me-1"></i> Google Sheet</button>
            </div>
        </div>

        <!-- Data Table -->
        <div class="table-holder w-100 mb-3">
            <table class="table table-hover align-middle mb-0 text-center">
                <thead class="table-light" id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div id="paginationBar" class="d-flex justify-content-between align-items-center w-100 px-2">
            <button class="btn btn-sm btn-outline-secondary fw-bold" id="btnPrev" onclick="changePage(-1)">Previous</button>
            <span id="pageInfo" class="fw-bold small">Page 1 of 1</span>
            <button class="btn btn-sm btn-outline-secondary fw-bold" id="btnNext" onclick="changePage(1)">Next</button>
        </div>
    </div>
</div>

<!-- Modal Confirmation -->
<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Confirm Report</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBodyText">
                Are you sure you want to mark this picker as Exit/Left?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger btn-sm" id="confirmReportBtn">Confirm Exit</button>
            </div>
        </div>
    </div>
</div>

<div class="toast-container-custom">
    <div id="customToast" class="toast align-items-center text-bg-dark border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body fw-bold" id="toastText"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Config: Paste your deployed Web App URL here for GitHub Pages hosting
    const CONFIG = {
        GAS_WEB_APP_URL: "https://script.google.com/macros/s/AKfycbzoe5rWM5JvvF4Qcwsn75mjvySFtv2ITLtIVca5ufZ73i5k7Zd9VicdP3n_cZs4js60GQ/exec",
        PAGE_SIZE: 50,
        LOGIN_TXT: "(Download: Disprz App From Playstore | User ID: Casper ID (452346) | Password: Edl@123)"
    };

    let db = [], filtered = [], displayData = [], managerMode = false, reportedIds = new Set();
    let citySelectInstance, storeSelectInstance, confirmModalObj, toastObj;
    let currentPage = 1, activePickerToReport = null;

    const isGAS = typeof google !== 'undefined' && google.script && google.script.run;

    window.onload = () => {
        lucide.createIcons();
        confirmModalObj = new bootstrap.Modal(document.getElementById('confirmModal'));
        toastObj = new bootstrap.Toast(document.getElementById('customToast'));

        document.getElementById('backendBadge').innerText = isGAS ? "Environment: Google Apps Script" : "Environment: GitHub Pages (REST API)";

        citySelectInstance = new TomSelect("#citySelect", { placeholder: "Select City", create: false });
        storeSelectInstance = new TomSelect("#storeSelect", { placeholder: "Select Dark Store", create: false });

        fetchDashboardData();
    };

    function showToast(msg, isError = false) {
        const toastEl = document.getElementById('customToast');
        toastEl.className = `toast align-items-center border-0 ${isError ? 'text-bg-danger' : 'text-bg-dark'}`;
        document.getElementById('toastText').innerText = msg;
        toastObj.show();
    }

    function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute('data-bs-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-bs-theme', next);
        document.getElementById('themeBtn').innerHTML = next === 'dark' 
            ? `<i data-lucide="sun" class="me-1"></i> Light Mode` 
            : `<i data-lucide="moon" class="me-1"></i> Dark Mode`;
        lucide.createIcons();
    }

    function fetchDashboardData() {
        if (isGAS) {
            google.script.run
                .withSuccessHandler(onDataLoaded)
                .withFailureHandler(err => { hideLoader(); showToast("Error: " + err.message, true); })
                .getSheetData();
        } else {
            if (!CONFIG.GAS_WEB_APP_URL || CONFIG.GAS_WEB_APP_URL.includes("YOUR_DEPLOYED")) {
                hideLoader();
                showToast("Please configure CONFIG.GAS_WEB_APP_URL in script code.", true);
                return;
            }
            fetch(`${CONFIG.GAS_WEB_APP_URL}?action=getData`)
                .then(res => res.json())
                .then(onDataLoaded)
                .catch(err => { hideLoader(); showToast("Fetch Error: " + err.message, true); });
        }
    }

    function onDataLoaded(data) {
        hideLoader();
        if (data && data.error) { showToast("Error: " + data.error, true); return; }
        db = Array.isArray(data) ? data : [];
        const cities = [...new Set(db.map(i => i.city))].sort();
        citySelectInstance.clearOptions();
        cities.forEach(c => citySelectInstance.addOption({ value: c, text: c }));
    }

    function refreshData() {
        const icon = document.getElementById('refreshIcon');
        icon.classList.add('spin-anim');
        fetchDashboardData();
        setTimeout(() => icon.classList.remove('spin-anim'), 1000);
    }

    function setMode(isManager) {
        managerMode = isManager;
        currentPage = 1;
        document.getElementById('btnNormal').classList.toggle('active', !isManager);
        document.getElementById('btnManager').classList.toggle('active', isManager);
        document.getElementById('storeWrapper').style.display = isManager ? 'none' : 'block';
        render();
    }

    function onCityChange() {
        const c = citySelectInstance.getValue();
        currentPage = 1;
        if (!c) { document.getElementById('resultArea').style.display = 'none'; return; }

        if (!managerMode) {
            const stores = [...new Set(db.filter(i => i.city === c).map(i => i.darkStore))].sort();
            storeSelectInstance.clearOptions();
            storeSelectInstance.clear();
            stores.forEach(s => storeSelectInstance.addOption({ value: s, text: s }));
        }
        render();
    }

    function render() {
        const c = citySelectInstance.getValue(), s = storeSelectInstance.getValue();
        if (!c || (!managerMode && !s)) {
            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('kpiRow').classList.add('d-none');
            return;
        }

        filtered = db.filter(i => i.city === c && (managerMode || i.darkStore === s) && !reportedIds.has(String(i.casperId)));
        
        // Update KPI
        document.getElementById('kpiRow').classList.remove('d-none');
        document.getElementById('kpiTotal').innerText = filtered.length;
        document.getElementById('kpiStores').innerText = new Set(filtered.map(i => i.darkStore)).size;
        document.getElementById('kpiManagers').innerText = new Set(filtered.map(i => i.clusterManager)).size;

        document.getElementById('resultArea').style.display = 'block';
        onSearchInput();
    }

    function onSearchInput() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        displayData = filtered.filter(i => 
            String(i.name || '').toLowerCase().includes(query) || 
            String(i.casperId || '').toLowerCase().includes(query)
        );
        renderTable();
    }

    function renderTable() {
        const tHead = document.getElementById('tableHead'), tBody = document.getElementById('tableBody'), pBar = document.getElementById('paginationBar');
        if (displayData.length === 0) {
            tHead.innerHTML = '';
            tBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-muted fw-bold">No Records Found</td></tr>`;
            pBar.style.display = 'none';
            return;
        }

        if (managerMode) {
            pBar.style.display = 'none';
            const sum = {};
            displayData.forEach(i => { sum[i.clusterManager] = (sum[i.clusterManager] || 0) + 1; });
            tHead.innerHTML = '<tr><th>Cluster Manager</th><th>Pendency Count</th></tr>';
            tBody.innerHTML = Object.entries(sum).sort((a,b) => a[0].localeCompare(b[0])).map(([n,v]) => `
                <tr><td>${n || 'N/A'}</td><td><span class="badge bg-primary fs-6">${v}</span></td></tr>
            `).join('');
        } else {
            pBar.style.display = 'flex';
            const totalPages = Math.max(1, Math.ceil(displayData.length / CONFIG.PAGE_SIZE));
            currentPage = Math.min(currentPage, totalPages);
            document.getElementById('pageInfo').innerText = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('btnPrev').disabled = (currentPage === 1);
            document.getElementById('btnNext').disabled = (currentPage === totalPages);

            const start = (currentPage - 1) * CONFIG.PAGE_SIZE;
            tHead.innerHTML = '<tr><th>Picker Name</th><th>Casper ID</th><th>Action</th></tr>';
            tBody.innerHTML = displayData.slice(start, start + CONFIG.PAGE_SIZE).map(i => `
                <tr>
                    <td class="fw-bold">${i.name || 'N/A'}</td>
                    <td><code>${i.casperId || 'N/A'}</code></td>
                    <td>
                        <button class="btn btn-outline-danger btn-sm fw-bold" onclick="promptReport('${i.casperId}')">
                            Report Exit
                        </button>
                    </td>
                </tr>
            `).join('');
        }
    }

    function changePage(dir) { currentPage += dir; renderTable(); }

    function promptReport(id) {
        const p = filtered.find(x => String(x.casperId) === String(id));
        if (!p) return;
        activePickerToReport = p;
        document.getElementById('modalBodyText').innerText = `Are you sure you want to report ${p.name} (ID: ${p.casperId}) as Exit/Left?`;
        document.getElementById('confirmReportBtn').onclick = submitReport;
        confirmModalObj.show();
    }

    function submitReport() {
        confirmModalObj.hide();
        if (!activePickerToReport) return;
        const p = activePickerToReport;
        reportedIds.add(String(p.casperId));
        render();
        showToast("Submitting report...");

        if (isGAS) {
            google.script.run.withSuccessHandler(res => showToast(res === "Success" ? "Reported Successfully ✓" : "Failed: " + res, res !== "Success"))
                .reportPicker(p.name, p.casperId, p.darkStore, p.city, 'Exit');
        } else {
            fetch(CONFIG.GAS_WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'reportPicker', name: p.name, casperId: p.casperId, darkStore: p.darkStore, city: p.city, reason: 'Exit' })
            }).then(r => r.text()).then(() => showToast("Reported Successfully ✓")).catch(err => showToast("Failed: " + err.message, true));
        }
    }

    function exportData(type) {
        if (displayData.length === 0) { showToast("No Data to Export", true); return; }
        if (type === 'csv') {
            const csvContent = "data:text/csv;charset=utf-8," + [["Name", "Casper ID", "Dark Store", "City", "Cluster Manager"].join(",")].concat(displayData.map(e => `"${e.name}","${e.casperId}","${e.darkStore}","${e.city}","${e.clusterManager}"`)).join("\n");
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", `Pendency_Export_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("CSV Downloaded ✓");
        } else if (type === 'pdf') {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Picker Pendency Report", 14, 15);
            doc.autoTable({
                head: [['Name', 'Casper ID', 'Store', 'City']],
                body: displayData.map(i => [i.name, i.casperId, i.darkStore, i.city]),
                startY: 20
            });
            doc.save("Pendency_Report.pdf");
            showToast("PDF Downloaded ✓");
        }
    }

    function exportToGSheet() {
        showToast("Opening Google Sheet Export...");
    }

    function hideLoader() {
        const l = document.getElementById('appLoader');
        if (l) { l.style.opacity = '0'; setTimeout(() => l.style.display = 'none', 500); }
    }
</script>
</body>
</html>
