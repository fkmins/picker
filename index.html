:root{
  --fk-blue:#2874F0;--fk-yellow:#FFB400;
  --gold:#D4AF37;--gold-light:#F5E6B8;--gold-glow:rgba(212,175,55,0.25);
  --danger:#ef4444;--success:#10b981;
  --bg-panel:rgba(255,255,255,0.82);--card-bg:rgba(255,255,255,0.97);
  --table-header:rgba(248,250,252,0.99);--table-hover:rgba(241,245,249,0.99);
  --dropdown-hover:rgba(40,116,240,0.10);
  --text-main:#0f172a;--text-muted:#64748b;
  --border-color:rgba(203,213,225,0.8);
  --shadow-panel:0 24px 64px rgba(0,0,0,0.20);
  --shadow-card:0 4px 16px rgba(0,0,0,0.07);
  --blur:blur(22px);
}
:root.dark-mode{ --dropdown-bg: #1e293b;
  --bg-panel:rgba(15,23,42,0.88);--card-bg:rgba(15,23,42,0.98);
  --table-header:rgba(8,14,31,0.98);--table-hover:rgba(30,41,59,0.98);
  --dropdown-hover:rgba(40,116,240,0.18);
  --text-main:#f1f5f9;--text-muted:#94a3b8;
  --border-color:rgba(51,65,85,0.8);
  --shadow-panel:0 24px 64px rgba(0,0,0,0.55);
  --shadow-card:0 4px 16px rgba(0,0,0,0.3);
}

body::before{content:"";position:fixed;top:0;left:0;width:100vw;height:100vh;background-size:cover;background-position:center;background-repeat:no-repeat;z-index:0;animation:wallFadeIn .8s ease both}
body::after{content:"";position:fixed;inset:0;background:rgba(15,23,42,0.45);z-index:1;transition:background .3s ease}
:root.dark-mode body::after{background:rgba(5,10,25,0.65)}

@keyframes wallFadeIn{from{opacity:0}to{opacity:1}}
#snowCanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:2}

#appLoader{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(20,15,5,0.96),rgba(5,10,25,0.98));z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .45s ease}
#appLoader.hidden{opacity:0;pointer-events:none}
.loader-svg{width:110px;height:110px;background:transparent;object-fit:contain;margin-bottom:10px;filter:drop-shadow(0 0 16px var(--gold-glow))}
.loading-text{font-family:Inter,sans-serif;font-weight:800;font-size:14px;color:var(--gold-light);text-align:center;letter-spacing:.5px;animation:pulseTxt 1.6s ease-in-out infinite}
@keyframes pulseTxt{0%,100%{opacity:1}50%{opacity:.5}}

body{font-family:Inter,'Segoe UI',system-ui,sans-serif;color:var(--text-main);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px 48px;position:relative;z-index:3;text-align:center;transition:color .3s ease}
.glass-panel{background:var(--bg-panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:28px;padding:36px 32px;width:100%;max-width:920px;border:1px solid var(--border-color);box-shadow:var(--shadow-panel);position:relative;z-index:10;text-align:center;transition:background .3s ease,border-color .3s ease;animation:panelSlideUp .5s cubic-bezier(.22,1,.36,1) both}
@keyframes panelSlideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.ui-locked{pointer-events:none;opacity:.6;cursor:wait}

/* TomSelect Strict Absolute Centering Overrides */
.ts-wrapper .ts-control { border-radius: 14px !important; padding: 13px 18px !important; border: 1.5px solid var(--border-color) !important; font-weight: 700 !important; font-size: 14px !important; font-family: Inter, sans-serif !important; background: var(--card-bg) !important; color: var(--text-main) !important; display: flex !important; justify-content: center !important; align-items: center !important; text-align: center !important; }

.ts-wrapper .ts-control > input::placeholder { text-align: center !important; color: var(--text-muted) !important; }
.ts-wrapper .ts-control .item { flex-grow: 1 !important; text-align: center !important; width: 100% !important; display: block !important; }
.ts-wrapper.has-items .ts-control > input { width: 0 !important; opacity: 0 !important; position: absolute !important; }
.ts-wrapper .ts-control.focus { border-color: var(--gold) !important; box-shadow: 0 0 0 3px var(--gold-glow) !important; }
.ts-dropdown { z-index: 9999 !important; background: var(--dropdown-bg, #fff) !important; padding: 0 !important; border-radius: 14px !important; border: 1px solid var(--border-color) !important; background: var(--card-bg) !important; overflow: hidden !important; box-shadow: 0 12px 32px rgba(0,0,0,0.15) !important; text-align: center !important; }
.ts-dropdown .ts-dropdown-content { display: flex; flex-direction: column; text-align: center !important; }
.ts-dropdown .option { background: transparent !important; color: var(--text-main) !important; text-align: center !important; padding: 12px 16px !important; font-weight: 600 !important; font-size: 14px !important; border-radius: 0 !important; margin: 0 !important; border: none !important; border-bottom: 1px solid var(--border-color) !important; box-shadow: none !important; width: 100% !important; justify-content: center !important; }
.ts-dropdown .option:last-child { border-bottom: none !important; }
.ts-dropdown .highlight { background: rgba(40,116,240,0.2) !important; color: inherit !important; padding: 0 2px; border-radius: 3px; }
.ts-dropdown .option:hover, .ts-dropdown .option.active { background: var(--dropdown-hover) !important; color: var(--fk-blue) !important; font-weight: 800 !important; }

.search-wrapper{position:relative;width:100%;margin-bottom:20px}
.search-box{width:100%;border-radius:14px;padding:14px 22px;border:1.5px solid var(--border-color);font-weight:600;font-size:14px;font-family:Inter,sans-serif;background:var(--card-bg);color:var(--text-main);text-align:center}

#resultArea{display:none;margin-top:22px;flex-direction:column;align-items:center;width:100%;animation:fadeIn .4s ease both}

.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;width:100%;margin-bottom:18px}
.metric-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:18px;padding:22px 18px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow-card)}

.action-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:22px;width:100%}

.table-holder{background:var(--card-bg);border-radius:18px;width:100%;border:1px solid var(--border-color);max-height:460px;overflow-y:auto;overflow-x:auto;box-shadow:var(--shadow-card)}
.table{border-collapse:collapse;width:100%;min-width:460px;color:var(--text-main);text-align:center}
.table th,.table td{text-align:center!important;padding:15px 16px;vertical-align:middle}
.table thead th{background:var(--table-header);color:var(--text-muted);font-size:11px;font-weight:800;text-transform:uppercase;position:sticky;top:0;z-index:2;border-bottom:2px solid var(--border-color)}
.table td{font-weight:600;font-size:14px;border-bottom:1px solid var(--border-color)}
.table tbody tr:nth-child(even) td{background:var(--table-hover)}
.table tbody tr:hover td{background:var(--dropdown-hover)}
.total-row td{font-weight:900!important;background:var(--table-header)!important;border-top:2px solid var(--gold)!important;text-transform:uppercase}

.btn-exit{background:linear-gradient(135deg,var(--danger),#b91c1c);color:#fff;border:none;padding:8px 20px;border-radius:10px;font-weight:800;font-size:12px;font-family:Inter,sans-serif;cursor:pointer;transition:transform .2s,opacity .2s}
.btn-exit:hover:not(:disabled){transform:translateY(-2px);opacity:.9}
.btn-exit:disabled{opacity:.45;cursor:wait}
.normal-count{font-weight:800;font-size:15px;color:var(--text-main)}

.status-not-started { color: var(--danger); font-weight: 800; margin-left: 6px; font-size: 13px; }
.status-in-progress { color: var(--fk-yellow); font-weight: 800; margin-left: 6px; font-size: 13px; }

.na-bg{background:rgba(239,68,68,.1);color:var(--danger);padding:3px 10px;border-radius:6px;font-size:12px;border:1px solid rgba(239,68,68,.2);display:inline-block}

#paginationBar{display:none;justify-content:center;align-items:center;gap:14px;margin-top:18px;width:100%}

.btn-page{background:var(--card-bg);border:1.5px solid var(--border-color);color:var(--text-main);border-radius:50px;padding:8px 18px;font-weight:800;font-size:12px;cursor:pointer}

#toast-container{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none}
.toast-msg{background:var(--text-main);color:var(--card-bg);padding:13px 28px;border-radius:50px;font-weight:700;font-size:13px;box-shadow:0 12px 32px rgba(0,0,0,.25);transition:opacity .3s ease,transform .3s ease}
.toast-msg.hidden{opacity:0;transform:translateY(8px)}

.exit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99998;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);animation:fadeIn .2s ease}
.exit-modal{background:var(--card-bg);border:1.5px solid var(--border-color);border-radius:24px;padding:36px 28px 28px;width:90%;max-width:380px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.exit-modal-icon{font-size:52px;margin-bottom:14px}
.exit-modal-title{font-weight:900;font-size:20px;margin-bottom:6px}
.exit-modal-name{font-weight:800;font-size:16px;color:var(--fk-blue);margin-bottom:20px}
.exit-modal-actions{display:flex;gap:12px;justify-content:center}
.exit-modal-btn{padding:12px 30px;border-radius:14px;font-weight:800;font-size:14px;border:none;cursor:pointer;transition:all .2s ease}
.exit-btn-confirm{background:linear-gradient(135deg,var(--danger),#b91c1c);color:#fff}
.exit-btn-cancel{background:var(--card-bg);color:var(--text-main);border:1.5px solid var(--border-color)!important}

@media(max-width:768px){
  body{padding:16px 10px 36px}
  .glass-panel{padding:28px 18px;border-radius:22px}
  .header-wrapper{flex-direction:column;gap:12px}
  .filter-row{gap:10px;flex-direction:column}
  .filter-col{flex:1 1 100%;max-width:100%}
}
</style>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbx9zhgvcvgP00sLBrNksUB5L0h2E30hyjywQmK5n8N3e92bVKlSKrt_mS-5mQXFy_XA/exec';
const LOCAL_CACHE_KEY='pickerDash_v8';
const CACHE_TTL=10*60*1000;
const PAGE_SIZE=50;

let db=[],filtered=[],reportedIds=new Set(),pendingRowIds=new Set();
let cityTS,storeTS,managerMode=false,currentPage=1,isProcessing=false;
let searchQuery='',searchTimer=null,toastTimer=null,pendingExitId=null;

const escHtml=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const checkNA=str=>{const v=String(str??'').trim().toUpperCase();return(!v||v==='N/A'||v==='#N/A'||v==='#NA')?'<span class="na-bg">N/A</span>':escHtml(str)};
function toTitleCase(str) { return str ? String(str).toLowerCase().replace(/\b\w/g, c => c.toUpperCase()) : str; }

function normalizeRow(r){
  return { casperId: r.id, name: toTitleCase(r.nm), ts: r.ts, darkStore: toTitleCase(r.ds), city: toTitleCase(r.ct), clusterManager: toTitleCase(r.cm) };
}

async function apiFetch(url,opts={}){
  const MAX=2,TM=opts.method==='POST'?90000:15000;
  for(let a=0;a<=MAX;a++){
    try{
      const c=new AbortController(),t=setTimeout(()=>c.abort(),TM);
      const r=await fetch(url,{...opts,redirect:'follow',signal:c.signal});
      clearTimeout(t);const txt=await r.text();
      try{return JSON.parse(txt)}catch{throw new Error('Invalid response. Redeploy backend.')}
    }catch(e){if(a===MAX)throw e;await new Promise(r=>setTimeout(r,1000*(a+1)))}
  }
}

function updateThemeTooltip() {
  const isDark = document.documentElement.classList.contains('dark-mode');
  const btn = document.getElementById('themeToggleBtn');
  if (btn) btn.title = isDark ? 'Save Your Eyes' : 'Damage Your Eyes';
}
function toggleTheme(){
  const d=document.documentElement.classList.toggle('dark-mode');
  try{localStorage.setItem('theme',d?'dark':'light')}catch(e){}
  updateThemeTooltip();
}

function hideLoader(){const l=document.getElementById('appLoader');if(!l)return;l.classList.add('hidden');setTimeout(()=>l.style.display='none',450)}
function showToast(msg,err){const t=document.getElementById('toastText');t.textContent=msg;t.style.background=err?'var(--danger)':'var(--text-main)';t.style.color=err?'#fff':'var(--card-bg)';t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),3500)}
function setUILock(on){isProcessing=on;document.getElementById('mainPanel').classList.toggle('ui-locked',on)}

function populateCityOptions(){
  const cur=cityTS.getValue();cityTS.clearOptions();
  [...new Set(db.map(i=>i.city))].filter(v=>v&&v.toUpperCase()!=='N/A').sort().forEach(c=>cityTS.addOption({value:c,text:c}));
  if(cur)cityTS.setValue(cur,true);
}
function loadData(showErr){
  return apiFetch(SCRIPT_URL+'?action=getData').then(d=>{
    hideLoader();
    if(d?.error){showToast('Error: '+d.error,true);return}
    db=Array.isArray(d)?d.map(normalizeRow):[];
    populateCityOptions();
    try{localStorage.setItem(LOCAL_CACHE_KEY,JSON.stringify({data:db,ts:Date.now()}))}catch(e){}
    if(cityTS.getValue()){if(!managerMode)onCityChange(true);render()}
  }).catch(e=>{hideLoader();if(showErr||!db.length)showToast('Network Error: '+(e.message||'Refresh.'),true)});
}

window.onload=()=>{
  updateThemeTooltip();
  cityTS=new TomSelect('#citySelect',{placeholder:'Select City',create:false,sortField:{field:'text'}});
  storeTS=new TomSelect('#storeSelect',{placeholder:'Select Dark Store',create:false,sortField:{field:'text'}});
  const cached=(()=>{try{const r=localStorage.getItem(LOCAL_CACHE_KEY);if(!r)return null;const p=JSON.parse(r);return(Date.now()-p.ts<=CACHE_TTL)?p:null}catch(e){return null}})();
  if(cached){db=cached.data;populateCityOptions();hideLoader()}
  loadData(!cached);
};

function setMode(m){if(isProcessing)return;managerMode=!!m;currentPage=1;searchQuery='';document.getElementById('searchInput').value='';document.getElementById('btnNormal').classList.toggle('active',!m);document.getElementById('btnManager').classList.toggle('active',!!m);document.getElementById('storeWrapper').style.display=m?'none':'';document.getElementById('searchWrapper').style.display=m?'none':'';if(cityTS.getValue()){if(managerMode)render();else onCityChange()}else document.getElementById('resultArea').style.display='none'}
function onCityChange(silent){if(isProcessing)return;const c=cityTS.getValue();currentPage=1;if(!c){document.getElementById('resultArea').style.display='none';return}if(managerMode){if(!silent)render();return}const prev=storeTS.getValue();storeTS.clearOptions();if(!silent)storeTS.clear();[...new Set(db.filter(i=>i.city===c).map(i=>i.darkStore))].filter(v=>v&&v.toUpperCase()!=='N/A').sort().forEach(s=>storeTS.addOption({value:s,text:s}));if(prev&&silent)storeTS.setValue(prev,true);if(!silent)document.getElementById('resultArea').style.display='none'}
function onSearchInput(){clearTimeout(searchTimer);searchTimer=setTimeout(()=>{searchQuery=document.getElementById('searchInput').value.trim().toLowerCase();currentPage=1;render()},240)}

function changePage(d){currentPage+=d;renderTable()}
function render(){
  const c=cityTS.getValue(),s=storeTS.getValue();
  if(!c||(!managerMode&&!s)){document.getElementById('resultArea').style.display='none';return}
  filtered=db.filter(i=>{if(i.city!==c)return false;if(!managerMode&&i.darkStore!==s)return false;if(reportedIds.has(String(i.casperId)))return false;if(searchQuery&&!managerMode)return String(i.name).toLowerCase().includes(searchQuery)||String(i.casperId).toLowerCase().includes(searchQuery);return true});
  document.getElementById('countBadge').textContent=filtered.length;
  document.getElementById('totalReportedBadge').textContent=reportedIds.size;
  document.getElementById('resultArea').style.display='flex';renderTable();
}

function renderTable(){
  const tH=document.getElementById('tableHead'),tB=document.getElementById('tableBody'),pB=document.getElementById('paginationBar');
  if(!filtered.length){tH.innerHTML='';tB.innerHTML='<tr><td colspan="'+(managerMode?2:4)+'" style="padding:32px;color:var(--text-muted);font-weight:700">No Records Found</td></tr>';pB.style.display='none';return}
  
  if(managerMode){
    pB.style.display='none';
    const sm={};let total=0;
    filtered.forEach(i=>{sm[i.clusterManager]=(sm[i.clusterManager]||0)+1; total++});
    tH.innerHTML='<tr><th>Cluster Manager</th><th>Pendency Count</th></tr>';
    
    let html = Object.entries(sm).sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0])).map(([n,v])=>{
      return '<tr><td>'+checkNA(n)+'</td><td><span class="normal-count">'+v+'</span></td></tr>';
    }).join('');
    
    html += '<tr class="total-row"><td><strong>TOTAL</strong></td><td><strong>'+total+'</strong></td></tr>';
    tB.innerHTML = html;
  }
  else{
    const tot=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
    currentPage=Math.min(currentPage,tot);
    const st=(currentPage-1)*PAGE_SIZE,end=Math.min(st+PAGE_SIZE,filtered.length);
    
    /* Strict Pagination text */
    document.getElementById('pageInfo').textContent = (st+1) + ' - ' + end + ' of ' + filtered.length;
    
    document.getElementById('btnPrev').disabled=(currentPage===1);
    document.getElementById('btnNext').disabled=(currentPage===tot);
    pB.style.display='flex';
    
    /* Headers updated exactly to user requirement */
    tH.innerHTML='<tr><th><input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)"></th><th>Sl.</th><th>Picker Name</th><th>Casper ID</th><th>Action</th></tr>';
    
    tB.innerHTML=filtered.slice(st,end).map((i,idx)=> {
      let statusHtml = '';
      if(i.ts === 'Not Started') statusHtml = '<span class="status-not-started">(Not Started)</span>';
      else if(i.ts === 'In-Progress' || i.ts === 'In Progress') statusHtml = '<span class="status-in-progress">(In-Progress)</span>';
      
      return '<tr id="row-'+escHtml(i.casperId)+'">' + '<td><input type="checkbox" class="row-checkbox" value="'+escHtml(i.casperId)+'" onchange="updateBatchExitBtn()" '+(pendingRowIds.has(String(i.casperId))?'disabled':'')+'></td><td style="color:var(--text-muted);font-size:12px;font-weight:700">'+(st+idx+1)+'</td><td>'+checkNA(i.name)+statusHtml+'</td><td><span class="pill-id">'+checkNA(i.casperId)+'</span></td><td><button class="btn-exit" '+(pendingRowIds.has(String(i.casperId))?'disabled':'')+' onclick="showExitModal(\''+escHtml(i.casperId)+'\')">Exit</button></td></tr>'
    }).join('');
  }
}

function toggleSelectAll(cb) {
  document.querySelectorAll('.row-checkbox:not(:disabled)').forEach(el => el.checked = cb.checked);
  updateBatchExitBtn();
}
function updateBatchExitBtn() {
  const selectedCount = document.querySelectorAll('.row-checkbox:checked').length;
  const btn = document.getElementById('btnBatchExit');
  if (selectedCount > 0) {
    btn.style.display = 'inline-block';
    btn.textContent = 'Batch Exit Selected (' + selectedCount + ')';
  } else {
    btn.style.display = 'none';
  }
}
function showBatchExitModal() {
  const selected = Array.from(document.querySelectorAll('.row-checkbox:checked')).map(el => el.value);
  if (selected.length === 0) return;
  pendingExitId = 'BATCH';
  document.getElementById('exitModalName').textContent = 'Mark ' + selected.length + ' picker(s) as exited?';
  document.getElementById('exitModal').style.display='flex';
  document.getElementById('exitConfirmBtn').focus();
}
function initiateBatchSubmit() {
  const selectedIds = Array.from(document.querySelectorAll('.row-checkbox:checked')).map(el => el.value);
  if (selectedIds.length === 0) return;
  
  const payloadExits = [];
  selectedIds.forEach(idStr => {
    const p = filtered.find(x => String(x.casperId) === idStr);
    if (p && !pendingRowIds.has(idStr)) {
      pendingRowIds.add(idStr);
      payloadExits.push({ id: p.casperId, n: p.name, ds: p.darkStore, c: p.city, r: 'Exit' });
    }
  });
  if (payloadExits.length === 0) return;
  
  const backup = [...db];
  db = db.filter(i => !payloadExits.some(ex => String(ex.id) === String(i.casperId)));
  payloadExits.forEach(ex => reportedIds.add(String(ex.id)));
  
  render();
  showToast('Processing ' + payloadExits.length + ' exits...');
  
  apiFetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'batch_report', exits: payloadExits })
  })
  .then(res => {
    if (res.status === 'Success') {
      showToast(res.processed + ' Exits Processed');
      try { localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ data: db, ts: Date.now() })); } catch(e) {}
    } else {
      throw new Error(res.error);
    }
  })
  .catch(() => {
    db = backup;
    payloadExits.forEach(ex => reportedIds.delete(String(ex.id)));
    render();
    showToast('Failed. Retry.', true);
  })
  .finally(() => {
    payloadExits.forEach(ex => pendingRowIds.delete(String(ex.id)));
    renderTable();
    updateBatchExitBtn();
  });
}
function showExitModal(id){const p=filtered.find(x=>String(x.casperId)===String(id));const label=(p&&p.name&&p.name.toUpperCase()!=='N/A')?p.name:id;pendingExitId=id;document.getElementById('exitModalName').textContent='Mark "'+label+'" as exited?';document.getElementById('exitModal').style.display='flex';document.getElementById('exitConfirmBtn').focus()}
function closeExitModal(){document.getElementById('exitModal').style.display='none';pendingExitId=null}
document.getElementById('exitConfirmBtn').addEventListener('click',function(){if(pendingExitId){const id=pendingExitId;closeExitModal();initiateSubmit(id)}});
document.getElementById('exitModal').addEventListener('click',function(e){if(e.target===this)closeExitModal()});

function initiateSubmit(id){
  if(id==='BATCH'){initiateBatchSubmit();return;}
  const idStr=String(id);if(pendingRowIds.has(idStr))return;
  const p=filtered.find(x=>String(x.casperId)===idStr);if(!p)return;
  pendingRowIds.add(idStr);const backup=[...db];
  db=db.filter(i=>String(i.casperId)!==idStr);reportedIds.add(idStr);render();showToast('Processing exit...');
  apiFetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'report',n:p.name,id:p.casperId,ds:p.darkStore,c:p.city})})
  .then(res=>{if(res.status==='Success'){showToast('Exit Processed');try{localStorage.setItem(LOCAL_CACHE_KEY,JSON.stringify({data:db,ts:Date.now()}))}catch(e){}}else throw new Error(res.error)})
  .catch(()=>{db=backup;reportedIds.delete(idStr);render();showToast('Failed. Retry.',true)})
  .finally(()=>{pendingRowIds.delete(idStr);renderTable()});
}

const _ls={};
function loadScript(src){if(_ls[src])return _ls[src];_ls[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=()=>{delete _ls[src];rej(new Error('Failed: '+src))};document.head.appendChild(s)});return _ls[src]}
async function ensureJsPdf(){if(window.jspdf&&typeof window.jspdf.jsPDF==='function')return;await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js');if(!window.jspdf)throw new Error('PDF library failed.')}

async function exportData(){
  if(!filtered.length||isProcessing)return;setUILock(true);
  const btn = document.getElementById('btnPdf');
  btn.textContent = 'Generating...';
  try{await ensureJsPdf();
    const{jsPDF}=window.jspdf,doc=new jsPDF({compress:true});
    const pw=doc.internal.pageSize.getWidth();
    const hd={fillColor:[230,230,230],textColor:[0,0,0],fontStyle:'bold',halign:'center',lineWidth:0.8,lineColor:[0,0,0]};
    const bd={halign:'center',textColor:[0,0,0],fontSize:9,lineWidth:0.8,lineColor:[0,0,0]};
    const c=cityTS?cityTS.getValue():'',s=storeTS?storeTS.getValue():'';
    
    doc.setFontSize(14).setTextColor(0,0,0).text(managerMode?'Pendency Summary \u2014 '+c:'Picker Pendency \u2014 '+(s||c),pw/2,14,{align:'center'});
    
    if(managerMode){
      const sm={};filtered.forEach(i=>sm[i.clusterManager]=(sm[i.clusterManager]||0)+1);
      const sortedEntries = Object.entries(sm).sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
      doc.autoTable({
        head:[['Cluster Manager','Count']], body:sortedEntries, startY:22, headStyles:hd, styles:bd, theme:'grid',
        didParseCell: function(data) {
          if (data.section === 'body' && data.column.index === 1) {
            const val = parseInt(data.cell.raw);
            if (!isNaN(val)) {
              if (val > 20) { data.cell.styles.fillColor = [254, 226, 226]; data.cell.styles.textColor = [153, 27, 27]; }
              else if (val >= 10) { data.cell.styles.fillColor = [254, 240, 138]; data.cell.styles.textColor = [133, 77, 14]; }
              else { data.cell.styles.fillColor = [220, 252, 231]; data.cell.styles.textColor = [22, 101, 52]; }
            }
          }
        }
      })
    }
    else{
      doc.autoTable({head:[['Sl.','Picker Name','Casper ID', 'Status']],body:filtered.map((i,idx)=>[idx+1,i.name||'',i.casperId||'', i.ts||'']),startY:22,headStyles:hd,styles:bd,theme:'grid'})
    }
    doc.save(((managerMode?c+'_Summary':(s||c)+'_Pendency')+'.pdf').replace(/[^a-zA-Z0-9_.-]/g,'_'));
    showToast('PDF Downloaded');
  }catch(e){showToast('PDF failed: '+e.message,true)}finally{ setUILock(false); btn.innerHTML = 'Export PDF'; }
}

function exportToGSheet(){
  if(!filtered.length||isProcessing)return;
  const btn=document.getElementById('btnGSheet');
  btn.textContent='Generating...';setUILock(true);
  
  const smMap={};filtered.forEach(i=>smMap[i.clusterManager]=(smMap[i.clusterManager]||0)+1);
  const sm=[['Cluster Manager','Total Pendency'],...Object.entries(smMap).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]))];
  const dt=[['CMSM','Dark Store','Name','Casper ID', 'Status'],...filtered.map(i=>[i.clusterManager||'',i.darkStore||'',i.name||'',i.casperId||'', i.ts||''])];
  const c=cityTS?cityTS.getValue():'',s=storeTS?storeTS.getValue():'';
  const fTitle=((managerMode?c+'_Pendency':(s||c)+'_Pendency')).replace(/[^a-zA-Z0-9_-]/g,'_');
  apiFetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'export',f:fTitle,summaryData:sm,detailData:dt})})
  .then(d=>{if(d.url){window.open(d.url,'_blank');showToast('G-Sheet Created')}else throw new Error(d.error||'No URL')})
  .catch(e=>showToast('Export failed: '+(e.message||'Retry.'),true)).finally(()=>{ btn.innerHTML='Open as G-Sheet'; setUILock(false); });
}

function initSnow(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cvs=document.getElementById('snowCanvas');if(!cvs)return;const ctx=cvs.getContext('2d');
  let w,h,fl=[],on=true;const N=innerWidth<768?15:40;
  function rz(){w=cvs.width=innerWidth;h=cvs.height=innerHeight}
  function mk(){return{x:Math.random()*w,y:Math.random()*h,r:Math.random()*2.5+.7,sp:Math.random()*.8+.18,dr:Math.random()*.5-.25,op:Math.random()*.4+.18,wb:Math.random()*Math.PI*2,ws:Math.random()*.02+.005}}
  function sd(){fl=Array.from({length:N},mk)}
  function tk(){if(!on)return;ctx.clearRect(0,0,w,h);for(let k=0;k<fl.length;k++){const f=fl[k];f.wb+=f.ws;f.y+=f.sp;f.x+=f.dr+Math.sin(f.wb)*.35;if(f.y>h+5)Object.assign(f,mk(),{y:-5,x:Math.random()*w});if(f.x>w+5)f.x=-5;else if(f.x<-5)f.x=w+5;ctx.globalAlpha=f.op;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(tk)}
  addEventListener('resize',()=>{rz();sd()},{passive:true});
  document.addEventListener('visibilitychange',()=>{on=!document.hidden;if(on)tk()});
  rz();sd();tk();
}
if('requestIdleCallback'in window)requestIdleCallback(initSnow,{timeout:1500});else setTimeout(initSnow,300);
