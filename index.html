<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flipkart Minutes | Picker Pendency Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BA0843">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tom-select/2.2.2/css/tom-select.bootstrap5.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="common.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/tom-select/2.2.2/js/tom-select.complete.min.js" crossorigin="anonymous"></script>
<script defer src="common.js"></script>
<style>
.tab-container{display:flex;justify-content:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.btn-tab{
  border:1.5px solid var(--border-color);padding:11px 26px;border-radius:50px;font-weight:800;
  font-size:13px;background:var(--card-bg);color:var(--text-muted);transition:all .22s cubic-bezier(.22,1,.36,1);
  flex:1;max-width:220px;cursor:pointer;font-family:inherit;
}
.btn-tab:hover:not(.active){border-color:var(--fk-yellow);color:var(--fk-yellow);transform:translateY(-1px)}
.btn-tab.active{
  background:linear-gradient(135deg,var(--fk-crimson),#880E4F);color:#fff;border-color:var(--fk-crimson-light);
  box-shadow:0 6px 18px var(--fk-crimson-glow);
}

.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-bottom:16px;width:100%}
.filter-col{flex:1 1 260px;max-width:420px}

.search-wrapper{width:100%;margin-bottom:20px}
.search-box{
  width:100%;border-radius:14px;padding:14px 22px;border:1.5px solid var(--border-color);
  font-weight:600;font-size:14px;font-family:inherit;background:var(--card-bg);
  color:var(--text-main);text-align:center;transition:border-color .2s,box-shadow .2s;
}
.search-box:focus{border-color:var(--fk-crimson-light);outline:none;box-shadow:0 0 0 3px var(--fk-crimson-glow)}

#resultArea{display:none;margin-top:22px;flex-direction:column;align-items:center;width:100%;animation:fadeIn .4s ease both}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;width:100%;margin-bottom:18px}
.metric-card{
  background:var(--card-bg);border:1.5px solid var(--border-color);border-radius:18px;
  padding:22px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow-card);
}
.metric-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3.5px;
  background:linear-gradient(90deg,var(--fk-crimson),var(--fk-yellow),var(--fk-crimson));
}
.metric-card .val{
  font-size:36px;font-weight:900;
  background:linear-gradient(135deg,var(--fk-crimson),var(--fk-yellow));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;
}
.metric-card .lbl{font-size:11.5px;font-weight:900;text-transform:uppercase;color:var(--text-muted);letter-spacing:.8px}

.action-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:22px;width:100%}
.btn-action{
  border:none;padding:13px 24px;border-radius:14px;font-weight:800;font-size:13.5px;
  font-family:inherit;flex:1;min-width:150px;cursor:pointer;color:#fff;transition:transform .2s ease,box-shadow .2s ease;
}
.btn-action:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.btn-pdf{background:linear-gradient(135deg,#334155,#1e293b)}
.btn-sheet{background:linear-gradient(135deg,#10b981,#047857)}
.btn-batch{background:linear-gradient(135deg,var(--fk-crimson),#880E4F);display:none}
.btn-batch.visible{display:inline-block}

.row-check,.select-all-check{width:18px;height:18px;cursor:pointer;accent-color:var(--fk-crimson);vertical-align:middle}

/* Exit Modal */
.exit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99998;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);animation:fadeIn .2s ease}
.exit-modal{
  background:var(--solid);border:1.5px solid var(--border-color);border-radius:22px;
  padding:32px 26px 26px;width:90%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.5);
  animation:panelUp .3s cubic-bezier(.22,1,.36,1);
}
.exit-modal-title{font-weight:900;font-size:19px;margin-bottom:6px;color:var(--text-main)}
.exit-modal-name{font-weight:800;font-size:15px;color:var(--fk-crimson-light);margin-bottom:16px;word-break:break-word}
.exit-modal-actions{display:flex;gap:12px;justify-content:center;margin-top:22px}
.exit-modal-btn{padding:11px 26px;border-radius:12px;font-weight:800;font-size:13.5px;border:none;cursor:pointer;font-family:inherit}
.exit-btn-confirm{background:linear-gradient(135deg,var(--fk-crimson),#880E4F);color:#fff}
.exit-btn-cancel{background:var(--card-bg);color:var(--text-main);border:1.5px solid var(--border-color)}
</style>
</head>
<body>

<div id="fsLoader"><div class="spinner"></div><div style="font-weight:700;color:#fff;" id="fsLoaderText">Processing...</div></div>

<div id="appLoader">
  <img class="loader-svg" src="https://2dioqsev90.ucarecd.net/aeeac257-6b3a-4e9e-a8ac-10f5a73d9bc1/Loadercat1.svg" alt="Loading">
  <div class="loading-text">Loading Dashboard Data</div>
</div>

<main class="glass-panel" id="mainPanel">
  <div class="hdr">
    <div class="hdr-brand">
      <h1 class="hdr-title">
        <span class="fk-brand-yellow">Flipkart</span>
        <span class="fk-brand-red">Minutes</span>
        <span class="fk-brand-white">Dashboard</span>
      </h1>
      <div class="hdr-sub">
        <span class="btn-logo-tag">East - L&amp;D</span>
      </div>
    </div>
    <div class="hdr-actions">
      <a href="completion.html" class="icon-btn">Completion Report</a>
      <button class="icon-btn" id="themeBtn" data-action="theme">Save Your Eyes</button>
    </div>
  </div>
  <hr class="divider">

  <div class="tab-container">
    <button id="btnNormal" class="btn-tab active" data-action="mode" data-mode="0">Dark Store Wise</button>
    <button id="btnManager" class="btn-tab" data-action="mode" data-mode="1">Cluster Manager Wise</button>
  </div>
  
  <div class="filter-row">
    <div class="filter-col"><select id="citySelect" autocomplete="off" aria-label="City"></select></div>
    <div class="filter-col" id="storeWrapper"><select id="storeSelect" autocomplete="off" aria-label="Dark store"></select></div>
  </div>

  <div id="resultArea">
    <div class="metrics-grid">
      <div class="metric-card"><div class="val" id="countBadge">0</div><div class="lbl">Pending Pickers</div></div>
      <div class="metric-card"><div class="val" id="exitedBadge">0</div><div class="lbl">Inactive Picker</div></div>
    </div>
    <div class="search-wrapper" id="searchWrapper">
      <input type="search" id="searchInput" class="search-box" placeholder="Search Name or Casper ID" autocomplete="off">
    </div>
    <div class="action-buttons">
      <button class="btn-action btn-pdf" id="btnPdf" data-action="pdf">Export PDF</button>
      <button class="btn-action btn-sheet" id="btnGSheet" data-action="gsheet">Export G-Sheet</button>
      <button class="btn-action btn-batch" id="btnBatchExit" data-action="batchExit">Mark Inactive (<span id="batchCount">0</span>)</button>
    </div>
    <div class="table-holder">
      <table class="table"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
    </div>
  </div>
</main>

<!-- Inactive / Exit Confirmation Modal -->
<div id="exitModal" class="exit-overlay" style="display:none" role="dialog" aria-modal="true">
  <div class="exit-modal">
    <div class="exit-modal-title" id="exitModalTitle">Confirm Inactive Pickers</div>
    <div class="exit-modal-name" id="exitModalName"></div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">These picker(s) will be recorded as Inactive and removed from active pendency.</p>
    <div class="exit-modal-actions">
      <button class="exit-modal-btn exit-btn-confirm" id="exitConfirmBtn" data-action="confirmExit">Yes, Mark Inactive</button>
      <button class="exit-modal-btn exit-btn-cancel" data-action="closeExit">Cancel</button>
    </div>
  </div>
</div>

<div id="toast-container"><div class="toast-msg hidden" id="toastText"></div></div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var $ = FK.$, esc = FK.esc;
  var CACHE_KEY = 'pickerDash_v16';
  var db = [], filtered = [], selected = new Set();
  var cityTS, storeTS, managerMode = false, loading = false;
  var exitTarget = null, exitIsBatch = false;

  FK.registerSW();
  FK.syncThemeBtn();
  FK.syncOfflineQueue();

  function normalizeRow(r) {
    var id = FK.clean(r.id), wh = FK.clean(r.wh);
    if (!id) return null;
    return {
      id: id,
      name: FK.titleCase(FK.clean(r.nm)) || 'N/A',
      darkStore: FK.titleCase(FK.clean(r.ds)) || (wh ? 'Store ' + wh : 'Unmapped Store'),
      city: FK.titleCase(FK.clean(r.ct)) || 'Unmapped City',
      cm: FK.titleCase(FK.clean(r.cm)) || 'N/A'
    };
  }

  function loadData(showErr, preserveSelection) {
    if (loading) return;
    loading = true;
    FK.fetchJson(FK.API_URL + '?action=getData').then(function (d) {
      if (d && d.error) throw new Error(d.error);
      db = d.map(normalizeRow).filter(Boolean);
      FK.writeCache(CACHE_KEY, db);
      if (!preserveSelection) selected.clear();
      refreshFilters();
    }).catch(function (e) {
      if (showErr || !db.length) FK.toast(FK.isNetworkError(e) ? 'Network Error.' : 'Error: ' + e.message, true, 5000);
    }).then(function () { loading = false; FK.hideLoader(); });
  }

  setInterval(function () {
    if (!document.hidden && navigator.onLine) loadData(false, true);
  }, 60000);

  function uniq(arr, key) {
    var seen = {}, out = [];
    arr.forEach(function (r) { if (!seen[r[key]]) { seen[r[key]] = 1; out.push(r[key]); } });
    return out.sort(function (a, b) { return a.localeCompare(b); });
  }

  function fillSelect(ts, values, keep) {
    var cur = ts.getValue();
    ts.clear(true); ts.clearOptions();
    values.forEach(function (v) { ts.addOption({ value: v, text: v }); });
    if (keep && cur && values.indexOf(cur) !== -1) ts.setValue(cur, true);
  }

  function refreshFilters() {
    fillSelect(cityTS, uniq(db, 'city'), true);
    if (!managerMode) fillSelect(storeTS, storesOf(cityTS.getValue()), true);
    render();
  }

  function storesOf(city) {
    return city ? uniq(db.filter(function (i) { return i.city === city; }), 'darkStore') : [];
  }

  function onCityChange() {
    selected.clear();
    fillSelect(storeTS, storesOf(cityTS.getValue()), false);
    render();
  }

  function syncURLParams(city, store, mMode) {
    var u = new URL(window.location);
    if (city) u.searchParams.set('city', city); else u.searchParams.delete('city');
    if (store && !mMode) u.searchParams.set('store', store); else u.searchParams.delete('store');
    u.searchParams.set('mode', mMode ? '1' : '0');
    window.history.replaceState({}, '', u);
  }

  function setMode(m) {
    managerMode = m; selected.clear(); $('searchInput').value = '';
    $('btnNormal').classList.toggle('active', !m); $('btnManager').classList.toggle('active', m);
    $('storeWrapper').style.display = m ? 'none' : '';
    $('searchWrapper').style.display = m ? 'none' : '';
    if (!m) fillSelect(storeTS, storesOf(cityTS.getValue()), true);
    syncURLParams(cityTS.getValue(), storeTS.getValue(), m);
    render();
  }

  var checkNA = function (v) { return FK.isNA(v) ? '<span style="color:var(--text-muted)">N/A</span>' : esc(v); };

  function render() {
    var c = cityTS.getValue(), s = storeTS.getValue();
    syncURLParams(c, s, managerMode);

    if (!c || (!managerMode && !s)) {
      $('resultArea').style.display = 'none';
      updateBatchUI();
      return;
    }

    filtered = db.filter(function (i) {
      if (i.city !== c) return false;
      return managerMode ? true : i.darkStore === s;
    });

    var queue = JSON.parse(FK.store.get('fk_offline_exits') || '[]');
    $('countBadge').textContent = filtered.length;
    $('exitedBadge').textContent = queue.length;
    $('resultArea').style.display = 'flex';

    var tH = $('tableHead'), tB = $('tableBody');
    if (!filtered.length) {
      tH.innerHTML = '';
      tB.innerHTML = '<tr><td class="empty-cell" colspan="3">No Records Found</td></tr>';
      updateBatchUI();
      return;
    }

    if (managerMode) {
      tH.innerHTML = '<tr><th>Cluster Manager</th><th>Pendency Count</th></tr>';
      var grouped = {}, rowsHtml = '', total = 0;
      filtered.forEach(function (i) { grouped[i.cm] = (grouped[i.cm] || 0) + 1; total++; });
      Object.keys(grouped).sort().forEach(function (k) {
        rowsHtml += '<tr><td>' + checkNA(k) + '</td><td><span class="normal-count">' + grouped[k] + '</span></td></tr>';
      });
      rowsHtml += '<tr class="total-row"><td>Total</td><td>' + total + '</td></tr>';
      tB.innerHTML = rowsHtml;
      updateBatchUI();
      return;
    }

    // Exact columns: Checkbox | Picker Name | Casper ID
    tH.innerHTML = '<tr><th style="width:48px"><input type="checkbox" class="select-all-check" id="selectAllCheck" aria-label="Select all"></th>' +
      '<th>Picker Name</th><th>Casper ID</th></tr>';

    tB.innerHTML = filtered.map(function (i) {
      var id = esc(i.id), chk = selected.has(id);
      return '<tr' + (chk ? ' class="tr-selected"' : '') + '>' +
        '<td><input type="checkbox" class="row-check" data-id="' + id + '" ' + (chk ? 'checked' : '') + '></td>' +
        '<td class="p-name">' + checkNA(i.name) + '</td>' +
        '<td class="p-id"><button type="button" class="pill-id" data-action="copy" data-id="' + id + '">' + id + '</button></td>' +
        '</tr>';
    }).join('');

    $('selectAllCheck').checked = selected.size > 0 && selected.size === filtered.length;
    updateBatchUI();
  }

  $('searchInput').addEventListener('input', function () {
    var q = this.value.trim().toLowerCase();
    var rows = $('tableBody').querySelectorAll('tr');
    rows.forEach(function (r) {
      var n = r.querySelector('.p-name'), c = r.querySelector('.p-id');
      if (n && c) {
        r.style.display = (n.textContent.toLowerCase().includes(q) || c.textContent.toLowerCase().includes(q)) ? '' : 'none';
      }
    });
  });

  function updateBatchUI() {
    $('batchCount').textContent = selected.size;
    $('btnBatchExit').classList.toggle('visible', selected.size > 0 && !managerMode);
  }

  $('tableHead').addEventListener('change', function (e) {
    if (e.target.id !== 'selectAllCheck') return;
    var rows = $('tableBody').querySelectorAll('tr');
    rows.forEach(function (r) {
      if (r.style.display !== 'none') {
        var chk = r.querySelector('.row-check');
        if (chk) {
          var id = chk.getAttribute('data-id');
          if (e.target.checked) selected.add(id); else selected.delete(id);
        }
      }
    });
    render();
  });

  $('tableBody').addEventListener('change', function (e) {
    if (!e.target.classList.contains('row-check')) return;
    var id = e.target.getAttribute('data-id');
    if (e.target.checked) selected.add(id); else selected.delete(id);
    render();
  });

  /* ── Casper ID Click to Copy (Single Clean Feedback) ── */
  function copyCasperId(id, pill) {
    var orig = pill.textContent;
    pill.textContent = '✓ Copied';
    pill.classList.add('pill-id-copied');
    setTimeout(function () {
      pill.textContent = orig;
      pill.classList.remove('pill-id-copied');
    }, 1200);

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(id).catch(function () {});
    }
    FK.toast('Copied Casper ID: ' + id);
  }

  /* ── Exit Modal ── */
  function showBatchExitModal() {
    if (!selected.size) return;
    exitIsBatch = true; exitTarget = null;
    $('exitModalTitle').textContent = 'Confirm Inactive Pickers';
    $('exitModalName').textContent = 'Mark ' + selected.size + ' selected picker(s) as Inactive?';
    $('exitConfirmBtn').textContent = 'Yes, Mark Inactive';
    $('exitModal').style.display = 'flex';
    FK.trapFocus($('exitModal'));
    $('exitConfirmBtn').focus();
  }

  function closeExitModal() {
    $('exitModal').style.display = 'none';
    exitTarget = null;
    exitIsBatch = false;
  }

  function confirmExit() {
    var ids = Array.from(selected);
    closeExitModal();
    if (!ids.length) return;

    if (!navigator.onLine) {
      var q = JSON.parse(FK.store.get('fk_offline_exits') || '[]');
      ids.forEach(function (i) { if (q.indexOf(i) === -1) q.push(i); });
      FK.store.set('fk_offline_exits', JSON.stringify(q));
      db = db.filter(function (x) { return ids.indexOf(x.id) === -1; });
      selected.clear();
      render();
      return FK.toast('Offline. ' + ids.length + ' picker(s) marked inactive and queued for auto-sync.');
    }

    $('fsLoaderText').textContent = 'Updating Inactive Pickers...';
    $('fsLoader').classList.add('active');

    FK.post({ action: 'exit', items: ids.map(function (i) { return { id: i }; }) })
      .then(function (res) {
        if (!res || res.status !== 'Success') throw new Error('Failed');
        db = db.filter(function (x) { return ids.indexOf(x.id) === -1; });
        selected.clear();
        render();
        FK.toast(ids.length + ' picker(s) marked as Inactive');
      })
      .catch(function () {
        FK.toast('Failed to record inactive status. Please retry.', true);
      })
      .then(function () { $('fsLoader').classList.remove('active'); });
  }

  /* ── Lightweight PDF Export (unit: mm, Generous clearance, Center-Aligned, Black Borders) ── */
  function exportPdf() {
    if (!filtered.length) return FK.toast('No records to export.', true);

    var btn = $('btnPdf'), orig = btn.textContent;
    btn.textContent = 'Generating...';
    $('fsLoaderText').textContent = 'Generating PDF...';
    $('fsLoader').classList.add('active');

    FK.ensureJsPdf().then(function () {
      var doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true });
      var title = managerMode ? 'Pendency Summary - ' + cityTS.getValue() : 'Picker Pendency - ' + storeTS.getValue();
      var y = FK.pdf.loginGuide(doc);
      y = FK.pdf.title(doc, title, y);

      var headers, body;
      if (managerMode) {
        headers = [['Cluster Manager', 'Pendency Count']];
        var grp = {};
        filtered.forEach(function (i) { grp[i.cm] = (grp[i.cm] || 0) + 1; });
        body = Object.keys(grp).sort().map(function (k) { return [k, String(grp[k])]; });
        body.push(['TOTAL', String(filtered.length)]);
      } else {
        // Picker Name & Casper ID only as requested
        headers = [['Picker Name', 'Casper ID']];
        body = filtered.map(function (i) { return [FK.pdf.safe(i.name), FK.pdf.safe(i.id)]; });
      }

      doc.autoTable({
        head: headers,
        body: body,
        startY: y + 2,
        theme: 'grid',
        styles: FK.pdf.bodyStyles,
        headStyles: FK.pdf.headStyles,
        margin: { left: 14, right: 14, bottom: 15 },
        didParseCell: function (data) {
          if (data.section === 'body' && managerMode && data.row.index === body.length - 1) {
            data.cell.styles.fontStyle = 'bold';
            data.cell.styles.fillColor = [240, 240, 240];
          }
        }
      });

      FK.pdf.pageNumbers(doc);
      doc.save(title.replace(/[^a-zA-Z0-9_\-]/g, '_') + '.pdf');
      FK.toast('PDF Downloaded successfully!');
    }).catch(function () {
      FK.toast('PDF export failed.', true);
    }).then(function () {
      btn.textContent = orig;
      $('fsLoader').classList.remove('active');
    });
  }

  /* ── Export Google Sheet with Interactive Process Screen ── */
  function exportToGSheet() {
    if (!filtered.length) return FK.toast('No records to export.', true);

    var processWin = FK.createInteractiveGSheetWindow();
    var c = cityTS.getValue(), s = storeTS.getValue();
    var targetName = managerMode ? c : s;

    var detail = [['Dark Store', 'Picker Name', 'Casper ID', 'Cluster Manager', 'City']].concat(
      filtered.map(function (i) {
        return [i.darkStore, i.name, i.id, i.cm, i.city];
      })
    );

    FK.post({
      action: 'export',
      f: targetName,
      detailData: detail
    }).then(function (res) {
      if (res && res.url) {
        if (processWin) processWin.done(res.url);
        FK.toast('Google Sheet ready!');
      } else {
        throw new Error(res && res.error ? res.error : 'Server response error');
      }
    }).catch(function (err) {
      if (processWin) processWin.error(err.message || 'Export failed.');
      FK.toast('Google Sheet export failed.', true);
    });
  }

  FK.delegate({
    theme: FK.toggleTheme,
    mode: function (el) { setMode(el.getAttribute('data-mode') === '1'); },
    copy: function (el) { copyCasperId(el.getAttribute('data-id'), el); },
    batchExit: showBatchExitModal,
    confirmExit: confirmExit,
    closeExit: closeExitModal,
    pdf: exportPdf,
    gsheet: exportToGSheet
  });

  $('exitModal').addEventListener('click', function (e) { if (e.target === this) closeExitModal(); });

  var tsRender = {
    item: function (d, e) { return '<div style="display:block;width:100%">' + e(d.text) + '</div>'; },
    option: function (d, e) { return '<div>' + e(d.text) + '</div>'; }
  };
  cityTS = new TomSelect('#citySelect', { placeholder: 'Select City', create: false, render: tsRender, onChange: onCityChange });
  storeTS = new TomSelect('#storeSelect', { placeholder: 'Select Store', create: false, render: tsRender, onChange: function () { selected.clear(); render(); } });

  var cached = FK.readCache(CACHE_KEY);
  if (cached && cached.data.length) { db = cached.data; }

  FK.fetchJson(FK.API_URL + '?action=getData').then(function (d) {
    if (d && d.error) throw new Error(d.error);
    db = d.map(normalizeRow).filter(Boolean);
    FK.writeCache(CACHE_KEY, db);
    var u = new URLSearchParams(window.location.search);
    refreshFilters();
    if (u.get('city')) cityTS.setValue(u.get('city'), true);
    if (u.get('store')) { fillSelect(storeTS, storesOf(u.get('city')), false); storeTS.setValue(u.get('store'), true); }
    if (u.get('mode') === '1') setMode(true); else render();
  }).catch(function (e) {
    FK.toast('Error: ' + (e.message || 'Could not connect to server'), true, 5000);
  }).then(function () {
    FK.hideLoader();
  });
});
</script>
</body>
</html>
