<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{display:none}
html,body{scrollbar-width:none;-ms-overflow-style:none}
.table-holder::-webkit-scrollbar{display:block;width:6px;height:6px}
.table-holder::-webkit-scrollbar-track{background:transparent}
.table-holder::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:6px}
.table-holder{scrollbar-width:thin}

:root{
  --fk-blue:#2874F0; --fk-yellow:#FFB400; --gold:#D4AF37; --gold-light:#F5E6B8;
  --danger:#ef4444; --success:#10b981;
  --bg-panel:rgba(255,255,255,0.92); --card-bg:#ffffff;
  --table-header:#f8fafc; --table-hover:#f1f5f9;
  --dropdown-hover:rgba(40,116,240,0.08);
  --text-main:#0f172a; --text-muted:#64748b;
  --border-color:#cbd5e1;
  --shadow-panel:0 24px 48px rgba(0,0,0,0.12);
  --shadow-card:0 4px 12px rgba(0,0,0,0.05);
  --blur:blur(16px);
}
:root.dark-mode{
  --bg-panel:rgba(15,23,42,0.92); --card-bg:#1e293b;
  --table-header:#0f172a; --table-hover:#334155;
  --dropdown-hover:rgba(40,116,240,0.15);
  --text-main:#f8fafc; --text-muted:#94a3b8;
  --border-color:#334155;
  --shadow-panel:0 24px 64px rgba(0,0,0,0.6);
  --shadow-card:0 4px 12px rgba(0,0,0,0.4);
}

body::before{content:"";position:fixed;top:0;left:0;width:100vw;height:100vh;background-size:cover;background-position:center;background-repeat:no-repeat;z-index:0;animation:wallFadeIn 1s ease both}
body::after{content:"";position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:1;transition:background 0.3s ease}
:root.dark-mode body::after{background:rgba(5,10,25,0.75)}

@keyframes wallFadeIn{from{opacity:0}to{opacity:1}}

/* Loader Spinner */
#appLoader{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(15,23,42,0.95),rgba(5,10,25,0.98));z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity 0.4s ease}
#appLoader.hidden{opacity:0;pointer-events:none}
.spinner { width: 56px; height: 56px; border: 5px solid rgba(255, 255, 255, 0.1); border-top-color: var(--fk-blue); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }
.loading-text{font-family:Inter,sans-serif;font-weight:700;font-size:15px;color:#fff;letter-spacing:1px;animation:pulseTxt 1.5s infinite}
@keyframes pulseTxt{0%,100%{opacity:1}50%{opacity:0.5}}

body{font-family:Inter,system-ui,sans-serif;color:var(--text-main);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;position:relative;z-index:3;}
.glass-panel{background:var(--bg-panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:24px;padding:36px;width:100%;max-width:960px;border:1px solid var(--border-color);box-shadow:var(--shadow-panel);position:relative;z-index:10;transition:all 0.3s ease;animation:panelSlideUp 0.6s cubic-bezier(0.22,1,0.36,1) both}
@keyframes panelSlideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.ui-locked{pointer-events:none;opacity:0.6;cursor:wait}

.header-wrapper{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;width:100%;flex-wrap:wrap;gap:16px;}
.brand-header{display:flex;align-items:center;gap:16px;}
.brand-logo{width:80px;height:44px;border-radius:10px;object-fit:cover;box-shadow:0 4px 14px rgba(40,116,240,.2);}
.dash-title{font-weight:900;font-size:24px;letter-spacing:-0.5px;color:var(--text-main);}
.dash-subtitle{font-size:12px;font-weight:700;color:var(--fk-blue);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.icon-btn{background:var(--card-bg);border:1.5px solid var(--border-color);color:var(--text-main);border-radius:50px;padding:10px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all 0.2s ease;}
.icon-btn:hover{transform:translateY(-2px);border-color:var(--fk-blue);box-shadow:0 4px 12px var(--dropdown-hover);}
.divider{width:100%;height:1px;background:var(--border-color);margin:0 0 24px;border:none}

.tab-container{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;background:var(--card-bg);padding:6px;border-radius:50px;border:1px solid var(--border-color);width:fit-content;margin-left:auto;margin-right:auto;}
.btn-tab{border:none;padding:12px 28px;border-radius:50px;font-weight:700;font-size:13px;background:transparent;color:var(--text-muted);transition:all 0.2s ease;cursor:pointer;}
.btn-tab:hover:not(.active){color:var(--text-main);}
.btn-tab.active{background:var(--fk-blue);color:#fff;box-shadow:0 4px 14px rgba(40,116,240,0.4);}

.filter-row{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:20px;width:100%}
.filter-col{flex:1;min-width:260px;}

.ts-wrapper .ts-control { border-radius: 12px!important; padding: 14px 20px!important; border: 1.5px solid var(--border-color)!important; font-weight: 600!important; font-size: 14px!important; background: var(--card-bg)!important; color: var(--text-main)!important; box-shadow:var(--shadow-card)!important; }
.ts-wrapper .ts-control > input { color: var(--text-main)!important; }
.ts-wrapper .ts-control.focus { border-color: var(--fk-blue)!important; box-shadow: 0 0 0 3px rgba(40,116,240,0.15)!important; }
.ts-dropdown { border-radius: 12px!important; border: 1px solid var(--border-color)!important; background: var(--card-bg)!important; box-shadow: 0 12px 32px rgba(0,0,0,0.15)!important; }
.ts-dropdown .option { color: var(--text-main)!important; padding: 12px 16px!important; font-weight: 500!important; border-bottom: 1px solid var(--border-color)!important; }
.ts-dropdown .option:hover, .ts-dropdown .option.active { background: var(--dropdown-hover)!important; color: var(--fk-blue)!important; font-weight: 700!important; }

.search-wrapper{position:relative;width:100%;margin-bottom:24px}
.search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:16px;opacity:0.5;pointer-events:none;}
.search-box{width:100%;border-radius:12px;padding:14px 14px 14px 44px;border:1.5px solid var(--border-color);font-weight:500;font-size:14px;background:var(--card-bg);color:var(--text-main);box-shadow:var(--shadow-card);transition:all 0.2s;}
.search-box:focus{border-color:var(--fk-blue);outline:none;box-shadow:0 0 0 3px rgba(40,116,240,0.15);}

#resultArea{display:none;margin-top:10px;flex-direction:column;width:100%;animation:fadeIn 0.4s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.metric-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:16px;padding:24px;text-align:center;box-shadow:var(--shadow-card);position:relative;overflow:hidden;}
.metric-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--fk-blue);}
.metric-card:nth-child(2)::before{background:var(--fk-yellow);}
.metric-card .val{font-size:32px;font-weight:900;color:var(--text-main);margin-bottom:6px}
.metric-card .lbl{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.5px}

.action-buttons{display:flex;gap:12px;margin-bottom:24px;width:100%;justify-content:flex-end;flex-wrap:wrap;}
.btn-action{border:none;padding:12px 24px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:8px;}
.btn-action:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.15);}
.btn-pdf{background:#334155;color:#fff}
.btn-sheet{background:var(--success);color:#fff}

.table-holder{background:var(--card-bg);border-radius:16px;width:100%;border:1px solid var(--border-color);max-height:460px;overflow-y:auto;box-shadow:var(--shadow-card)}
.table{border-collapse:collapse;width:100%;min-width:500px;text-align:left;}
.table th, .table td{padding:16px;vertical-align:middle;}
.table thead th{background:var(--table-header);color:var(--text-muted);font-size:12px;font-weight:700;text-transform:uppercase;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--border-color)}
.table td{font-weight:500;font-size:14px;border-bottom:1px solid var(--border-color)}
.table tbody tr:hover td{background:var(--table-hover)}
.total-row td{font-weight:800!important;background:var(--table-header)!important;border-top:2px solid var(--fk-blue)!important;}

.btn-exit{background:#fee2e2;color:#b91c1c;border:1px solid #f87171;padding:8px 16px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;transition:all 0.2s;}
:root.dark-mode .btn-exit{background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.3);color:#fca5a5;}
.btn-exit:hover:not(:disabled){background:#fecaca;transform:translateY(-1px);}
.btn-exit:disabled{opacity:0.5;cursor:not-allowed;}

.status-not-started { color: var(--danger); font-weight: 700; margin-left: 6px; font-size: 12px; }
.status-in-progress { color: var(--fk-yellow); font-weight: 700; margin-left: 6px; font-size: 12px; }
.na-bg{color:var(--text-muted);font-style:italic;}
.pill-id{background:var(--dropdown-hover);color:var(--fk-blue);padding:4px 10px;border-radius:6px;font-weight:700;font-size:13px;border:1px solid rgba(40,116,240,0.2)}

#paginationBar{display:none;justify-content:space-between;align-items:center;margin-top:20px;width:100%;background:var(--card-bg);padding:12px 20px;border-radius:12px;border:1px solid var(--border-color);}
.page-info{font-weight:600;font-size:13px;color:var(--text-muted);}
.btn-page{background:transparent;border:1px solid var(--border-color);color:var(--text-main);border-radius:8px;padding:8px 16px;font-weight:600;font-size:13px;cursor:pointer;}
.btn-page:hover:not(:disabled){background:var(--table-hover);border-color:var(--fk-blue);}
.btn-page:disabled{opacity:0.4;cursor:default}

#toast-container{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none}
.toast-msg{background:var(--text-main);color:var(--card-bg);padding:14px 28px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 12px 32px rgba(0,0,0,0.3);transition:all 0.3s ease;}
.toast-msg.hidden{opacity:0;transform:translateY(12px)}

.exit-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99998;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);animation:fadeIn 0.2s ease}
.exit-modal{background:var(--card-bg);border:1px solid var(--border-color);border-radius:20px;padding:32px;width:90%;max-width:400px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,0.4)}
.exit-modal-icon{font-size:48px;margin-bottom:16px}
.exit-modal-title{font-weight:800;font-size:20px;margin-bottom:8px}
.exit-modal-name{font-weight:600;font-size:16px;color:var(--text-muted);margin-bottom:24px}
.exit-modal-actions{display:flex;gap:12px;justify-content:center}
.exit-modal-btn{padding:12px 24px;border-radius:10px;font-weight:700;font-size:14px;border:none;cursor:pointer;transition:all 0.2s flex:1;}
.exit-btn-confirm{background:var(--danger);color:#fff;width:100%}
.exit-btn-confirm:hover{background:#dc2626;}
.exit-btn-cancel{background:transparent;color:var(--text-main);border:1px solid var(--border-color)!important;width:100%}
.exit-btn-cancel:hover{background:var(--table-hover);}

.empty-state { padding: 40px; text-align: center; color: var(--text-muted); font-weight: 500; }
.empty-state i { font-size: 32px; margin-bottom: 12px; display: block; opacity: 0.5; }

@media(max-width:768px){
  body{padding:16px 12px;}
  .glass-panel{padding:24px 20px;}
  .header-wrapper{justify-content:center;text-align:center;}
  .action-buttons{justify-content:center;}
  .btn-action{flex:1;justify-content:center;}
}
</style>

<body>
<div id="appLoader">
  <div class="spinner"></div>
  <div class="loading-text">Synchronizing Picker Data...</div>
</div>

<div class="glass-panel" id="mainPanel">
  <div class="header-wrapper">
    <div class="brand-header">
      <img src="https://2dioqsev90.ucarecd.net/1e9d129e-8ea7-488c-919d-345bc4d7dcc4/l71720260823162158.webp" class="brand-logo" alt="FK Minutes" decoding="async">
      <div class="brand-text">
        <h2 class="dash-title">Picker Pendency Dashboard</h2>
        <div class="dash-subtitle">East - L&D [Flipkart Minutes]</div>
      </div>
    </div>
    <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle Theme">🌙</button>
  </div>
  <hr class="divider">
  
  <div class="tab-container">
    <button id="btnNormal" class="btn-tab active" onclick="setMode(0)">Dark Store Wise</button>
    <button id="btnManager" class="btn-tab" onclick="setMode(1)">Cluster Manager Wise</button>
  </div>
  
  <div class="filter-row">
    <div class="filter-col"><select id="citySelect" autocomplete="off" onchange="onCityChange()"></select></div>
    <div class="filter-col" id="storeWrapper"><select id="storeSelect" autocomplete="off" onchange="currentPage=1;render()"></select></div>
  </div>
  
  <div id="resultArea">
    <div class="metrics-grid">
      <div class="metric-card"><div class="val" id="countBadge">0</div><div class="lbl">Pending Pickers</div></div>
      <div class="metric-card"><div class="val" id="totalReportedBadge">0</div><div class="lbl">Inactive Reported (Session)</div></div>
    </div>
    
    <div class="search-wrapper" id="searchWrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-box" placeholder="Search Name or Casper ID..." oninput="onSearchInput()">
    </div>
    
    <div class="action-buttons">
      <button class="btn-action btn-pdf" id="btnPdf" onclick="exportData()">📄 Export PDF</button>
      <button id="btnGSheet" class="btn-action btn-sheet" onclick="exportToGSheet()">📊 Open as G-Sheet</button>
    </div>
    
    <div class="table-holder"><table class="table"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
    
    <div id="paginationBar">
      <button class="btn-page" id="btnPrev" onclick="changePage(-1)">&larr; Previous</button>
      <span class="page-info" id="pageInfo">Page 1 of 1</span>
      <button class="btn-page" id="btnNext" onclick="changePage(1)">Next &rarr;</button>
    </div>
  </div>
</div>

<div id="exitModal" class="exit-overlay" style="display:none">
  <div class="exit-modal">
    <div class="exit-modal-icon">⚠️</div>
    <div class="exit-modal-title">Confirm Picker Exit</div>
    <div class="exit-modal-name" id="exitModalName"></div>
    <div class="exit-modal-actions">
      <button class="exit-modal-btn exit-btn-cancel" onclick="closeExitModal()">Cancel</button>
      <button class="exit-modal-btn exit-btn-confirm" id="exitConfirmBtn">Confirm Exit</button>
    </div>
  </div>
</div>
<div id="toast-container"><div class="toast-msg hidden" id="toastText"></div></div>

<script>
const LOCAL_CACHE_KEY='pickerDash_v9';
const CACHE_TTL=10*60*1000;
const PAGE_SIZE=50;

let db=[],filtered=[],reportedIds=new Set(),pendingRowIds=new Set();
let cityTS,storeTS,managerMode=false,currentPage=1,isProcessing=false;
let searchQuery='',searchTimer=null,toastTimer=null,pendingExitId=null;

document.addEventListener("DOMContentLoaded", () => {
  const isDark = document.documentElement.classList.contains('dark-mode');
  document.getElementById('themeToggleBtn').textContent = isDark ? '☀️' : '🌙';
});

const escHtml=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const checkNA=str=>{const v=String(str??'').trim().toUpperCase();return(!v||v==='N/A'||v==='#N/A'||v==='#NA')?'<span class="na-bg">-</span>':escHtml(str)};
function toTitleCase(str) { return str ? String(str).toLowerCase().replace(/\b\w/g, c => c.toUpperCase()) : str; }

function normalizeRow(r){
  return { casperId: r.id, name: toTitleCase(r.nm), ts: r.ts, darkStore: toTitleCase(r.ds), city: toTitleCase(r.ct), clusterManager: toTitleCase(r.cm) };
}

async function apiFetch(url,opts={}){
  const MAX=2,TM=opts.method==='POST'?90000:15000;
  for(let a=0;a<=MAX;a++){
    try{
      const c=new AbortController(),t=setTimeout(()=>c.abort(),TM);
      const r=await fetch(url,{...opts,redirect:'follow',signal:c.signal});
      clearTimeout(t);
      const txt=await r.text();
      try{
        return JSON.parse(txt);
      }catch{
        throw new Error('Web App requires permissions. Set to "Execute as: Me" and "Access: Anyone".');
      }
    }catch(e){
      if(a===MAX)throw e;
      await new Promise(r=>setTimeout(r,1000*(a+1)));
    }
  }
}

function toggleTheme(){
  const isDark = document.documentElement.classList.toggle('dark-mode');
  try{localStorage.setItem('theme', isDark ? 'dark' : 'light')}catch(e){}
  document.getElementById('themeToggleBtn').textContent = isDark ? '☀️' : '🌙';
}

function hideLoader(){const l=document.getElementById('appLoader');if(!l)return;l.classList.add('hidden');setTimeout(()=>l.style.display='none',450)}
function showToast(msg,err){const t=document.getElementById('toastText');t.textContent=msg;t.style.background=err?'var(--danger)':'var(--text-main)';t.style.color=err?'#fff':'var(--card-bg)';t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),4000)}
function setUILock(on){isProcessing=on;document.getElementById('mainPanel').classList.toggle('ui-locked',on)}

function populateCityOptions(){
  const cur=cityTS.getValue();cityTS.clearOptions();
  [...new Set(db.map(i=>i.city))].filter(v=>v&&v.toUpperCase()!=='N/A').sort().forEach(c=>cityTS.addOption({value:c,text:c}));
  if(cur)cityTS.setValue(cur,true);
}
function loadData(showErr){
  return apiFetch(SCRIPT_URL+'?action=getData').then(d=>{
    hideLoader();
    if(d?.error){showToast('Error: '+d.error,true);return}
    db=Array.isArray(d)?d.map(normalizeRow):[];
    populateCityOptions();
    try{localStorage.setItem(LOCAL_CACHE_KEY,JSON.stringify({data:db,ts:Date.now()}))}catch(e){}
    if(cityTS.getValue()){if(!managerMode)onCityChange(true);render()}
  }).catch(e=>{
    hideLoader();
    if(showErr||!db.length) {
      const msg = e.message.includes('Web App requires') ? e.message : 'Network Error: Check URL and permissions.';
      showToast(msg, true);
    }
  });
}

window.onload=()=>{
  cityTS=new TomSelect('#citySelect',{placeholder:'Select City',create:false,sortField:{field:'text'}});
  storeTS=new TomSelect('#storeSelect',{placeholder:'Select Dark Store',create:false,sortField:{field:'text'}});
  const cached=(()=>{try{const r=localStorage.getItem(LOCAL_CACHE_KEY);if(!r)return null;const p=JSON.parse(r);return(Date.now()-p.ts<=CACHE_TTL)?p:null}catch(e){return null}})();
  if(cached){db=cached.data;populateCityOptions();hideLoader()}
  loadData(!cached);
};

function setMode(m){
  if(isProcessing)return;
  managerMode=!!m;currentPage=1;searchQuery='';
  document.getElementById('searchInput').value='';
  document.getElementById('btnNormal').classList.toggle('active',!m);
  document.getElementById('btnManager').classList.toggle('active',!!m);
  document.getElementById('storeWrapper').style.display=m?'none':'';
  document.getElementById('searchWrapper').style.display=m?'none':'';
  if(cityTS.getValue()){if(managerMode)render();else onCityChange()}else document.getElementById('resultArea').style.display='none'
}
function onCityChange(silent){
  if(isProcessing)return;
  const c=cityTS.getValue();currentPage=1;
  if(!c){document.getElementById('resultArea').style.display='none';return}
  if(managerMode){if(!silent)render();return}
  const prev=storeTS.getValue();storeTS.clearOptions();
  if(!silent)storeTS.clear();
  [...new Set(db.filter(i=>i.city===c).map(i=>i.darkStore))].filter(v=>v&&v.toUpperCase()!=='N/A').sort().forEach(s=>storeTS.addOption({value:s,text:s}));
  if(prev&&silent)storeTS.setValue(prev,true);
  if(!silent)document.getElementById('resultArea').style.display='none'
}
function onSearchInput(){clearTimeout(searchTimer);searchTimer=setTimeout(()=>{searchQuery=document.getElementById('searchInput').value.trim().toLowerCase();currentPage=1;render()},300)}

function changePage(d){currentPage+=d;renderTable()}
function render(){
  const c=cityTS.getValue(),s=storeTS.getValue();
  if(!c||(!managerMode&&!s)){document.getElementById('resultArea').style.display='none';return}
  filtered=db.filter(i=>{if(i.city!==c)return false;if(!managerMode&&i.darkStore!==s)return false;if(reportedIds.has(String(i.casperId)))return false;if(searchQuery&&!managerMode)return String(i.name).toLowerCase().includes(searchQuery)||String(i.casperId).toLowerCase().includes(searchQuery);return true});
  document.getElementById('countBadge').textContent=filtered.length;
  document.getElementById('totalReportedBadge').textContent=reportedIds.size;
  document.getElementById('resultArea').style.display='flex';renderTable();
}

function renderTable(){
  const tH=document.getElementById('tableHead'),tB=document.getElementById('tableBody'),pB=document.getElementById('paginationBar');
  if(!filtered.length){
    tH.innerHTML='';
    tB.innerHTML='<tr><td colspan="'+(managerMode?2:4)+'"><div class="empty-state"><i>📁</i> No records found for this selection.</div></td></tr>';
    pB.style.display='none';return;
  }
  
  if(managerMode){
    pB.style.display='none';
    const sm={};let total=0;
    filtered.forEach(i=>{sm[i.clusterManager]=(sm[i.clusterManager]||0)+1; total++});
    tH.innerHTML='<tr><th style="text-align:left;">Cluster Manager</th><th style="text-align:center;">Pendency Count</th></tr>';
    
    let html = Object.entries(sm).sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0])).map(([n,v])=>{
      return '<tr><td style="text-align:left; font-weight:600;">'+checkNA(n)+'</td><td style="text-align:center; font-size:16px; font-weight:800;">'+v+'</td></tr>';
    }).join('');
    
    html += '<tr class="total-row"><td style="text-align:left;">TOTAL</td><td style="text-align:center; font-size:18px;">'+total+'</td></tr>';
    tB.innerHTML = html;
  }
  else{
    const tot=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
    currentPage=Math.min(currentPage,tot);
    const st=(currentPage-1)*PAGE_SIZE,end=Math.min(st+PAGE_SIZE,filtered.length);
    
    document.getElementById('pageInfo').textContent = `Showing ${st+1} to ${end} of ${filtered.length}`;
    document.getElementById('btnPrev').disabled=(currentPage===1);
    document.getElementById('btnNext').disabled=(currentPage===tot);
    pB.style.display='flex';
    
    tH.innerHTML='<tr><th style="width:60px;text-align:center;">Sl.</th><th style="text-align:left;">Picker Name</th><th style="text-align:center;">Casper ID</th><th style="text-align:right;">Action</th></tr>';
    
    tB.innerHTML=filtered.slice(st,end).map((i,idx)=> {
      let statusHtml = '';
      if(i.ts === 'Not Started') statusHtml = '<br><span class="status-not-started">● Not Started</span>';
      else if(i.ts === 'In-Progress' || i.ts === 'In Progress') statusHtml = '<br><span class="status-in-progress">● In-Progress</span>';
      
      return `<tr id="row-${escHtml(i.casperId)}">
        <td style="text-align:center; color:var(--text-muted); font-size:12px;">${st+idx+1}</td>
        <td style="text-align:left;"><strong>${checkNA(i.name)}</strong>${statusHtml}</td>
        <td style="text-align:center;"><span class="pill-id">${checkNA(i.casperId)}</span></td>
        <td style="text-align:right;"><button class="btn-exit" ${pendingRowIds.has(String(i.casperId))?'disabled':''} onclick="showExitModal('${escHtml(i.casperId)}')">Exit Picker</button></td>
      </tr>`;
    }).join('');
  }
}

function showExitModal(id){const p=filtered.find(x=>String(x.casperId)===String(id));const label=(p&&p.name&&p.name.toUpperCase()!=='N/A')?p.name:id;pendingExitId=id;document.getElementById('exitModalName').textContent=`Are you sure you want to mark ${label} as exited?`;document.getElementById('exitModal').style.display='flex';document.getElementById('exitConfirmBtn').focus()}
function closeExitModal(){document.getElementById('exitModal').style.display='none';pendingExitId=null}
document.getElementById('exitConfirmBtn').addEventListener('click',function(){if(pendingExitId){const id=pendingExitId;closeExitModal();initiateSubmit(id)}});
document.getElementById('exitModal').addEventListener('click',function(e){if(e.target===this)closeExitModal()});

function initiateSubmit(id){
  const idStr=String(id);if(pendingRowIds.has(idStr))return;
  const p=filtered.find(x=>String(x.casperId)===idStr);if(!p)return;
  pendingRowIds.add(idStr);const backup=[...db];
  db=db.filter(i=>String(i.casperId)!==idStr);reportedIds.add(idStr);render();showToast('Processing exit...');
  apiFetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'report',n:p.name,id:p.casperId,ds:p.darkStore,c:p.city})})
  .then(res=>{if(res.status==='Success'){showToast('Exit Processed successfully!');try{localStorage.setItem(LOCAL_CACHE_KEY,JSON.stringify({data:db,ts:Date.now()}))}catch(e){}}else throw new Error(res.error)})
  .catch(()=>{db=backup;reportedIds.delete(idStr);render();showToast('Failed to process. Please retry.',true)})
  .finally(()=>{pendingRowIds.delete(idStr);renderTable()});
}

const _ls={};
function loadScript(src){if(_ls[src])return _ls[src];_ls[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=()=>{delete _ls[src];rej(new Error('Failed: '+src))};document.head.appendChild(s)});return _ls[src]}
async function ensureJsPdf(){if(window.jspdf&&typeof window.jspdf.jsPDF==='function')return;await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js');if(!window.jspdf)throw new Error('PDF library failed.')}

async function exportData(){
  if(!filtered.length||isProcessing)return;setUILock(true);
  const btn = document.getElementById('btnPdf');
  btn.textContent = 'Generating PDF...';
  try{await ensureJsPdf();
    const{jsPDF}=window.jspdf,doc=new jsPDF({compress:true});
    const pw=doc.internal.pageSize.getWidth();
    const hd={fillColor:[241,245,249],textColor:[15,23,42],fontStyle:'bold',halign:'center',lineWidth:0.1,lineColor:[203,213,225]};
    const bd={halign:'center',textColor:[15,23,42],fontSize:10,lineWidth:0.1,lineColor:[203,213,225]};
    const c=cityTS?cityTS.getValue():'',s=storeTS?storeTS.getValue():'';
    
    doc.setFontSize(16).setTextColor(15,23,42).text(managerMode?'Pendency Summary - '+c:'Picker Pendency - '+(s||c),pw/2,16,{align:'center'});
    
    if(managerMode){
      const sm={};filtered.forEach(i=>sm[i.clusterManager]=(sm[i.clusterManager]||0)+1);
      const sortedEntries = Object.entries(sm).sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
      doc.autoTable({
        head:[['Cluster Manager','Count']], body:sortedEntries, startY:24, headStyles:hd, styles:bd, theme:'grid',
        didParseCell: function(data) {
          if (data.section === 'body' && data.column.index === 1) {
            const val = parseInt(data.cell.raw);
            if (!isNaN(val)) {
              if (val > 20) { data.cell.styles.fillColor = [254, 226, 226]; data.cell.styles.textColor = [153, 27, 27]; }
              else if (val >= 10) { data.cell.styles.fillColor = [254, 240, 138]; data.cell.styles.textColor = [133, 77, 14]; }
              else { data.cell.styles.fillColor = [220, 252, 231]; data.cell.styles.textColor = [22, 101, 52]; }
            }
          }
        }
      })
    }
    else{
      doc.autoTable({head:[['Sl.','Picker Name','Casper ID', 'Status']],body:filtered.map((i,idx)=>[idx+1,i.name||'',i.casperId||'', i.ts||'']),startY:24,headStyles:hd,styles:bd,theme:'grid'})
    }
    doc.save(((managerMode?c+'_Summary':(s||c)+'_Pendency')+'.pdf').replace(/[^a-zA-Z0-9_.-]/g,'_'));
    showToast('PDF Downloaded successfully');
  }catch(e){showToast('PDF generation failed: '+e.message,true)}finally{ setUILock(false); btn.innerHTML = '📄 Export PDF'; }
}

function exportToGSheet(){
  if(!filtered.length||isProcessing)return;
  const btn=document.getElementById('btnGSheet');
  btn.textContent='Generating Sheet...';setUILock(true);
  
  const smMap={};filtered.forEach(i=>smMap[i.clusterManager]=(smMap[i.clusterManager]||0)+1);
  const sm=[['Cluster Manager','Total Pendency'],...Object.entries(smMap).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]))];
  const dt=[['CMSM','Dark Store','Name','Casper ID', 'Status'],...filtered.map(i=>[i.clusterManager||'',i.darkStore||'',i.name||'',i.casperId||'', i.ts||''])];
  const c=cityTS?cityTS.getValue():'',s=storeTS?storeTS.getValue():'';
  const fTitle=((managerMode?c+'_Pendency':(s||c)+'_Pendency')).replace(/[^a-zA-Z0-9_-]/g,'_');
  apiFetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'export',f:fTitle,summaryData:sm,detailData:dt})})
  .then(d=>{if(d.url){window.open(d.url,'_blank');showToast('Google Sheet created successfully!')}else throw new Error(d.error||'No URL returned')})
  .catch(e=>showToast('Export failed. Please try again.',true)).finally(()=>{ btn.innerHTML='📊 Open as G-Sheet'; setUILock(false); });
}
