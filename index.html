<html lang="en">
<head>
<meta charset="utf-8">
<title>Picker Pendency Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2874F0">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/jpeg" href="https://2dioqsev90.ucarecd.net/1e9d129e-8ea7-488c-919d-345bc4d7dcc4/l71720260823162158.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://cdnjs.cloudflare.com/ajax/libs/tom-select/2.2.2/css/tom-select.bootstrap5.min.css" rel="stylesheet">
<link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/tom-select/2.2.2/js/tom-select.complete.min.js" as="script">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{display:none}
html,body{scrollbar-width:none;-ms-overflow-style:none}

/* Thin scrollbar only inside table */
.table-holder::-webkit-scrollbar{display:block;width:4px;height:4px}
.table-holder::-webkit-scrollbar-track{background:transparent}
.table-holder::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:4px}
.table-holder{scrollbar-width:thin}

:root{
  --fk-blue:#2874F0;--fk-blue-hover:#1a5dbf;--fk-yellow:#FFB400;
  --danger:#ef4444;--danger-hover:#dc2626;--success:#10b981;
  --bg-panel:rgba(255,255,255,0.82);--card-bg:rgba(255,255,255,0.97);
  --table-header:rgba(248,250,252,0.99);--table-hover:rgba(241,245,249,0.99);
  --dropdown-hover:rgba(40,116,240,0.10);
  --text-main:#0f172a;--text-muted:#64748b;
  --border-color:rgba(203,213,225,0.8);
  --shadow-panel:0 24px 64px rgba(0,0,0,0.20);
  --shadow-card:0 4px 16px rgba(0,0,0,0.07);
  --blur:blur(22px);
}
:root.dark-mode{
  --bg-panel:rgba(15,23,42,0.88);--card-bg:rgba(15,23,42,0.98);
  --table-header:rgba(8,14,31,0.98);--table-hover:rgba(30,41,59,0.98);
  --dropdown-hover:rgba(40,116,240,0.18);
  --text-main:#f1f5f9;--text-muted:#94a3b8;
  --border-color:rgba(51,65,85,0.8);
  --shadow-panel:0 24px 64px rgba(0,0,0,0.55);
  --shadow-card:0 4px 16px rgba(0,0,0,0.3);
}
body::before{
  content:"";position:fixed;inset:0;background-size:cover;
  background-position:center;background-attachment:fixed;z-index:0;
  animation:wallFadeIn .8s ease both;
}
body::after{
  content:"";position:fixed;inset:0;background:rgba(15,23,42,0.45);z-index:1;
  transition:background .3s ease;
}
:root.dark-mode body::after{background:rgba(5,10,25,0.65)}
@keyframes wallFadeIn{from{opacity:0}to{opacity:1}}
#snowCanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:2}

/* Loader */
#appLoader{
  position:fixed;inset:0;background:rgba(5,10,25,0.88);z-index:99999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .45s ease;
}
#appLoader.hidden{opacity:0;pointer-events:none}
.loader-logo{width:64px;height:64px;border-radius:16px;object-fit:cover;box-shadow:0 8px 24px rgba(40,116,240,.5)}
.spinner{width:52px;height:52px;border:5px solid rgba(255,255,255,.15);border-top:5px solid var(--fk-blue);border-radius:50%;animation:spin .9s linear infinite}
.loading-text{font-family:Inter,sans-serif;font-weight:800;font-size:15px;color:rgba(255,255,255,.85);text-align:center;animation:pulseTxt 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseTxt{0%,100%{opacity:1}50%{opacity:.55}}

body{
  font-family:Inter,'Segoe UI',system-ui,sans-serif;color:var(--text-main);min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;padding:32px 16px 48px;
  position:relative;z-index:3;text-align:center;transition:color .3s ease;
}
.glass-panel{
  background:var(--bg-panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-radius:28px;padding:36px 32px;width:100%;max-width:920px;
  border:1px solid var(--border-color);box-shadow:var(--shadow-panel);
  position:relative;z-index:10;text-align:center;
  transition:background .3s ease,border-color .3s ease,box-shadow .3s ease;
  animation:panelSlideUp .5s cubic-bezier(.22,1,.36,1) both;
}
@keyframes panelSlideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.ui-locked{pointer-events:none;opacity:.6;cursor:wait}

.header-wrapper{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:26px;width:100%;gap:12px;flex-wrap:wrap}
.brand-header{display:flex;align-items:center;justify-content:center;gap:12px;flex:1;min-width:0}
.brand-logo{width:60px;height:44px;border-radius:12px;object-fit:cover;box-shadow:0 4px 14px rgba(40,116,240,.3);flex-shrink:0}
.brand-text{text-align:center}
.dash-title{font-weight:900;font-size:24px;color:var(--text-main);letter-spacing:-.6px;line-height:1.2;text-align:center;transition:color .3s ease}
.dash-subtitle{font-size:12px;font-weight:700;color:var(--fk-blue);text-transform:uppercase;letter-spacing:1px;margin-top:2px;text-align:center}
.header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{
  background:var(--card-bg);border:1.5px solid var(--border-color);color:var(--text-main);
  border-radius:50px;padding:7px 15px;font-size:12px;font-weight:800;cursor:pointer;
  transition:all .2s ease;text-align:center;white-space:nowrap;letter-spacing:.3px;font-family:Inter,sans-serif;
}
.icon-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-card);background:var(--table-hover)}
.icon-btn:active{transform:scale(.96)}
.divider{width:100%;height:1px;background:var(--border-color);margin:0 0 24px;border:none}

/* Tabs */
.tab-container{display:flex;justify-content:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.btn-tab{
  border:1.5px solid var(--border-color);padding:11px 26px;border-radius:50px;
  font-weight:800;font-size:13px;background:var(--card-bg);color:var(--text-muted);
  transition:all .22s ease;flex:1;max-width:220px;cursor:pointer;text-align:center;
  letter-spacing:.2px;font-family:Inter,sans-serif;
}
.btn-tab:hover:not(.active){border-color:var(--fk-blue);color:var(--fk-blue);transform:translateY(-2px)}
.btn-tab.active{
  background:linear-gradient(135deg,var(--fk-blue) 0%,#1a5dbf 100%);color:#fff;
  border-color:var(--fk-blue);box-shadow:0 6px 18px rgba(40,116,240,.35);transform:translateY(-1px);
}

/* Filters */
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-bottom:16px;width:100%}
.filter-col{flex:1 1 260px;max-width:420px;text-align:center}

/* ============================================================
   TOM SELECT — CENTER ALIGNMENT FIX
   The key: collapse the hidden <input> when an item is selected
   so the .item div can fill and center within the flex container.
   ============================================================ */
.ts-wrapper{text-align:center}
.ts-wrapper .ts-control{
  border-radius:14px!important;padding:13px 18px!important;border:1.5px solid var(--border-color)!important;
  font-weight:700!important;font-size:14px!important;font-family:Inter,sans-serif!important;
  background:var(--card-bg)!important;color:var(--text-main)!important;
  transition:border-color .2s,box-shadow .2s!important;
  display:flex!important;justify-content:center!important;align-items:center!important;
}
/* When a value IS selected — collapse the input, let the .item fill */
.ts-wrapper.single.has-items .ts-control>input{
  width:0!important;min-width:0!important;flex:0 0 0px!important;
  padding:0!important;margin:0!important;opacity:0!important;
  position:absolute!important;
}
.ts-wrapper.single .ts-control>.item{
  text-align:center!important;flex:1 1 100%!important;
  max-width:100%!important;font-weight:700!important;color:var(--text-main)!important;
}
/* When NO value is selected — center the placeholder input */
.ts-wrapper.single:not(.has-items) .ts-control>input{
  text-align:center!important;flex:1!important;
}
.ts-wrapper .ts-control.focus{border-color:var(--fk-blue)!important;box-shadow:0 0 0 3px rgba(40,116,240,.18)!important}
.ts-dropdown{
  background:var(--card-bg)!important;color:var(--text-main)!important;
  border:1.5px solid var(--border-color)!important;border-radius:14px!important;
  box-shadow:0 12px 32px rgba(0,0,0,.22)!important;font-family:Inter,sans-serif!important;
}
.ts-dropdown .option{text-align:center!important;padding:11px 16px!important;font-weight:600!important;font-size:13px!important}
.ts-dropdown .option:hover,.ts-dropdown .option.active{background:var(--dropdown-hover)!important;color:var(--fk-blue)!important;font-weight:800!important}
.ts-dropdown .no-results{text-align:center!important;color:var(--text-muted)!important}

/* Search */
.search-wrapper{position:relative;width:100%;margin-bottom:20px}
.search-box{
  width:100%;border-radius:14px;padding:14px 22px;border:1.5px solid var(--border-color);
  font-weight:600;font-size:14px;font-family:Inter,sans-serif;background:var(--card-bg);
  color:var(--text-main);text-align:center;transition:border-color .2s,box-shadow .2s;
}
.search-box::placeholder{color:var(--text-muted)}
.search-box:focus{border-color:var(--fk-blue);outline:none;box-shadow:0 0 0 3px rgba(40,116,240,.15)}

#resultArea{display:none;margin-top:22px;flex-direction:column;align-items:center;width:100%;animation:fadeIn .4s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Metrics */
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;width:100%;margin-bottom:14px}
.metric-card{
  background:var(--card-bg);border:1px solid var(--border-color);border-radius:18px;
  padding:22px 18px;text-align:center;position:relative;overflow:hidden;
  transition:transform .2s ease,box-shadow .2s ease,background .3s ease;box-shadow:var(--shadow-card);
}
.metric-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--fk-blue),var(--fk-yellow))}
.metric-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.13)}
.metric-card .val{font-size:36px;font-weight:900;background:linear-gradient(135deg,var(--fk-blue),#4f9cf9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:8px;text-align:center}
.metric-card .lbl{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text-muted);letter-spacing:.8px;text-align:center}

.stale-note{font-size:11px;color:var(--text-muted);margin-bottom:16px;font-weight:600;text-align:center;width:100%;display:none}

/* Action Buttons */
.action-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:22px;width:100%}
.btn-action{
  border:none;padding:13px 22px;border-radius:14px;font-weight:800;font-size:13px;
  font-family:Inter,sans-serif;flex:1;min-width:150px;cursor:pointer;transition:all .2s ease;text-align:center;letter-spacing:.3px;
}
.btn-action:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.btn-action:active{transform:scale(.97)}
.btn-pdf{background:linear-gradient(135deg,#334155,#1e293b);color:#fff}
.btn-sheet{background:linear-gradient(135deg,var(--success),#0d9669);color:#fff}

/* Table */
.table-holder{background:var(--card-bg);border-radius:18px;width:100%;border:1px solid var(--border-color);max-height:460px;overflow-y:auto;overflow-x:auto;box-shadow:var(--shadow-card);transition:background .3s ease}
.table{border-collapse:collapse;width:100%;min-width:460px;color:var(--text-main);text-align:center}
.table th,.table td{text-align:center!important;padding:15px 16px;vertical-align:middle}
.table thead th{
  background:var(--table-header);color:var(--text-muted);font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.7px;position:sticky;top:0;z-index:2;
  border-bottom:2px solid var(--border-color);text-align:center!important;
}
.table td{font-weight:600;font-size:14px;border-bottom:1px solid var(--border-color);text-align:center!important;transition:background .15s ease}
.table tbody tr:nth-child(even) td{background:var(--table-hover)}
.table tbody tr:hover td{background:var(--dropdown-hover)}
.table tbody tr:last-child td{border-bottom:none}

/* Badges */
.btn-exit{
  background:linear-gradient(135deg,var(--danger),#b91c1c);color:#fff;border:none;
  padding:8px 20px;border-radius:10px;font-weight:800;font-size:12px;font-family:Inter,sans-serif;
  cursor:pointer;transition:transform .2s ease,opacity .2s ease;letter-spacing:.3px;
}
.btn-exit:hover:not(:disabled){transform:translateY(-2px);opacity:.9}
.btn-exit:disabled{opacity:.45;cursor:wait}
.badge-count{background:linear-gradient(135deg,var(--fk-blue),#1a5dbf);color:#fff;padding:5px 14px;border-radius:50px;display:inline-block;font-weight:800;font-size:13px}
.na-bg{background:rgba(239,68,68,.1);color:var(--danger);padding:3px 10px;border-radius:6px;font-size:12px;border:1px solid rgba(239,68,68,.2);display:inline-block}
.pill-id{background:rgba(40,116,240,.1);color:var(--fk-blue);padding:4px 12px;border-radius:50px;font-weight:800;font-size:13px;display:inline-block;border:1px solid rgba(40,116,240,.2)}

/* Pagination */
#paginationBar{display:none;justify-content:center;align-items:center;gap:14px;margin-top:18px;width:100%;text-align:center}
.page-info{font-weight:700;font-size:13px;color:var(--text-muted);min-width:140px;text-align:center}
.btn-page{
  background:var(--card-bg);border:1.5px solid var(--border-color);color:var(--text-main);
  border-radius:50px;padding:8px 18px;font-weight:800;font-size:12px;font-family:Inter,sans-serif;cursor:pointer;transition:all .2s ease;
}
.btn-page:hover:not(:disabled){border-color:var(--fk-blue);color:var(--fk-blue);transform:translateY(-1px)}
.btn-page:disabled{opacity:.4;cursor:default}

/* Toast */
#toast-container{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;text-align:center}
.toast-msg{
  background:var(--text-main);color:var(--card-bg);padding:13px 28px;border-radius:50px;
  font-weight:700;font-size:13px;font-family:Inter,sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.25);
  text-align:center;transition:opacity .3s ease,transform .3s ease;
}
.toast-msg.hidden{opacity:0;transform:translateY(8px);pointer-events:none}

/* Announcement Popup */
#announcementPopup{
  position:fixed;bottom:28px;right:24px;z-index:9998;background:var(--card-bg);
  border:1.5px solid var(--border-color);border-radius:20px;padding:18px 18px 16px;
  width:200px;box-shadow:0 16px 40px rgba(0,0,0,.22);display:flex;flex-direction:column;
  align-items:center;gap:10px;animation:popupBounce .5s cubic-bezier(.22,1,.36,1) both;
  text-align:center;transition:background .3s ease,border-color .3s ease,opacity .3s ease,transform .3s ease;
}
@keyframes popupBounce{from{opacity:0;transform:scale(.7) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.popup-close{
  position:absolute;top:8px;right:10px;background:none;border:none;font-size:20px;line-height:1;
  color:var(--text-muted);cursor:pointer;font-weight:700;transition:color .15s ease,transform .2s ease;padding:2px 6px;border-radius:6px;
}
.popup-close:hover{color:var(--danger);transform:rotate(90deg)}
.popup-img{width:80px;height:80px;object-fit:contain}
.popup-label{font-size:11px;font-weight:800;color:var(--text-muted);text-align:center;text-transform:uppercase;letter-spacing:.5px}
.popup-brand{font-size:13px;font-weight:900;color:var(--fk-blue);text-align:center}

/* ============================================================
   CUSTOM EXIT MODAL — replaces native confirm()
   ============================================================ */
.exit-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99998;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  animation:fadeIn .2s ease;
}
.exit-modal{
  background:var(--card-bg);border:1.5px solid var(--border-color);border-radius:24px;
  padding:36px 28px 28px;width:90%;max-width:380px;text-align:center;
  box-shadow:0 24px 64px rgba(0,0,0,.35);animation:panelSlideUp .3s cubic-bezier(.22,1,.36,1);
}
.exit-modal-icon{font-size:52px;margin-bottom:14px;line-height:1}
.exit-modal-title{font-weight:900;font-size:20px;margin-bottom:6px;color:var(--text-main)}
.exit-modal-name{font-weight:800;font-size:16px;color:var(--fk-blue);margin-bottom:20px;word-break:break-word}
.exit-modal-actions{display:flex;gap:12px;justify-content:center}
.exit-modal-btn{
  padding:12px 30px;border-radius:14px;font-weight:800;font-size:14px;
  border:none;cursor:pointer;font-family:Inter,sans-serif;transition:all .2s ease;letter-spacing:.3px;
}
.exit-modal-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.exit-modal-btn:active{transform:scale(.96)}
.exit-btn-confirm{background:linear-gradient(135deg,var(--danger),#b91c1c);color:#fff}
.exit-btn-cancel{background:var(--card-bg);color:var(--text-main);border:1.5px solid var(--border-color)!important}
.exit-btn-cancel:hover{border-color:var(--fk-blue)!important;color:var(--fk-blue)}

/* ============================================================
   MOBILE — proper spacing, larger touch targets, better layout
   ============================================================ */
@media(max-width:768px){
  body{padding:16px 10px 36px}
  body::before{background-attachment:scroll}  /* fix iOS perf */
  .glass-panel{padding:28px 18px;border-radius:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .dash-title{font-size:20px}
  .dash-subtitle{font-size:11px;letter-spacing:.6px}
  .brand-header{flex-direction:column;gap:8px}
  .brand-logo{width:52px;height:38px}
  .header-wrapper{flex-direction:column;align-items:center;gap:12px}
  .header-actions{width:100%;justify-content:center}
  .icon-btn{padding:10px 22px;font-size:13px}
  .tab-container{gap:8px}
  .btn-tab{flex:1 1 42%;max-width:none;padding:13px 14px;font-size:13px}
  .filter-row{gap:10px;flex-direction:column}
  .filter-col{flex:1 1 100%;max-width:100%}
  .ts-wrapper .ts-control{padding:14px 16px!important;font-size:15px!important}
  .search-box{padding:14px 18px;font-size:15px}
  .metrics-grid{grid-template-columns:1fr 1fr;gap:10px}
  .metric-card{padding:18px 14px}
  .metric-card .val{font-size:28px}
  .action-buttons{gap:10px}
  .btn-action{min-width:0;flex:1;font-size:13px;padding:14px 16px}
  .table{min-width:420px}
  .table th,.table td{padding:14px 10px;font-size:13px}
  .btn-exit{padding:10px 22px;font-size:13px}
  #paginationBar{flex-wrap:wrap;gap:10px}
  .btn-page{padding:10px 18px;font-size:13px}
  #announcementPopup{bottom:14px;right:12px;width:160px;padding:14px 14px 12px}
  .popup-img{width:60px;height:60px}
  .popup-brand{font-size:12px}
  .exit-modal{padding:28px 22px 22px;border-radius:20px}
  .exit-modal-btn{padding:13px 26px;font-size:14px}
}
@media(max-width:400px){
  .glass-panel{padding:22px 14px;border-radius:18px}
  .metrics-grid{grid-template-columns:1fr 1fr}
  .table{min-width:360px}
  .btn-tab{padding:12px 10px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="snowCanvas" aria-hidden="true"></canvas>
<div id="appLoader">
  <img class="loader-logo" src="https://files.catbox.moe/rnq3xb.svg" alt="Loading" decoding="async">
  <div class="loading-text">Please wait, loading your data</div>
</div>

<div class="glass-panel" id="mainPanel">
  <div class="header-wrapper">
    <div class="brand-header">
      <img src="https://2dioqsev90.ucarecd.net/1e9d129e-8ea7-488c-919d-345bc4d7dcc4/l71720260823162158.webp" class="brand-logo" alt="FK Minutes Logo" decoding="async" loading="eager">
      <div class="brand-text">
        <h2 class="dash-title">Picker Pendency Dashboard</h2>
        <div class="dash-subtitle">East - L&D [Flipkart Minutes]</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()">Save Your Eyes</button>
    </div>
  </div>
  <hr class="divider">
  <div class="tab-container">
    <button id="btnNormal" class="btn-tab active" onclick="setMode(0)">Dark Store Wise</button>
    <button id="btnManager" class="btn-tab" onclick="setMode(1)">Cluster Manager Wise</button>
  </div>
  <div class="filter-row">
    <div class="filter-col"><select id="citySelect" autocomplete="off" onchange="onCityChange()"></select></div>
    <div class="filter-col" id="storeWrapper"><select id="storeSelect" autocomplete="off" onchange="currentPage=1;render()"></select></div>
  </div>
  <div id="resultArea">
    <div class="metrics-grid">
      <div class="metric-card"><div class="val" id="countBadge">0</div><div class="lbl">Pending Pickers</div></div>
      <div class="metric-card"><div class="val" id="totalReportedBadge">0</div><div class="lbl">Inactive Pickers</div></div>
    </div>
    <div class="stale-note" id="staleNote"></div>
    <div class="search-wrapper" id="searchWrapper">
      <input type="text" id="searchInput" class="search-box" placeholder="Search Name or Casper ID" oninput="onSearchInput()">
    </div>
    <div class="action-buttons">
      <button class="btn-action btn-pdf" onclick="exportData()">&#128196; Export PDF</button>
      <button id="btnGSheet" class="btn-action btn-sheet" onclick="exportToGSheet()">&#128202; Open as G-Sheet</button>
    </div>
    <div class="table-holder">
      <table class="table"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
    </div>
    <div id="paginationBar">
      <button class="btn-page" id="btnPrev" onclick="changePage(-1)">&larr; Prev</button>
      <span class="page-info" id="pageInfo">Page 1</span>
      <button class="btn-page" id="btnNext" onclick="changePage(1)">Next &rarr;</button>
    </div>
  </div>
</div>

<!-- Custom Exit Modal -->
<div id="exitModal" class="exit-overlay" style="display:none">
  <div class="exit-modal">
    <div class="exit-modal-icon">⚠️</div>
    <div class="exit-modal-title">Confirm Exit</div>
    <div class="exit-modal-name" id="exitModalName"></div>
    <div class="exit-modal-actions">
      <button class="exit-modal-btn exit-btn-confirm" id="exitConfirmBtn">Yes, Exit</button>
      <button class="exit-modal-btn exit-btn-cancel" onclick="closeExitModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="toast-container"><div class="toast-msg hidden" id="toastText"></div></div>

<div id="announcementPopup">
  <button class="popup-close" onclick="closePopup()" aria-label="Close">&times;</button>
  <img class="popup-img" src="https://2dioqsev90.ucarecd.net/1e9d129e-8ea7-488c-919d-345bc4d7dcc4/l71720260823162158.webp" alt="Flipkart Minutes" decoding="async" loading="lazy">
  <div class="popup-brand">Flipkart Minutes</div>
</div>

<script>
/* ============================================================
 *  CONFIG
 * ============================================================ */
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbyjdAbFLKaTlqMahcRO-Dx5JAf0PX8VGfFyDoeSS18_UL52pVScXbJRNHkKI-QMhNSbGA/exec';
const LOCAL_CACHE_KEY='pickerDashboard_cache_v4';
const LOCAL_CACHE_MAX_MS=10*60*1000;
const PAGE_SIZE=50;

/* ============================================================
 *  STATE
 * ============================================================ */
let db=[],filtered=[],reportedIds=new Set(),pendingRowIds=new Set();
let citySelectInstance,storeSelectInstance;
let managerMode=false,currentPage=1,isProcessing=false,lastLoadedAt=null;
let searchQuery='',searchDebounceTimer=null,toastTimer=null;
let pendingExitId=null;

/* ============================================================
 *  HELPERS
 * ============================================================ */
const escHtml=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const checkNA=str=>{const v=String(str??'').trim().toUpperCase();return(!v||v==='N/A')?'<span class="na-bg">N/A</span>':escHtml(str)};
function normalizeRow(r){return{casperId:r.id,name:r.nm,darkStore:r.ds,city:r.ct,clusterManager:r.cm}}

/* ============================================================
 *  NETWORK — robust fetch with retry + timeout
 *  Fixes: no res.ok check (unreliable with GAS 302 redirects),
 *  explicit redirect:'follow', AbortController timeout,
 *  exponential backoff retry (max 2 retries)
 * ============================================================ */
async function apiFetch(url,options={}){
  const MAX_RETRIES=2;
  const TIMEOUT=options.method==='POST'?30000:15000;
  for(let attempt=0;attempt<=MAX_RETRIES;attempt++){
    try{
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),TIMEOUT);
      const res=await fetch(url,{...options,redirect:'follow',signal:ctrl.signal});
      clearTimeout(timer);
      const text=await res.text();
      try{return JSON.parse(text)}
      catch{throw new Error('Server returned invalid response. Check deployment URL.')}
    }catch(err){
      if(attempt===MAX_RETRIES)throw err;
      await new Promise(r=>setTimeout(r,1000*(attempt+1)));
    }
  }
}

/* ============================================================
 *  THEME
 * ============================================================ */
function toggleTheme(){
  const isDark=document.documentElement.classList.toggle('dark-mode');
  document.getElementById('themeToggleBtn').innerHTML=isDark?'Damaged Your Eyes':'Save Your Eyes';
  try{localStorage.setItem('theme',isDark?'dark':'light')}catch(e){}
}

/* ============================================================
 *  LOADER & TOAST
 * ============================================================ */
function hideLoader(){
  const l=document.getElementById('appLoader');
  if(!l)return;
  l.classList.add('hidden');
  setTimeout(()=>l.style.display='none',450);
}

function showToast(msg,isError=false){
  const t=document.getElementById('toastText');
  t.textContent=msg;
  t.style.background=isError?'var(--danger)':'var(--text-main)';
  t.style.color=isError?'#fff':'var(--card-bg)';
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.add('hidden'),3500);
}

function setUILock(on){
  isProcessing=on;
  document.getElementById('mainPanel').classList.toggle('ui-locked',on);
}

/* ============================================================
 *  POPUP
 * ============================================================ */
function closePopup(){
  const p=document.getElementById('announcementPopup');
  if(p){p.style.opacity='0';p.style.transform='scale(0.8) translateY(12px)';setTimeout(()=>p.remove(),300)}
  try{sessionStorage.setItem('popupDismissed','1')}catch(e){}
}
(function(){try{if(sessionStorage.getItem('popupDismissed'))document.getElementById('announcementPopup')?.remove()}catch(e){}})();

/* ============================================================
 *  STALE NOTE — shows data freshness
 * ============================================================ */
function updateStaleNote(){
  const note=document.getElementById('staleNote');
  if(!lastLoadedAt||!note)return;
  const diffMin=Math.floor((Date.now()-lastLoadedAt.getTime())/60000);
  if(diffMin<1) note.textContent='Data loaded just now';
  else if(diffMin===1) note.textContent='Data loaded 1 minute ago';
  else note.textContent='Data loaded '+diffMin+' minutes ago';
  note.style.color=diffMin<5?'var(--success)':diffMin<10?'#f59e0b':'var(--danger)';
}

/* ============================================================
 *  DATA LOADING
 * ============================================================ */
function populateCityOptions(){
  const cur=citySelectInstance.getValue();
  citySelectInstance.clearOptions();
  [...new Set(db.map(i=>i.city))].filter(Boolean).sort().forEach(c=>citySelectInstance.addOption({value:c,text:c}));
  if(cur)citySelectInstance.setValue(cur,true);
}

function loadData(showLoaderOnError=true){
  return apiFetch(SCRIPT_URL+'?action=getData')
    .then(d=>{
      hideLoader();
      if(d?.error){showToast('Backend Error: '+d.error,true);return}
      db=Array.isArray(d)?d.map(normalizeRow):[];
      populateCityOptions();
      lastLoadedAt=new Date();
      updateStaleNote();
      try{localStorage.setItem(LOCAL_CACHE_KEY,JSON.stringify({data:db,ts:Date.now()}))}catch(e){}
      const note=document.getElementById('staleNote');
      if(note)note.style.display='block';
      if(citySelectInstance.getValue()){if(!managerMode)onCityChange(true);render()}
    })
    .catch(err=>{
      hideLoader();
      if(showLoaderOnError||!db.length)showToast('Network Error: '+(err.message||'Please refresh.'),true);
    });
}

/* ============================================================
 *  INIT
 * ============================================================ */
window.onload=()=>{
  if(document.documentElement.classList.contains('dark-mode'))
    document.getElementById('themeToggleBtn').innerHTML='Damaged Your Eyes';

  citySelectInstance=new TomSelect('#citySelect',{placeholder:'Select City',create:false,sortField:{field:'text'}});
  storeSelectInstance=new TomSelect('#storeSelect',{placeholder:'Select Dark Store',create:false,sortField:{field:'text'}});

  const cached=(function(){
    try{
      const raw=localStorage.getItem(LOCAL_CACHE_KEY);
      if(!raw)return null;
      const p=JSON.parse(raw);
      return(Date.now()-p.ts<=LOCAL_CACHE_MAX_MS)?p:null;
    }catch(e){return null}
  })();
  if(cached){
    db=cached.data;populateCityOptions();lastLoadedAt=new Date(cached.ts);
    const note=document.getElementById('staleNote');
    if(note){note.style.display='block';updateStaleNote()}
    hideLoader();
  }
  loadData(!cached);
};

/* ============================================================
 *  MODE / FILTERS
 * ============================================================ */
function setMode(m){
  if(isProcessing)return;
  managerMode=!!m;currentPage=1;searchQuery='';
  document.getElementById('searchInput').value='';
  document.getElementById('btnNormal').classList.toggle('active',!m);
  document.getElementById('btnManager').classList.toggle('active',!!m);
  document.getElementById('storeWrapper').style.display=m?'none':'';
  document.getElementById('searchWrapper').style.display=m?'none':'';
  if(citySelectInstance.getValue()){if(managerMode)render();else onCityChange()}
  else document.getElementById('resultArea').style.display='none';
}

function onCityChange(silent=false){
  if(isProcessing)return;
  const c=citySelectInstance.getValue();currentPage=1;
  if(!c){document.getElementById('resultArea').style.display='none';return}
  if(managerMode){if(!silent)render();return}
  const prev=storeSelectInstance.getValue();
  storeSelectInstance.clearOptions();
  if(!silent)storeSelectInstance.clear();
  [...new Set(db.filter(i=>i.city===c).map(i=>i.darkStore))].filter(Boolean).sort().forEach(s=>storeSelectInstance.addOption({value:s,text:s}));
  if(prev&&silent)storeSelectInstance.setValue(prev,true);
  if(!silent)document.getElementById('resultArea').style.display='none';
}

function onSearchInput(){
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer=setTimeout(()=>{searchQuery=document.getElementById('searchInput').value.trim().toLowerCase();currentPage=1;render()},240);
}

/* ============================================================
 *  RENDER
 * ============================================================ */
function changePage(dir){currentPage+=dir;renderTable()}

function render(){
  const c=citySelectInstance.getValue(),s=storeSelectInstance.getValue();
  if(!c||(!managerMode&&!s)){document.getElementById('resultArea').style.display='none';return}
  filtered=db.filter(i=>{
    if(i.city!==c)return false;
    if(!managerMode&&i.darkStore!==s)return false;
    if(reportedIds.has(String(i.casperId)))return false;
    if(searchQuery&&!managerMode)return String(i.name).toLowerCase().includes(searchQuery)||String(i.casperId).toLowerCase().includes(searchQuery);
    return true;
  });
  document.getElementById('countBadge').textContent=filtered.length;
  document.getElementById('totalReportedBadge').textContent=reportedIds.size;
  document.getElementById('resultArea').style.display='flex';
  renderTable();
}

function renderTable(){
  const tHead=document.getElementById('tableHead'),tBody=document.getElementById('tableBody'),pBar=document.getElementById('paginationBar');
  if(filtered.length===0){
    tHead.innerHTML='';
    tBody.innerHTML='<tr><td colspan="'+(managerMode?2:4)+'" style="padding:32px;color:var(--text-muted);font-weight:700;">No Records Found</td></tr>';
    pBar.style.display='none';return;
  }
  if(managerMode){
    pBar.style.display='none';
    const sum={};filtered.forEach(i=>{sum[i.clusterManager]=(sum[i.clusterManager]||0)+1});
    tHead.innerHTML='<tr><th>Cluster Manager</th><th>Pendency Count</th></tr>';
    tBody.innerHTML=Object.entries(sum).sort((a,b)=>a[0].localeCompare(b[0])).map(([n,v])=>'<tr><td>'+checkNA(n)+'</td><td><span class="badge-count">'+v+'</span></td></tr>').join('');
  }else{
    const tot=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
    currentPage=Math.min(currentPage,tot);
    const st=(currentPage-1)*PAGE_SIZE;
    const end=Math.min(st+PAGE_SIZE,filtered.length);
    document.getElementById('pageInfo').textContent='Showing '+(st+1)+'–'+end+' of '+filtered.length;
    document.getElementById('btnPrev').disabled=(currentPage===1);
    document.getElementById('btnNext').disabled=(currentPage===tot);
    pBar.style.display='flex';
    tHead.innerHTML='<tr><th>#</th><th>User Name</th><th>User ID</th><th>Action</th></tr>';
    tBody.innerHTML=filtered.slice(st,end).map((i,idx)=>
      '<tr id="row-'+escHtml(i.casperId)+'">'+
      '<td style="color:var(--text-muted);font-size:12px;font-weight:700">'+(st+idx+1)+'</td>'+
      '<td>'+checkNA(i.name)+'</td>'+
      '<td><span class="pill-id">'+checkNA(i.casperId)+'</span></td>'+
      '<td><button class="btn-exit" '+(pendingRowIds.has(String(i.casperId))?'disabled':'')+' onclick="showExitModal(\''+escHtml(i.casperId)+'\')">Exit</button></td>'+
      '</tr>'
    ).join('');
  }
}

/* ============================================================
 *  CUSTOM EXIT MODAL — replaces native confirm()
 * ============================================================ */
function showExitModal(id){
  const p=filtered.find(x=>String(x.casperId)===String(id));
  const label=(p&&p.name&&p.name.toUpperCase()!=='N/A')?p.name:id;
  pendingExitId=id;
  document.getElementById('exitModalName').textContent='Mark "'+label+'" as exited?';
  document.getElementById('exitModal').style.display='flex';
  document.getElementById('exitConfirmBtn').focus();
}

function closeExitModal(){
  document.getElementById('exitModal').style.display='none';
  pendingExitId=null;
}

document.getElementById('exitConfirmBtn').addEventListener('click',function(){
  if(pendingExitId){
    const id=pendingExitId;
    closeExitModal();
    initiateSubmit(id);
  }
});

// Close modal on Escape key or clicking outside
document.getElementById('exitModal').addEventListener('click',function(e){
  if(e.target===this)closeExitModal();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&document.getElementById('exitModal').style.display==='flex')closeExitModal();
});

/* ============================================================
 *  EXIT PROCESSING
 * ============================================================ */
function initiateSubmit(id){
  const idStr=String(id);
  if(pendingRowIds.has(idStr))return;
  const p=filtered.find(x=>String(x.casperId)===idStr);
  if(!p)return;
  pendingRowIds.add(idStr);
  const backup=[...db];
  db=db.filter(i=>String(i.casperId)!==idStr);
  reportedIds.add(idStr);
  render();showToast('Processing exit...');
  apiFetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'report',n:p.name,id:p.casperId,ds:p.darkStore,c:p.city})})
  .then(res=>{
    if(res.status==='Success'){showToast('Exit Processed');try{localStorage.setItem(LOCAL_CACHE_KEY,JSON.stringify({data:db,ts:Date.now()}))}catch(e){}}
    else throw new Error(res.error);
  })
  .catch(()=>{db=backup;reportedIds.delete(idStr);render();showToast('Failed to process exit.',true)})
  .finally(()=>{pendingRowIds.delete(idStr);renderTable()});
}

/* ============================================================
 *  SCRIPT LOADER (for jsPDF)
 * ============================================================ */
const _ls={};
function loadScript(src){
  if(_ls[src])return _ls[src];
  _ls[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=()=>{delete _ls[src];rej(new Error('Failed: '+src))};document.head.appendChild(s)});
  return _ls[src];
}
/* FIX: Load jsPDF FIRST, then autoTable (must be sequential — autoTable depends on jsPDF) */
async function ensureJsPdf(){
  if(window.jspdf&&typeof window.jspdf.jsPDF==='function')return;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js');
  if(!window.jspdf||typeof window.jspdf.jsPDF!=='function')throw new Error('PDF library failed to load.');
}

/* ============================================================
 *  EXPORT — PDF
 * ============================================================ */
async function exportData(){
  if(filtered.length===0||isProcessing)return;
  setUILock(true);
  try{
    await ensureJsPdf();
    const{jsPDF}=window.jspdf,doc=new jsPDF();
    const pw=doc.internal.pageSize.getWidth();
    const hd={fillColor:[40,116,240],textColor:255,fontStyle:'bold',halign:'center'};
    const bd={halign:'center'};
    doc.setFontSize(16).text(managerMode?'CMSM Pendency Summary':'Picker Pendency Report',pw/2,15,{align:'center'});
    if(managerMode){
      const sm={};filtered.forEach(i=>sm[i.clusterManager]=(sm[i.clusterManager]||0)+1);
      doc.autoTable({head:[['Cluster Manager','Pending Count']],body:Object.entries(sm),startY:25,headStyles:hd,styles:bd});
    }else{
      doc.autoTable({head:[['#','User Name','User ID']],body:filtered.map((i,idx)=>[idx+1,i.name||'',i.casperId||'']),startY:25,headStyles:hd,styles:bd});
    }
    const c=citySelectInstance?citySelectInstance.getValue():'';
    const s=storeSelectInstance?storeSelectInstance.getValue():'';
    doc.save(((managerMode?c+'_CMSM_Pendency':(s||c)+'_Pendency')+'.pdf').replace(/[^a-zA-Z0-9_.-]/g,'_'));
    showToast('PDF Downloaded');
  }catch(e){showToast('PDF Export failed: '+e.message,true)}
  finally{setUILock(false)}
}

/* ============================================================
 *  EXPORT — Google Sheet
 * ============================================================ */
function exportToGSheet(){
  if(filtered.length===0||isProcessing)return;
  const btn=document.getElementById('btnGSheet');
  btn.textContent='Generating...';setUILock(true);
  const smMap={};filtered.forEach(i=>smMap[i.clusterManager]=(smMap[i.clusterManager]||0)+1);
  const sm=[['Cluster Manager','Total Pendency'],...Object.entries(smMap).sort()];
  const dt=[['CMSM','Dark Store','Name','Casper ID'],...filtered.map(i=>[i.clusterManager||'',i.darkStore||'',i.name||'',i.casperId||''])];
  const c=citySelectInstance?citySelectInstance.getValue():'';
  const s=storeSelectInstance?storeSelectInstance.getValue():'';
  const fTitle=((managerMode?c+'_Pendency':(s||c)+'_Pendency')).replace(/[^a-zA-Z0-9_-]/g,'_');
  apiFetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'export',f:fTitle,summaryData:sm,detailData:dt})})
  .then(d=>{if(d.url){window.open(d.url,'_blank');showToast('Google Sheet Created')}else throw new Error(d.error||'No URL')})
  .catch(err=>showToast('Export failed: '+(err.message||'Unknown error'),true))
  .finally(()=>{btn.innerHTML='&#128202; Open as G-Sheet';setUILock(false)});
}

/* ============================================================
 *  SNOW CANVAS — optimized: fewer particles, fixed color
 * ============================================================ */
function initSnow(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cvs=document.getElementById('snowCanvas');if(!cvs)return;
  const ctx=cvs.getContext('2d');
  let w,h,flakes=[],running=true;
  const COUNT=window.innerWidth<768?18:45;
  function resize(){w=cvs.width=window.innerWidth;h=cvs.height=window.innerHeight}
  function mkFlake(){return{x:Math.random()*w,y:Math.random()*h,r:Math.random()*2.6+0.7,speed:Math.random()*.8+.18,drift:Math.random()*.5-.25,opacity:Math.random()*.45+.18,wobble:Math.random()*Math.PI*2,ws:Math.random()*.022+.005}}
  function seed(){flakes=Array.from({length:COUNT},mkFlake)}
  function tick(){
    if(!running)return;
    ctx.clearRect(0,0,w,h);
    for(let k=0;k<flakes.length;k++){
      const f=flakes[k];
      f.wobble+=f.ws;f.y+=f.speed;f.x+=f.drift+Math.sin(f.wobble)*.35;
      if(f.y>h+5){Object.assign(f,mkFlake(),{y:-5,x:Math.random()*w})}
      if(f.x>w+5)f.x=-5;else if(f.x<-5)f.x=w+5;
      ctx.globalAlpha=f.opacity;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
      ctx.fillStyle='#fff';ctx.fill();
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize',function(){resize();seed()},{passive:true});
  document.addEventListener('visibilitychange',function(){running=!document.hidden;if(running)tick()});
  resize();seed();tick();
}
if('requestIdleCallback'in window)requestIdleCallback(initSnow,{timeout:1500});
else setTimeout(initSnow,300);
</script>
