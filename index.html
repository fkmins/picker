<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Picker Pendency Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/jpeg" href="https://i.cdn.newsbytesapp.com/images/l71720260823162158.jpeg">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

    <style>
        ::-webkit-scrollbar { display: none !important; }
        * { scrollbar-width: none !important; -ms-overflow-style: none !important; box-sizing: border-box; }
        
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca; --primary-soft: #e0e7ff;
            --danger: #ef4444; --danger-hover: #dc2626; --success: #10b981; --success-hover: #059669;
            --text-main: #0f172a; --text-muted: #64748b; --border-color: #e2e8f0;
        }

        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 50%, #e0e7ff 100%);
            margin: 0; padding: 30px 15px; min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text-main);
            display: flex; align-items: flex-start; justify-content: center;
        }

        #appLoader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #ffffff; z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s;
        }
        .spinner {
            width: 70px; height: 70px; border: 5px solid #e2e8f0; border-top: 5px solid var(--primary);
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        .loading-text-anim {
            margin-top: 25px; font-weight: 800; font-size: 18px; color: var(--primary);
            animation: bounceText 1.5s infinite; text-align: center;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes bounceText { 0%, 100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(-8px); opacity: 0.6; } }

        .side-popup {
            position: fixed; right: 20px; top: 20px; z-index: 1000;
            animation: slideInRight 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); border-radius: 12px; overflow: hidden;
            border: 2px solid #fff;
        }
        .side-popup img { width: 70px; height: 70px; object-fit: cover; display: block; }
        @keyframes slideInRight { 0% { transform: translateX(150px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }

        .glass-panel {
            background: rgba(255, 255, 255, 0.94); border-radius: 24px; padding: 35px 30px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08); width: 100%; max-width: 900px;
            border: 1px solid rgba(255, 255, 255, 0.8); z-index: 10;
        }
        .ui-locked { pointer-events: none; opacity: 0.6; }

        .brand-header { text-align: center; margin-bottom: 24px; }
        .dash-title { color: var(--text-main); font-weight: 800; font-size: 26px; margin: 0; }

        .tab-container { display: flex; justify-content: center; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
        .btn-tab {
            border: none; padding: 12px 22px; border-radius: 14px; font-weight: 700; background: #f1f5f9;
            color: var(--text-muted); transition: all 0.25s ease; flex: 1; max-width: 220px; cursor: pointer;
        }
        .btn-tab:hover:not(.active) { background: #e2e8f0; color: var(--text-main); }
        #btnNormal.active { background: var(--text-main); color: #ffffff; }
        #btnManager.active { background: var(--primary); color: #ffffff; }

        .ts-control { border-radius: 14px !important; padding: 12px 16px !important; border: 2px solid var(--border-color) !important; text-align: center !important; font-weight: 700; }
        .ts-dropdown .option { font-weight: 700; text-align: center !important; }

        #resultArea { display: none; margin-top: 30px; flex-direction: column; align-items: center; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; width: 100%; margin-bottom: 25px; }
        .metric-card { background: #ffffff; border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; text-align: center; }
        .metric-card .val { font-size: 26px; font-weight: 800; color: var(--primary); }
        .metric-card .lbl { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }

        .search-box { width: 100%; border-radius: 12px; padding: 12px 18px; border: 2px solid var(--border-color); font-weight: 600; text-align: center; margin-bottom: 20px; outline: none; }
        .action-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 25px; width: 100%; }
        .btn-action { border: none; padding: 12px 20px; border-radius: 12px; font-weight: 700; flex: 1; min-width: 160px; cursor: pointer; }
        .btn-pdf { background: var(--text-main); color: #ffffff; }
        .btn-sheet { background: var(--success); color: #ffffff; }
        .btn-csv { background: var(--primary); color: #ffffff; }

        .table-holder { background: #ffffff; border-radius: 16px; overflow-x: auto; width: 100%; border: 1px solid var(--border-color); }
        .table { margin-bottom: 0; min-width: 480px; text-align: center; }
        .table thead th { background: #f8fafc; color: var(--text-muted); font-size: 12px; font-weight: 800; text-transform: uppercase; padding: 16px; }
        .table td { padding: 16px; font-weight: 700; font-size: 14px; vertical-align: middle; }
        .btn-main-rep { background: var(--danger); color: #ffffff; border: none; padding: 8px 20px; border-radius: 10px; font-weight: 700; display: block; margin: 0 auto; cursor: pointer; }

        #toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; display: none; }
        .toast-msg { background: var(--text-main); color: #ffffff; padding: 14px 28px; border-radius: 50px; font-weight: 700; }
        
        .badge-count { background: var(--text-main); color: #fff; padding: 6px 14px; border-radius: 20px; }
        .na-bg { background: #fee2e2; color: #dc2626; padding: 4px 10px; border-radius: 6px; font-size: 12px; }

        @media (max-width: 768px) {
            .glass-panel { padding: 25px 15px; border-radius: 18px; }
            .btn-action { min-width: 100%; }
            .side-popup img { width: 50px; height: 50px; }
        }
    </style>
</head>

<body>

<div id="appLoader">
    <div class="spinner"></div>
    <div class="loading-text-anim">Loading Dashboard...</div>
</div>

<div id="sidePopup" class="side-popup">
    <img src="https://i.cdn.newsbytesapp.com/images/l71720260823162158.jpeg" alt="Side Logo">
</div>

<div class="glass-panel" id="mainPanel">
    <div class="brand-header"><h2 class="dash-title">Picker Pendency Dashboard</h2></div>

    <div class="tab-container">
        <button id="btnNormal" class="btn-tab active" onclick="setMode(0)">Dark Store Wise</button>
        <button id="btnManager" class="btn-tab" onclick="setMode(1)">Cluster Manager</button>
    </div>

    <div class="row g-3 justify-content-center mb-3">
        <div class="col-12 col-md-5"><select id="citySelect" autocomplete="off" onchange="onCityChange()"></select></div>
        <div class="col-12 col-md-5" id="storeWrapper"><select id="storeSelect" autocomplete="off" onchange="currentPage=1; render()"></select></div>
    </div>

    <div id="resultArea">
        <div class="metrics-grid">
            <div class="metric-card"><div class="val" id="countBadge">0</div><div class="lbl">Pending Pickers</div></div>
            <div class="metric-card"><div class="val" id="totalReportedBadge">0</div><div class="lbl">Reported Exits</div></div>
        </div>

        <div id="searchWrapper" style="width: 100%;"><input type="text" id="searchInput" class="search-box" placeholder="🔍 Search by Name or Casper ID..." oninput="onSearchInput()"></div>

        <div class="action-buttons">
            <button class="btn-action btn-pdf" onclick="exportData()">📄 Download PDF</button>
            <button class="btn-action btn-csv" onclick="exportToCSV()">📊 Download CSV</button>
            <button id="btnGSheet" class="btn-action btn-sheet" onclick="exportToGSheet()">🌐 Open as Google Sheet</button>
        </div>

        <div class="table-holder">
            <table class="table">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        
        <div id="paginationBar" style="display:none; justify-content:center; align-items:center; gap:15px; margin-top:20px; width:100%;">
            <button class="btn-tab" id="btnPrev" onclick="changePage(-1)" style="min-width:auto; padding:8px 16px;">Previous</button>
            <span id="pageInfo" style="font-weight:700;">Page 1</span>
            <button class="btn-tab" id="btnNext" onclick="changePage(1)" style="min-width:auto; padding:8px 16px;">Next</button>
        </div>
    </div>
</div>

<div id="toast-container"><div class="toast-msg" id="toastText"></div></div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2RP0gg4xrfVbBv1x8QPuxk_yspZqY9T9xkcuiUDh6S0jKA2wWdKsgHgPD0oGDRLURSA/exec";

    let db = [], filtered = [], managerMode = false, reportedIds = new Set();
    let citySelectInstance, storeSelectInstance;
    let isProcessing = false, currentPage = 1, toastTimer = null;
    let searchQuery = "";
    const PAGE_SIZE = 50;

    function remoteLogError(msg, stack, details) {
        fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "log_error", message: String(msg), stack: String(stack), details: String(details) }) }).catch(() => {});
    }

    const escHtml = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const checkNA = str => { const v = String(str).trim().toUpperCase(); return (!v || v === "N/A") ? `<span class="na-bg">N/A</span>` : escHtml(str); };

    function showToast(msg, isError = false) {
        const c = document.getElementById('toast-container'), t = document.getElementById('toastText');
        t.innerText = msg; t.style.background = isError ? "var(--danger)" : "var(--text-main)";
        c.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => { c.style.display = 'none'; }, 3500);
    }

    function setUILock(lock) { isProcessing = lock; document.getElementById('mainPanel').classList.toggle('ui-locked', lock); }
    function hideLoader() { const l = document.getElementById('appLoader'); if(l) { l.style.opacity = '0'; setTimeout(() => l.style.display = 'none', 500); } }

    window.onload = () => {
        citySelectInstance = new TomSelect("#citySelect", { placeholder: "Select City", create: false, sortField: { field: "text", direction: "asc" } });
        storeSelectInstance = new TomSelect("#storeSelect", { placeholder: "Select Dark Store", create: false, sortField: { field: "text", direction: "asc" } });

        fetch(`${SCRIPT_URL}?action=getData`)
            .then(r => r.json())
            .then(d => {
                hideLoader();
                if (d && d.error) { showToast(d.error, true); return; }
                db = Array.isArray(d) ? d : [];
                [...new Set(db.map(i => i.city))].sort().forEach(c => citySelectInstance.addOption({ value: c, text: c }));
            })
            .catch(err => { hideLoader(); showToast("Network Error", true); });
    };

    function setMode(m) {
        if (isProcessing) return;
        managerMode = !!m; currentPage = 1; searchQuery = ""; document.getElementById('searchInput').value = "";
        document.getElementById('btnNormal').classList.toggle('active', !m); document.getElementById('btnManager').classList.toggle('active', m);
        document.getElementById('storeWrapper').style.display = m ? 'none' : 'block';
        document.getElementById('searchWrapper').style.display = m ? 'none' : 'block';
        document.getElementById('resultArea').style.display = 'none';
        citySelectInstance.clear(); storeSelectInstance.clearOptions(); storeSelectInstance.clear();
    }

    function onCityChange() {
        if (isProcessing) return;
        const c = citySelectInstance.getValue(); currentPage = 1;
        if (!c) { document.getElementById('resultArea').style.display = 'none'; return; }
        if (managerMode) { render(); } else {
            storeSelectInstance.clearOptions(); storeSelectInstance.clear();
            [...new Set(db.filter(i => i.city === c).map(i => i.darkStore))].sort().forEach(s => storeSelectInstance.addOption({ value: s, text: s }));
            document.getElementById('resultArea').style.display = 'none';
        }
    }

    function onSearchInput() { searchQuery = document.getElementById('searchInput').value.trim().toLowerCase(); currentPage = 1; render(); }
    function changePage(dir) { currentPage += dir; renderTable(); }

    function render() {
        const c = citySelectInstance.getValue(), s = storeSelectInstance.getValue();
        if (!c || (!managerMode && !s)) { document.getElementById('resultArea').style.display = 'none'; return; }

        filtered = db.filter(i => {
            const mC = i.city === c, mS = managerMode || i.darkStore === s, nR = !reportedIds.has(String(i.casperId));
            let mQ = true;
            if (searchQuery && !managerMode) mQ = String(i.name).toLowerCase().includes(searchQuery) || String(i.casperId).toLowerCase().includes(searchQuery);
            return mC && mS && nR && mQ;
        });

        document.getElementById('countBadge').innerText = filtered.length;
        document.getElementById('totalReportedBadge').innerText = reportedIds.size;
        document.getElementById('resultArea').style.display = 'flex';
        renderTable();
    }

    function renderTable() {
        const tHead = document.getElementById('tableHead'), tBody = document.getElementById('tableBody'), pBar = document.getElementById('paginationBar');
        if (filtered.length === 0) {
            tHead.innerHTML = ''; tBody.innerHTML = `<tr><td colspan="${managerMode ? 2 : 3}"><b>No Records Found</b></td></tr>`;
            pBar.style.display = 'none'; return;
        }

        if (managerMode) {
            pBar.style.display = 'none';
            const sum = {}; filtered.forEach(i => { sum[i.clusterManager] = (sum[i.clusterManager] || 0) + 1; });
            tHead.innerHTML = '<tr><th>Cluster Manager</th><th>Pendency Count</th></tr>';
            tBody.innerHTML = Object.entries(sum).sort((a,b)=>a[0].localeCompare(b[0])).map(([n,v]) => `<tr><td>${checkNA(n)}</td><td><span class="badge-count">${v}</span></td></tr>`).join('');
        } else {
            const tot = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
            currentPage = Math.min(currentPage, tot);
            document.getElementById('pageInfo').innerText = `Page ${currentPage} of ${tot}`;
            document.getElementById('btnPrev').disabled = (currentPage === 1); document.getElementById('btnNext').disabled = (currentPage === tot);
            pBar.style.display = 'flex';

            const st = (currentPage - 1) * PAGE_SIZE;
            tHead.innerHTML = '<tr><th>Picker Name</th><th>Casper ID</th><th>Action</th></tr>';
            tBody.innerHTML = filtered.slice(st, st + PAGE_SIZE).map(i => `
                <tr id="row-${escHtml(i.casperId)}">
                    <td>${checkNA(i.name)}</td><td>${checkNA(i.casperId)}</td>
                    <td><button class="btn-main-rep" onclick="initiateSubmit('${escHtml(i.casperId)}')">Exit / Left</button></td>
                </tr>`).join('');
        }
    }

    function initiateSubmit(id) {
        const p = filtered.find(x => String(x.casperId) === String(id));
        if (!p) return;
        const backup = [...db]; db = db.filter(i => String(i.casperId) !== String(id)); reportedIds.add(String(p.casperId));
        render(); showToast("Processing exit...");

        fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "report", n: p.name, id: p.casperId, ds: p.darkStore, c: p.city }) })
            .then(r => r.json()).then(res => {
                if (res.status === "Success") showToast("Submitted ✓");
                else { db = backup; reportedIds.delete(String(p.casperId)); render(); showToast("Failed.", true); }
            }).catch(err => { db = backup; reportedIds.delete(String(p.casperId)); render(); showToast("Error", true); });
    }

    function exportData() {
        if(filtered.length===0) return; setUILock(true);
        const { jsPDF } = window.jspdf, doc = new jsPDF(), w = doc.internal.pageSize.getWidth();
        const hd = { fillColor: [253,253,150], textColor: 0, fontStyle: 'bold' }, b = { halign: 'center' };
        
        doc.setFontSize(16).text(managerMode ? "Summary" : "Pendency", w/2, 15, {align:"center"});
        if(managerMode) {
            const sm = {}; filtered.forEach(i => sm[i.clusterManager] = (sm[i.clusterManager]||0)+1);
            doc.autoTable({ head: [['CM', 'Count']], body: Object.entries(sm), startY: 25, headStyles: hd, styles: b });
        } else {
            doc.autoTable({ head: [['Name', 'ID']], body: filtered.map(i=>[i.name, i.casperId]), startY: 25, headStyles: hd, styles: b });
        }
        doc.save("Export.pdf"); setUILock(false);
    }

    function exportToCSV() {
        if(filtered.length===0) return;
        let c = managerMode ? "Cluster Manager,Store,Picker Name,Casper ID\n" : "Picker Name,Casper ID\n";
        filtered.forEach(i => { c += managerMode ? `"${i.clusterManager}","${i.darkStore}","${i.name}","${i.casperId}"\n` : `"${i.name}","${i.casperId}"\n`; });
        const l = document.createElement("a"); l.href = encodeURI("data:text/csv;charset=utf-8," + c); l.download = "Export.csv"; l.click();
    }

    function exportToGSheet() {
        if(filtered.length===0) return;
        document.getElementById('btnGSheet').innerText = "Generating..."; setUILock(true);
        const sm = [['CM', 'Total']]; filtered.forEach(i => sm.push([i.clusterManager, 1]));
        const dt = [['CM', 'Store', 'Name', 'ID'], ...filtered.map(i=>[i.clusterManager, i.darkStore, i.name, i.casperId])];
        
        fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "export", f: "Pendency Export", summaryData: sm, detailData: dt }) })
            .then(r => r.json()).then(d => {
                document.getElementById('btnGSheet').innerText = "Open as Google Sheet"; setUILock(false);
                if(d.url) window.open(d.url, '_blank'); else showToast("Failed", true);
            }).catch(e => { document.getElementById('btnGSheet').innerText = "Open as Google Sheet"; setUILock(false); });
    }
</script>
</body>
</html>
