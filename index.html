<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* Scrollbar — hidden globally, thin inside table */
::-webkit-scrollbar{display:none}
html,body{scrollbar-width:none;-ms-overflow-style:none}
.table-holder::-webkit-scrollbar{display:block;width:4px;height:4px}
.table-holder::-webkit-scrollbar-track{background:transparent}
.table-holder::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:4px}
.table-holder{scrollbar-width:thin}

:root{
  --fk-blue:#2874F0;--fk-blue-hover:#1a5dbf;--fk-yellow:#FFB400;
  --danger:#ef4444;--danger-hover:#dc2626;--success:#10b981;
  --bg-panel:rgba(255,255,255,0.82);--card-bg:rgba(255,255,255,0.97);
  --table-header:rgba(248,250,252,0.99);--table-hover:rgba(241,245,249,0.99);
  --dropdown-hover:rgba(40,116,240,0.10);
  --text-main:#0f172a;--text-muted:#64748b;
  --border-color:rgba(203,213,225,0.8);
  --shadow-panel:0 24px 64px rgba(0,0,0,0.20);
  --shadow-card:0 4px 16px rgba(0,0,0,0.07);
  --blur:blur(22px);
}
:root.dark-mode{
  --bg-panel:rgba(15,23,42,0.88);--card-bg:rgba(15,23,42,0.98);
  --table-header:rgba(8,14,31,0.98);--table-hover:rgba(30,41,59,0.98);
  --dropdown-hover:rgba(40,116,240,0.18);
  --text-main:#f1f5f9;--text-muted:#94a3b8;
  --border-color:rgba(51,65,85,0.8);
  --shadow-panel:0 24px 64px rgba(0,0,0,0.55);
  --shadow-card:0 4px 16px rgba(0,0,0,0.3);
}

/* Wallpaper */
body::before{
  content:"";position:fixed;inset:0;background-size:cover;
  background-position:center;background-attachment:fixed;z-index:0;
  animation:wallFadeIn .8s ease both;
}
body::after{
  content:"";position:fixed;inset:0;background:rgba(15,23,42,0.45);z-index:1;
  transition:background .3s ease;
}
:root.dark-mode body::after{background:rgba(5,10,25,0.65)}
@keyframes wallFadeIn{from{opacity:0}to{opacity:1}}

/* Snow canvas */
#snowCanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:2}

/* App Loader */
#appLoader{
  position:fixed;inset:0;background:rgba(5,10,25,0.88);z-index:99999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .45s ease;
}
#appLoader.hidden{opacity:0;pointer-events:none}
.loader-logo{width:64px;height:64px;border-radius:16px;object-fit:cover;box-shadow:0 8px 24px rgba(40,116,240,.5)}
.spinner{width:52px;height:52px;border:5px solid rgba(255,255,255,.15);border-top:5px solid var(--fk-blue);border-radius:50%;animation:spin .9s linear infinite}
.loading-text{font-family:Inter,sans-serif;font-weight:800;font-size:15px;color:rgba(255,255,255,.85);text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}

/* Offline Banner */
#offlineBanner{
  position:fixed;top:0;left:0;right:0;z-index:9998;
  background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;
  text-align:center;padding:10px 16px;font-size:13px;font-weight:700;
  font-family:Inter,sans-serif;display:none;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}

body{
  font-family:Inter,'Segoe UI',system-ui,sans-serif;color:var(--text-main);min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;padding:32px 16px 48px;
  position:relative;z-index:3;text-align:center;transition:color .3s ease;
}
.glass-panel{
  background:var(--bg-panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-radius:28px;padding:36px 32px;width:100%;max-width:920px;
  border:1px solid var(--border-color);box-shadow:var(--shadow-panel);
  position:relative;z-index:10;text-align:center;
  transition:background .3s ease,border-color .3s ease,box-shadow .3s ease;
  animation:panelSlideUp .5s cubic-bezier(.22,1,.36,1) both;
}
@keyframes panelSlideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.ui-locked{pointer-events:none;opacity:.6;cursor:wait}

/* Header */
.header-wrapper{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:26px;width:100%;gap:12px;flex-wrap:wrap}
.brand-header{display:flex;align-items:center;justify-content:center;gap:12px;flex:1;min-width:0}
.brand-logo{width:60px;height:44px;border-radius:12px;object-fit:cover;box-shadow:0 4px 14px rgba(40,116,240,.3);flex-shrink:0}
.brand-text{text-align:center}
.dash-title{font-weight:900;font-size:24px;color:var(--text-main);letter-spacing:-.6px;line-height:1.2;text-align:center;transition:color .3s ease}
.dash-subtitle{font-size:12px;font-weight:700;color:var(--fk-blue);text-transform:uppercase;letter-spacing:1px;margin-top:2px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#10b981;display:inline-block;transition:background .3s ease;flex-shrink:0}
.header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{
  background:var(--card-bg);border:1.5px solid var(--border-color);color:var(--text-main);
  border-radius:50px;padding:7px 15px;font-size:12px;font-weight:800;cursor:pointer;
  transition:all .2s ease;text-align:center;white-space:nowrap;letter-spacing:.3px;font-family:Inter,sans-serif;
}
.icon-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-card);background:var(--table-hover)}
.icon-btn:active{transform:scale(.96)}
.refresh-spin{animation:spin .7s linear infinite}

.divider{width:100%;height:1px;background:var(--border-color);margin:0 0 24px;border:none}

/* Tabs */
.tab-container{display:flex;justify-content:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.btn-tab{
  border:1.5px solid var(--border-color);padding:11px 26px;border-radius:50px;
  font-weight:800;font-size:13px;background:var(--card-bg);color:var(--text-muted);
  transition:all .22s ease;flex:1;max-width:220px;cursor:pointer;text-align:center;
  letter-spacing:.2px;font-family:Inter,sans-serif;
}
.btn-tab:hover:not(.active){border-color:var(--fk-blue);color:var(--fk-blue);transform:translateY(-2px)}
.btn-tab.active{
  background:linear-gradient(135deg,var(--fk-blue) 0%,#1a5dbf 100%);color:#fff;
  border-color:var(--fk-blue);box-shadow:0 6px 18px rgba(40,116,240,.35);transform:translateY(-1px);
}

/* Filters */
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-bottom:16px;width:100%}
.filter-col{flex:1 1 260px;max-width:420px;text-align:center}

/* Tom Select — CRITICAL: center alignment fix */
.ts-wrapper{text-align:center}
.ts-wrapper .ts-control{
  border-radius:14px!important;padding:13px 18px!important;border:1.5px solid var(--border-color)!important;
  font-weight:700!important;font-size:14px!important;font-family:Inter,sans-serif!important;
  background:var(--card-bg)!important;color:var(--text-main)!important;
  transition:border-color .2s,box-shadow .2s!important;
  justify-content:center!important;
  display:flex!important;
}
.ts-wrapper .ts-control>.item{
  text-align:center!important;flex-grow:1!important;max-width:100%!important;
  font-weight:700!important;color:var(--text-main)!important;
}
.ts-wrapper .ts-control>input{text-align:center!important;flex-grow:1!important}
.ts-wrapper .ts-control.focus{border-color:var(--fk-blue)!important;box-shadow:0 0 0 3px rgba(40,116,240,.18)!important}
.ts-dropdown{
  background:var(--card-bg)!important;color:var(--text-main)!important;
  border:1.5px solid var(--border-color)!important;border-radius:14px!important;
  box-shadow:0 12px 32px rgba(0,0,0,.22)!important;font-family:Inter,sans-serif!important;
}
.ts-dropdown .option{text-align:center!important;padding:11px 16px!important;font-weight:600!important;font-size:13px!important}
.ts-dropdown .option:hover,.ts-dropdown .option.active{background:var(--dropdown-hover)!important;color:var(--fk-blue)!important;font-weight:800!important}
.ts-dropdown .no-results{text-align:center!important;color:var(--text-muted)!important}

/* Search */
.search-wrapper{position:relative;width:100%;margin-bottom:20px}
.search-box{
  width:100%;border-radius:14px;padding:14px 22px;border:1.5px solid var(--border-color);
  font-weight:600;font-size:14px;font-family:Inter,sans-serif;background:var(--card-bg);
  color:var(--text-main);text-align:center;transition:border-color .2s,box-shadow .2s;
}
.search-box::placeholder{color:var(--text-muted)}
.search-box:focus{border-color:var(--fk-blue);outline:none;box-shadow:0 0 0 3px rgba(40,116,240,.15)}

/* Result Area */
#resultArea{display:none;margin-top:22px;flex-direction:column;align-items:center;width:100%;animation:fadeIn .4s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Metrics */
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;width:100%;margin-bottom:14px}
.metric-card{
  background:var(--card-bg);border:1px solid var(--border-color);border-radius:18px;
  padding:22px 18px;text-align:center;position:relative;overflow:hidden;
  transition:transform .2s ease,box-shadow .2s ease,background .3s ease;box-shadow:var(--shadow-card);
}
.metric-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--fk-blue),var(--fk-yellow))}
.metric-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.13)}
.metric-card .val{font-size:32px;font-weight:900;background:linear-gradient(135deg,var(--fk-blue),#4f9cf9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:8px;text-align:center}
.metric-card .val.freshness{font-size:16px;-webkit-text-fill-color:currentColor;background:none;transition:color .3s ease}
.metric-card .lbl{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text-muted);letter-spacing:.8px;text-align:center}

/* Action Buttons */
.action-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:22px;width:100%}
.btn-action{
  border:none;padding:13px 22px;border-radius:14px;font-weight:800;font-size:13px;
  font-family:Inter,sans-serif;flex:1;min-width:120px;cursor:pointer;transition:all .2s ease;text-align:center;letter-spacing:.3px;
}
.btn-action:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.btn-action:active{transform:scale(.97)}
.btn-pdf{background:linear-gradient(135deg,#334155,#1e293b);color:#fff}
.btn-sheet{background:linear-gradient(135deg,var(--success),#0d9669);color:#fff}
.btn-csv{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff}

/* Table */
.table-holder{background:var(--card-bg);border-radius:18px;width:100%;border:1px solid var(--border-color);max-height:460px;overflow-y:auto;overflow-x:auto;box-shadow:var(--shadow-card);transition:background .3s ease}
.table{border-collapse:collapse;width:100%;min-width:460px;color:var(--text-main);text-align:center}
.table th,.table td{text-align:center!important;padding:15px 16px;vertical-align:middle}
.table thead th{
  background:var(--table-header);color:var(--text-muted);font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.7px;position:sticky;top:0;z-index:2;
  border-bottom:2px solid var(--border-color);
}
.table td{font-weight:600;font-size:14px;border-bottom:1px solid var(--border-color);transition:background .15s ease}
.table tbody tr:nth-child(even) td{background:var(--table-hover)}
.table tbody tr:hover td{background:var(--dropdown-hover)}
.table tbody tr:last-child td{border-bottom:none}

/* Badges & Pills */
.btn-exit{
  background:linear-gradient(135deg,var(--danger),#b91c1c);color:#fff;border:none;
  padding:8px 20px;border-radius:10px;font-weight:800;font-size:12px;font-family:Inter,sans-serif;
  cursor:pointer;transition:transform .2s ease,opacity .2s ease;letter-spacing:.3px;
}
.btn-exit:hover:not(:disabled){transform:translateY(-2px);opacity:.9}
.btn-exit:disabled{opacity:.45;cursor:wait}
.badge-count{background:linear-gradient(135deg,var(--fk-blue),#1a5dbf);color:#fff;padding:5px 14px;border-radius:50px;display:inline-block;font-weight:800;font-size:13px}
.na-bg{background:rgba(239,68,68,.1);color:var(--danger);padding:3px 10px;border-radius:6px;font-size:12px;border:1px solid rgba(239,68,68,.2);display:inline-block}
.pill-id{background:rgba(40,116,240,.1);color:var(--fk-blue);padding:4px 12px;border-radius:50px;font-weight:800;font-size:13px;display:inline-block;border:1px solid rgba(40,116,240,.2)}

/* Pagination */
#paginationBar{display:none;justify-content:center;align-items:center;gap:14px;margin-top:18px;width:100%;text-align:center}
.page-info{font-weight:700;font-size:13px;color:var(--text-muted);min-width:140px;text-align:center}
.btn-page{
  background:var(--card-bg);border:1.5px solid var(--border-color);color:var(--text-main);
  border-radius:50px;padding:8px 18px;font-weight:800;font-size:12px;font-family:Inter,sans-serif;cursor:pointer;transition:all .2s ease;
}
.btn-page:hover:not(:disabled){border-color:var(--fk-blue);color:var(--fk-blue);transform:translateY(-1px)}
.btn-page:disabled{opacity:.4;cursor:default}

/* Toast */
#toast-container{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;text-align:center}
.toast-msg{
  background:var(--text-main);color:var(--card-bg);padding:13px 28px;border-radius:50px;
  font-weight:700;font-size:13px;font-family:Inter,sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.25);
  text-align:center;transition:opacity .3s ease,transform .3s ease;
}
.toast-msg.hidden{opacity:0;transform:translateY(8px);pointer-events:none}

/* Responsive */
@media(max-width:768px){
  body{padding:20px 10px 40px}
  .glass-panel{padding:24px 16px;border-radius:20px}
  .dash-title{font-size:18px}
  .brand-header{flex-direction:column;gap:6px}
  .header-wrapper{flex-direction:column;align-items:center}
  .btn-tab{flex:1 1 42%;max-width:none;padding:10px 12px;font-size:12px}
  .btn-action{min-width:100px;font-size:12px;padding:11px 14px}
  .metric-card .val{font-size:24px}
  .table th,.table td{padding:12px 10px;font-size:13px}
}
@media(max-width:480px){
  .table{min-width:400px}
  #paginationBar{flex-wrap:wrap;gap:8px}
  .btn-page{padding:7px 14px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="offlineBanner">⚠ Showing cached data — network connection failed. Data may be outdated.</div>
<canvas id="snowCanvas" aria-hidden="true"></canvas>

<div id="appLoader">
  <img class="loader-logo" src="https://raw.githubusercontent.com/n3r4zzurr0/svg-spinners/refs/heads/main/svg-smil/wind-toy.svg" alt="Loading" decoding="async">

<div class="glass-panel" id="mainPanel">
  <div class="header-wrapper">
    <div class="brand-header">
      <img src="https://2dioqsev90.ucarecd.net/1e9d129e-8ea7-488c-919d-345bc4d7dcc4/l71720260823162158.webp" class="brand-logo" alt="FK Minutes Logo" decoding="async" loading="eager">

</div>

<script>
/* ============================================================
 *  CONFIGURATION
 * ============================================================ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyjdAbFLKaTlqMahcRO-Dx5JAf0PX8VGfFyDoeSS18_UL52pVScXbJRNHkKI-QMhNSbGA/exec';
const LOCAL_CACHE_KEY = 'pickerDashboard_cache_v4';
const LOCAL_CACHE_MAX_MS = 10 * 60 * 1000; // 10 min
const PAGE_SIZE = 50;
const AUTO_REFRESH_MS = 5 * 60 * 1000; // 5 min

/* ============================================================
 *  STATE
 * ============================================================ */
let db = [], filtered = [], reportedIds = new Set(), pendingRowIds = new Set();
let citySelectInstance, storeSelectInstance;
let managerMode = false, currentPage = 1, isProcessing = false, lastLoadedAt = null;
let searchQuery = '', searchDebounceTimer = null, toastTimer = null;
let autoRefreshTimer = null, freshnessTimer = null;

/* ============================================================
 *  UTILITY HELPERS
 * ============================================================ */
const $ = id => document.getElementById(id);
const escHtml = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const checkNA = str => { const v = String(str ?? '').trim().toUpperCase(); return (!v || v === 'N/A') ? '<span class="na-bg">N/A</span>' : escHtml(str); };

function normalizeRow(r) {
  return { casperId: r.id, name: r.nm, darkStore: r.ds, city: r.ct, clusterManager: r.cm };
}

/* ============================================================
 *  NETWORK — Robust fetch with retry + timeout
 * ============================================================ */
async function apiFetch(url, options = {}) {
  const MAX_RETRIES = 2;
  const TIMEOUT_MS = options.method === 'POST' ? 30000 : 15000;

  for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
      const res = await fetch(url, {
        ...options,
        redirect: 'follow',
        signal: controller.signal
      });
      clearTimeout(timer);
      const text = await res.text();
      try { return JSON.parse(text); }
      catch { throw new Error('Invalid response from server. Please redeploy and update the script URL.'); }
    } catch (err) {
      if (err.name === 'AbortError') {
        if (attempt === MAX_RETRIES) throw new Error('Request timed out. Server may be cold-starting — please retry.');
      } else if (attempt === MAX_RETRIES) {
        throw err;
      }
      // Exponential backoff: 1s, 2s
      await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
    }
  }
}

/* ============================================================
 *  THEME
 * ============================================================ */
function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark-mode');
  $('themeToggleBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
}

/* ============================================================
 *  LOADER & TOAST
 * ============================================================ */
function hideLoader() {
  const l = $('appLoader');
  if (!l) return;
  l.classList.add('hidden');
  setTimeout(() => l.style.display = 'none', 450);
}

function showToast(msg, isError = false) {
  const t = $('toastText');
  t.textContent = msg;
  t.style.background = isError ? 'var(--danger)' : 'var(--text-main)';
  t.style.color = isError ? '#fff' : 'var(--card-bg)';
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 3500);
}

function setUILock(on) {
  isProcessing = on;
  $('mainPanel').classList.toggle('ui-locked', on);
}

/* ============================================================
 *  CONNECTION STATUS
 * ============================================================ */
function setConnectionStatus(online) {
  const dot = $('connDot');
  if (dot) {
    dot.style.background = online ? '#10b981' : '#ef4444';
    dot.title = online ? 'Connected' : 'Offline';
  }
}

/* ============================================================
 *  DATA FRESHNESS
 * ============================================================ */
function startFreshnessTracker() {
  if (freshnessTimer) clearInterval(freshnessTimer);
  updateFreshness();
  freshnessTimer = setInterval(updateFreshness, 30000); // every 30s
}

function updateFreshness() {
  if (!lastLoadedAt) return;
  const diffMs = Date.now() - lastLoadedAt.getTime();
  const diffMin = Math.floor(diffMs / 60000);
  const badge = $('freshnessBadge');
  if (!badge) return;

  if (diffMin < 1) badge.textContent = 'Just now';
  else if (diffMin === 1) badge.textContent = '1 min ago';
  else badge.textContent = diffMin + ' min ago';

  // Color coding: green < 5m, yellow < 10m, red > 10m
  if (diffMin < 5) badge.style.color = '#10b981';
  else if (diffMin < 10) badge.style.color = '#f59e0b';
  else badge.style.color = '#ef4444';
}

/* ============================================================
 *  AUTO-REFRESH
 * ============================================================ */
function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(() => {
    loadData(false); // silent background refresh
  }, AUTO_REFRESH_MS);
}

/* ============================================================
 *  MANUAL REFRESH
 * ============================================================ */
function manualRefresh() {
  if (isProcessing) return;
  const btn = $('refreshBtn');
  const origText = btn.textContent;
  btn.innerHTML = '<span class="refresh-spin">↻</span> Refreshing...';
  loadData(false).finally(() => {
    btn.textContent = '↻ Refresh';
  });
}

/* ============================================================
 *  CITY / STORE FILTERS
 * ============================================================ */
function populateCityOptions() {
  const cur = citySelectInstance.getValue();
  citySelectInstance.clearOptions();
  [...new Set(db.map(i => i.city))].filter(Boolean).sort()
    .forEach(c => citySelectInstance.addOption({ value: c, text: c }));
  if (cur) citySelectInstance.setValue(cur, true);
}

/* ============================================================
 *  DATA LOADING
 * ============================================================ */
function loadData(showLoaderOnError = true) {
  return apiFetch(SCRIPT_URL + '?action=getData')
    .then(d => {
      hideLoader();
      if (d?.error) { showToast('Backend Error: ' + d.error, true); return; }
      db = Array.isArray(d) ? d.map(normalizeRow) : [];
      populateCityOptions();
      lastLoadedAt = new Date();
      setConnectionStatus(true);
      $('offlineBanner').style.display = 'none';
      startFreshnessTracker();

      try {
        localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ data: db, ts: Date.now() }));
      } catch (e) {}

      if (citySelectInstance.getValue()) {
        if (!managerMode) onCityChange(true);
        render();
      }
    })
    .catch(err => {
      hideLoader();
      setConnectionStatus(false);
      if (db.length > 0) {
        // Show cached data with warning
        $('offlineBanner').style.display = 'block';
        if (!showLoaderOnError) showToast('Using cached data. Refresh when online.', true);
      } else {
        showToast('Network Error: ' + (err.message || 'Please check your connection.'), true);
      }
    });
}

/* ============================================================
 *  INITIALIZATION
 * ============================================================ */
window.onload = () => {
  // Theme state
  if (document.documentElement.classList.contains('dark-mode'))
    $('themeToggleBtn').textContent = '☀️ Light Mode';

  // Initialize Tom Select
  citySelectInstance = new TomSelect('#citySelect', { placeholder: 'Select City', create: false, sortField: { field: 'text' } });
  storeSelectInstance = new TomSelect('#storeSelect', { placeholder: 'Select Dark Store', create: false, sortField: { field: 'text' } });

  // Try loading from cache first (instant render)
  const cached = (function () {
    try {
      const raw = localStorage.getItem(LOCAL_CACHE_KEY);
      if (!raw) return null;
      const p = JSON.parse(raw);
      return (Date.now() - p.ts <= LOCAL_CACHE_MAX_MS) ? p : null;
    } catch (e) { return null; }
  })();

  if (cached) {
    db = cached.data;
    populateCityOptions();
    lastLoadedAt = new Date(cached.ts);
    startFreshnessTracker();
    hideLoader();
  }

  // Always fetch fresh data (background if cache was used)
  loadData(!cached);

  // Start auto-refresh
  startAutoRefresh();
};

/* ============================================================
 *  MODE SWITCHING
 * ============================================================ */
function setMode(m) {
  if (isProcessing) return;
  managerMode = !!m;
  currentPage = 1;
  searchQuery = '';
  $('searchInput').value = '';
  $('btnNormal').classList.toggle('active', !m);
  $('btnManager').classList.toggle('active', !!m);
  $('storeWrapper').style.display = m ? 'none' : '';
  $('searchWrapper').style.display = m ? 'none' : '';
  if (citySelectInstance.getValue()) {
    if (managerMode) render(); else onCityChange();
  } else {
    $('resultArea').style.display = 'none';
  }
}

function onCityChange(silent = false) {
  if (isProcessing) return;
  const c = citySelectInstance.getValue();
  currentPage = 1;
  if (!c) { $('resultArea').style.display = 'none'; return; }
  if (managerMode) { if (!silent) render(); return; }

  const prev = storeSelectInstance.getValue();
  storeSelectInstance.clearOptions();
  if (!silent) storeSelectInstance.clear();
  [...new Set(db.filter(i => i.city === c).map(i => i.darkStore))].filter(Boolean).sort()
    .forEach(s => storeSelectInstance.addOption({ value: s, text: s }));
  if (prev && silent) storeSelectInstance.setValue(prev, true);
  if (!silent) $('resultArea').style.display = 'none';
}

/* ============================================================
 *  SEARCH
 * ============================================================ */
function onSearchInput() {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => {
    searchQuery = $('searchInput').value.trim().toLowerCase();
    currentPage = 1;
    render();
  }, 240);
}

/* ============================================================
 *  RENDER
 * ============================================================ */
function changePage(dir) { currentPage += dir; renderTable(); }

function render() {
  const c = citySelectInstance.getValue(), s = storeSelectInstance.getValue();
  if (!c || (!managerMode && !s)) { $('resultArea').style.display = 'none'; return; }

  filtered = db.filter(i => {
    if (i.city !== c) return false;
    if (!managerMode && i.darkStore !== s) return false;
    if (reportedIds.has(String(i.casperId))) return false;
    if (searchQuery && !managerMode) {
      return String(i.name).toLowerCase().includes(searchQuery) ||
             String(i.casperId).toLowerCase().includes(searchQuery);
    }
    return true;
  });

  $('countBadge').textContent = filtered.length;
  $('totalReportedBadge').textContent = reportedIds.size;
  $('resultArea').style.display = 'flex';
  renderTable();
}

function renderTable() {
  const tHead = $('tableHead'), tBody = $('tableBody'), pBar = $('paginationBar');

  if (filtered.length === 0) {
    tHead.innerHTML = '';
    tBody.innerHTML = '<tr><td colspan="' + (managerMode ? 2 : 4) + '" style="padding:32px;color:var(--text-muted);font-weight:700;">No records found</td></tr>';
    pBar.style.display = 'none';
    return;
  }

  if (managerMode) {
    pBar.style.display = 'none';
    const sum = {};
    filtered.forEach(i => { sum[i.clusterManager] = (sum[i.clusterManager] || 0) + 1; });
    tHead.innerHTML = '<tr><th>Cluster Manager</th><th>Pendency Count</th></tr>';
    tBody.innerHTML = Object.entries(sum).sort((a, b) => a[0].localeCompare(b[0]))
      .map(([n, v]) => '<tr><td>' + checkNA(n) + '</td><td><span class="badge-count">' + v + '</span></td></tr>').join('');
  } else {
    const tot = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    currentPage = Math.min(currentPage, tot);
    const st = (currentPage - 1) * PAGE_SIZE;
    const end = Math.min(st + PAGE_SIZE, filtered.length);

    $('pageInfo').textContent = 'Showing ' + (st + 1) + '–' + end + ' of ' + filtered.length;
    $('btnPrev').disabled = (currentPage === 1);
    $('btnNext').disabled = (currentPage === tot);
    pBar.style.display = 'flex';

    tHead.innerHTML = '<tr><th>#</th><th>User Name</th><th>User ID</th><th>Action</th></tr>';
    tBody.innerHTML = filtered.slice(st, end).map((i, idx) =>
      '<tr id="row-' + escHtml(i.casperId) + '">' +
      '<td style="color:var(--text-muted);font-size:12px;font-weight:700">' + (st + idx + 1) + '</td>' +
      '<td>' + checkNA(i.name) + '</td>' +
      '<td><span class="pill-id">' + checkNA(i.casperId) + '</span></td>' +
      '<td><button class="btn-exit" ' + (pendingRowIds.has(String(i.casperId)) ? 'disabled' : '') +
      ' onclick="confirmSubmit(\'' + escHtml(i.casperId) + '\')">Exit</button></td>' +
      '</tr>'
    ).join('');
  }
}

/* ============================================================
 *  EXIT PROCESSING
 * ============================================================ */
function confirmSubmit(id) {
  const p = filtered.find(x => String(x.casperId) === String(id));
  const label = (p && p.name && p.name.toUpperCase() !== 'N/A') ? p.name : id;
  if (confirm('Mark "' + label + '" as exited?')) initiateSubmit(id);
}

function initiateSubmit(id) {
  const idStr = String(id);
  if (pendingRowIds.has(idStr)) return;
  const p = filtered.find(x => String(x.casperId) === idStr);
  if (!p) return;

  pendingRowIds.add(idStr);
  const backup = [...db];
  db = db.filter(i => String(i.casperId) !== idStr);
  reportedIds.add(idStr);
  render();
  showToast('Processing exit...');

  apiFetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'report', n: p.name, id: p.casperId, ds: p.darkStore, c: p.city })
  })
  .then(res => {
    if (res.status === 'Success') {
      showToast('Exit processed ✓');
      try { localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ data: db, ts: Date.now() })); } catch (e) {}
    } else {
      throw new Error(res.error || 'Unknown error');
    }
  })
  .catch(() => {
    db = backup;
    reportedIds.delete(idStr);
    render();
    showToast('Failed to process exit. Please retry.', true);
  })
  .finally(() => {
    pendingRowIds.delete(idStr);
    renderTable();
  });
}

/* ============================================================
 *  SCRIPT LOADER (for jsPDF)
 * ============================================================ */
const _loadedScripts = {};
function loadScript(src) {
  if (_loadedScripts[src]) return _loadedScripts[src];
  _loadedScripts[src] = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.onload = res;
    s.onerror = () => { delete _loadedScripts[src]; rej(new Error('Failed to load: ' + src)); };
    document.head.appendChild(s);
  });
  return _loadedScripts[src];
}

// CRITICAL FIX: Load jsPDF THEN autoTable (sequential, not parallel)
async function ensureJsPdf() {
  if (window.jspdf && typeof window.jspdf.jsPDF === 'function') return;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js');
  if (!window.jspdf || typeof window.jspdf.jsPDF !== 'function') {
    throw new Error('PDF library failed to load. Check your internet connection.');
  }
}

/* ============================================================
 *  EXPORT — PDF
 * ============================================================ */
async function exportData() {
  if (filtered.length === 0 || isProcessing) return;
  setUILock(true);
  showToast('Preparing PDF...');
  try {
    await ensureJsPdf();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pw = doc.internal.pageSize.getWidth();
    const hd = { fillColor: [40, 116, 240], textColor: 255, fontStyle: 'bold', halign: 'center' };
    const bd = { halign: 'center' };
    const c = citySelectInstance ? citySelectInstance.getValue() : '';
    const s = storeSelectInstance ? storeSelectInstance.getValue() : '';

    doc.setFontSize(16).text(
      managerMode ? 'CMSM Pendency Summary — ' + c : 'Picker Pendency — ' + (s || c),
      pw / 2, 15, { align: 'center' }
    );

    if (managerMode) {
      const sm = {};
      filtered.forEach(i => sm[i.clusterManager] = (sm[i.clusterManager] || 0) + 1);
      doc.autoTable({ head: [['Cluster Manager', 'Pending Count']], body: Object.entries(sm), startY: 25, headStyles: hd, styles: bd });
    } else {
      doc.autoTable({
        head: [['#', 'User Name', 'User ID']],
        body: filtered.map((i, idx) => [idx + 1, i.name || '', i.casperId || '']),
        startY: 25, headStyles: hd, styles: bd
      });
    }

    const fileName = ((managerMode ? c + '_CMSM_Pendency' : (s || c) + '_Pendency') + '.pdf').replace(/[^a-zA-Z0-9_.-]/g, '_');
    doc.save(fileName);
    showToast('PDF downloaded ✓');
  } catch (e) {
    console.error('PDF Export Error:', e);
    showToast('PDF export failed: ' + e.message, true);
  } finally {
    setUILock(false);
  }
}

/* ============================================================
 *  EXPORT — CSV (instant, no server needed)
 * ============================================================ */
function exportCSV() {
  if (filtered.length === 0) { showToast('No data to export', true); return; }

  const esc = v => '"' + String(v || '').replace(/"/g, '""') + '"';
  let csv;

  if (managerMode) {
    const sum = {};
    filtered.forEach(i => sum[i.clusterManager] = (sum[i.clusterManager] || 0) + 1);
    csv = 'Cluster Manager,Pendency Count\n' +
      Object.entries(sum).sort().map(([n, v]) => esc(n) + ',' + v).join('\n');
  } else {
    csv = '#,User Name,Casper ID,Dark Store,Cluster Manager\n' +
      filtered.map((i, idx) =>
        (idx + 1) + ',' + esc(i.name) + ',' + esc(i.casperId) + ',' + esc(i.darkStore) + ',' + esc(i.clusterManager)
      ).join('\n');
  }

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pendency_export.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV downloaded ✓');
}

/* ============================================================
 *  EXPORT — Google Sheet
 * ============================================================ */
function exportToGSheet() {
  if (filtered.length === 0 || isProcessing) return;
  const btn = $('btnGSheet');
  btn.textContent = '⏳ Generating...';
  setUILock(true);

  const smMap = {};
  filtered.forEach(i => smMap[i.clusterManager] = (smMap[i.clusterManager] || 0) + 1);
  const sm = [['Cluster Manager', 'Total Pendency'], ...Object.entries(smMap).sort()];
  const dt = [['CMSM', 'Dark Store', 'Name', 'Casper ID'],
    ...filtered.map(i => [i.clusterManager || '', i.darkStore || '', i.name || '', i.casperId || ''])];

  const c = citySelectInstance ? citySelectInstance.getValue() : '';
  const s = storeSelectInstance ? storeSelectInstance.getValue() : '';
  const fTitle = ((managerMode ? c + '_Pendency' : (s || c) + '_Pendency')).replace(/[^a-zA-Z0-9_-]/g, '_');

  apiFetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'export', f: fTitle, summaryData: sm, detailData: dt })
  })
  .then(d => {
    if (d.url) { window.open(d.url, '_blank'); showToast('Google Sheet created ✓'); }
    else throw new Error(d.error || 'No URL returned');
  })
  .catch(err => showToast('Export failed: ' + (err.message || 'Unknown error'), true))
  .finally(() => { btn.innerHTML = '📊 Open as G-Sheet'; setUILock(false); });
}

/* ============================================================
 *  KEYBOARD SHORTCUTS
 * ============================================================ */
document.addEventListener('keydown', e => {
  // Ctrl+F or / → focus search (when not already in an input)
  if ((e.ctrlKey && e.key === 'f') || (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName))) {
    e.preventDefault();
    const searchBox = $('searchInput');
    if (searchBox && searchBox.offsetParent !== null) searchBox.focus();
  }
});

/* ============================================================
 *  SNOW CANVAS — Optimized
 * ============================================================ */
function initSnow() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cvs = $('snowCanvas');
  if (!cvs) return;
  const ctx = cvs.getContext('2d');
  let w, h, flakes = [], running = true;
  const COUNT = window.innerWidth < 768 ? 20 : 40; // Reduced particle count

  function resize() { w = cvs.width = window.innerWidth; h = cvs.height = window.innerHeight; }

  function mkFlake() {
    return {
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 2.6 + 0.7,
      speed: Math.random() * .8 + .18,
      drift: Math.random() * .5 - .25,
      opacity: Math.random() * .45 + .18,
      wobble: Math.random() * Math.PI * 2,
      ws: Math.random() * .022 + .005
    };
  }

  function seed() { flakes = Array.from({ length: COUNT }, mkFlake); }

  function tick() {
    if (!running) return;
    ctx.clearRect(0, 0, w, h);
    flakes.forEach(f => {
      f.wobble += f.ws;
      f.y += f.speed;
      f.x += f.drift + Math.sin(f.wobble) * .35;
      if (f.y > h + 5) { Object.assign(f, mkFlake(), { y: -5, x: Math.random() * w }); }
      if (f.x > w + 5) f.x = -5; else if (f.x < -5) f.x = w + 5;
      ctx.save();
      ctx.globalAlpha = f.opacity;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,1)'; // Fixed white — no per-frame CSS lookup
      ctx.fill();
      ctx.restore();
    });
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', () => { resize(); seed(); }, { passive: true });
  document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) tick(); });
  resize(); seed(); tick();
}

// Defer snow until after DOM is interactive
if ('requestIdleCallback' in window) requestIdleCallback(initSnow, { timeout: 1500 });
else setTimeout(initSnow, 300);
