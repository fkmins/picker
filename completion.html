<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --fk-blue:#2874F0; --fk-yellow:#FFB400; --gold:#D4AF37; --gold-light:#F5E6B8;
  --danger:#ef4444; --success:#10b981;

  --text-main:#0f172a; --text-muted:#64748b;

  --shadow-card:0 4px 12px rgba(0,0,0,0.05);

}
:root.dark-mode{
  --bg-panel:rgba(15,23,42,0.92); --card-bg:#1e293b;

  --shadow-card:0 4px 12px rgba(0,0,0,0.4);
}

body::before{content:"";position:fixed;top:0;left:0;width:100vw;height:100vh;background-size:cover;background-position:center;background-repeat:no-repeat;z-index:0;animation:wallIn 1s ease both}
body::after{content:"";position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:1;transition:background 0.3s ease}
:root.dark-mode body::after{background:rgba(5,10,25,0.75)}

@keyframes wallIn{from{opacity:0}to{opacity:1}}
@keyframes panelUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

/* Loader Spinner */

.spinner { width: 56px; height: 56px; border: 5px solid rgba(255, 255, 255, 0.1); border-top-color: var(--fk-yellow); border-radius: 50%; animation: spin 1s linear infinite; }

.auth-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.9);z-index:999999;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.3s ease}

.ts-wrapper .ts-control > input { color: var(--text-main)!important; }

.section-title{font-weight:800;font-size:16px;text-transform:uppercase;color:var(--fk-blue);margin-bottom:16px;text-align:left; border-bottom:2px solid var(--border-color); padding-bottom:10px;}

.tbl-wrap{border-radius:12px;width:100%;overflow:auto;max-height:380px; border:1px solid var(--border-color);}
.tbl{border-collapse:collapse;width:100%;min-width:300px;text-align:left;}
.tbl th, .tbl td{padding:14px 16px;vertical-align:middle;}

.total-row td{font-weight:800!important;background:var(--table-header)!important;border-top:2px solid var(--fk-blue)!important}

.btn-export{border:none;padding:14px 30px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;background:#334155;color:#fff;margin-bottom:24px; transition:all 0.2s; display:inline-flex; align-items:center; gap:8px;}
.btn-export:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.2);}
.btn-export:disabled{opacity:0.6; cursor:wait; transform:none;}

#toast-container{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none}

<script>
const LOCAL_CACHE_KEY='completionDash_v3';
const CACHE_TTL=10*60*1000;

let rawData=[],trainerTS, toastTimer=null;

document.addEventListener("DOMContentLoaded", () => {
  const isDark = document.documentElement.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
});

function hideLoader(){const l=document.getElementById('appLoader');if(!l)return;l.classList.add('hidden');setTimeout(()=>l.style.display='none',450)}
function showToast(msg){const t=document.getElementById('toastText');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),4000)}

function checkAuth() {
  const pwd = document.getElementById('authInput').value;
  if(pwd === "Kitkat") {
    document.getElementById('authOverlay').style.display = 'none';
  } else {
    document.getElementById('authError').style.display = 'block';
    document.getElementById('authInput').value = '';
    setTimeout(() => document.getElementById('authError').style.display = 'none', 3000);
  }
}
document.getElementById('authInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') checkAuth(); });
document.getElementById('authInput').focus();

const isNA=v=>{if(v==null)return true;const s=String(v).trim().toUpperCase();return !s||s==='N/A'||s==='#N/A'||s==='#NA'};
const clean=v=>isNA(v)?null:String(v).trim();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad=n=>String(n).padStart(2,'0');

function todayStr(){const d=new Date();return pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+d.getFullYear()}
function toTitleCase(str) { return str ? String(str).toLowerCase().replace(/\b\w/g, c => c.toUpperCase()) : str; }

function toggleTheme(){
  const isDark = document.documentElement.classList.toggle('dark-mode');
  try{localStorage.setItem('theme', isDark ? 'dark' : 'light')}catch(e){}
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
}

async function apiFetch(url){
  const MAX=2;
  for(let a=0;a<=MAX;a++){
    try{
      const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);
      const r=await fetch(url,{redirect:'follow',signal:c.signal});
      clearTimeout(t);const txt=await r.text();
      try{
        return JSON.parse(txt)
      }catch{
        throw new Error('Web App requires permissions. Set to "Execute as: Me" and "Access: Anyone".')
      }
    }catch(e){
      if(a===MAX)throw e;
      await new Promise(r=>setTimeout(r,1000*(a+1)))
    }
  }
}

function normalizeRow(r){
  if(isNA(r.tn)) return null; 
  return{id:clean(r.id),name:toTitleCase(clean(r.nm)),trainer:toTitleCase(clean(r.tn)),store:toTitleCase(clean(r.ds)),city:toTitleCase(clean(r.ct)),cm:toTitleCase(clean(r.cm)),status:clean(r.ts)};
}

function loadData(){
  apiFetch(SCRIPT_URL+'?action=getData').then(d=>{
    hideLoader();
    if(d?.error) return;
    rawData=Array.isArray(d) ? d.map(normalizeRow).filter(x=>x&&x.trainer) : [];
    try{localStorage.setItem(LOCAL_CACHE_KEY,JSON.stringify({data:rawData,ts:Date.now()}))}catch(e){}
    populateTrainers();
  }).catch((e)=>{ 
    hideLoader(); 
    const msg = e.message.includes('Web App requires') ? e.message : 'Network Error: Check URL and permissions.';
    showToast(msg);
  });
}

function populateTrainers(){
  const trainers=[...new Set(rawData.map(r=>r.trainer))].filter(Boolean).sort();
  trainerTS.clearOptions();
  trainers.forEach(t=>trainerTS.addOption({value:t,text:t}));
}

window.onload=()=>{
  trainerTS=new TomSelect('#trainerSelect',{placeholder:'Select Trainer(s) to view report...',create:false,maxItems:null,sortField:{field:'text'},onChange:onTrainerChange});
  
  const cached=(()=>{try{const r=localStorage.getItem(LOCAL_CACHE_KEY);if(!r)return null;const p=JSON.parse(r);return(Date.now()-p.ts<=CACHE_TTL)?p:null}catch(e){return null}})();
  
  if(cached){
    rawData = cached.data;
    populateTrainers();
    hideLoader();
  } else {
    loadData();
  }
};

function onTrainerChange(val){
  if(!val || val.length === 0){document.getElementById('results').style.display='none';return}
  const data=rawData.filter(r=>val.includes(r.trainer));
  renderSection('th1','tb1',['Store Name','Pendency Count'],groupBy(data,'store'));
  renderSection('th2','tb2',['Cluster Manager','Pendency Count'],groupBy(data,'cm'));
  renderSection('th3','tb3',['City','Pendency Count'],groupBy(data,'city'));
  document.getElementById('results').style.display='block';
}

function groupBy(arr,key){
  const map={};let total=0;
  arr.forEach(r=>{const v=r[key];if(isNA(v))return;map[v]=(map[v]||0)+1;total++});
  const entries=Object.entries(map).sort((a,b)=> b[1] - a[1] || a[0].localeCompare(b[0]));
  return{entries,total};
}

function renderSection(thId,tbId,headers,{entries,total}){
  document.getElementById(thId).innerHTML='<tr>'+headers.map((h, i)=>'<th style="'+(i===1?'text-align:right':'text-align:left')+'">'+esc(h)+'</th>').join('')+'</tr>';
  let html=entries.map(([name,count])=> '<tr><td style="font-weight:600">'+esc(name)+'</td><td style="text-align:right"><span class="normal-count">'+count+'</span></td></tr>').join('');
  html+='<tr class="total-row"><td>TOTAL</td><td style="text-align:right">'+total+'</td></tr>';
  document.getElementById(tbId).innerHTML=html;
}

const _ls={};
function loadScript(src){if(_ls[src])return _ls[src];_ls[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=()=>{delete _ls[src];rej(new Error('Failed: '+src))};document.head.appendChild(s)});return _ls[src]}
async function ensureJsPdf(){if(window.jspdf&&typeof window.jspdf.jsPDF==='function')return;await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js');}

async function exportPdf(){
  const trns=trainerTS.getValue();
  if(!trns || trns.length===0)return;
  const btn=document.getElementById('btnPdf');
  btn.disabled=true;btn.textContent='Generating PDF...';
  try{
    await ensureJsPdf();
    const{jsPDF}=window.jspdf;
    const data=rawData.filter(r=>trns.includes(r.trainer));
    const byStore=groupBy(data,'store');
    const byCM=groupBy(data,'cm');
    const byCity=groupBy(data,'city');
    
    let doc = new jsPDF({compress:true});
    let pw = doc.internal.pageSize.getWidth();
    const hd={fillColor:[241,245,249],textColor:[15,23,42],fontStyle:'bold',halign:'center',lineWidth:0.1,lineColor:[203,213,225]};
    const bd={halign:'center',textColor:[15,23,42],fontSize:10,lineWidth:0.1,lineColor:[203,213,225]};
    const cellStyleMap = function(data) {
      if (data.section === 'body' && data.column.index === 1) {
        const val = parseInt(data.cell.raw);
        if (!isNaN(val)) {
          if (val > 20) { data.cell.styles.fillColor = [254, 226, 226]; data.cell.styles.textColor = [153, 27, 27]; }
          else if (val >= 10) { data.cell.styles.fillColor = [254, 240, 138]; data.cell.styles.textColor = [133, 77, 14]; }
          else { data.cell.styles.fillColor = [220, 252, 231]; data.cell.styles.textColor = [22, 101, 52]; }
        }
        if (data.row.raw[0] === 'TOTAL') data.cell.styles.fontStyle = 'bold';
      }
      if (data.section === 'body' && data.column.index === 0 && data.row.raw[0] === 'TOTAL') data.cell.styles.fontStyle = 'bold';
    };

    let currentY = 16;

    if(byStore.entries.length) {
      doc.setFontSize(14).setTextColor(15,23,42).text('Store Name Wise Pendency', pw/2, currentY, {align:'center'});
      doc.autoTable({
        head:[['Store Name','Pendency']], body:[...byStore.entries,['TOTAL',byStore.total]], 
        startY:currentY+6, headStyles:hd, styles:bd, theme:'grid', margin:{left:14,right:14},
        didParseCell: cellStyleMap
      });
      currentY = doc.lastAutoTable.finalY + 16;
    }

    if(byCM.entries.length) {
      if (currentY > doc.internal.pageSize.getHeight() - 40) { doc.addPage(); currentY = 16; }
      doc.setFontSize(14).setTextColor(15,23,42).text('Cluster Manager Wise Pendency', pw/2, currentY, {align:'center'});
      doc.autoTable({
        head:[['Cluster Manager','Pendency']], body:[...byCM.entries,['TOTAL',byCM.total]], 
        startY:currentY+6, headStyles:hd, styles:bd, theme:'grid', margin:{left:14,right:14},
        didParseCell: cellStyleMap
      });
      currentY = doc.lastAutoTable.finalY + 16;
    }

    if(byCity.entries.length) {
      if (currentY > doc.internal.pageSize.getHeight() - 40) { doc.addPage(); currentY = 16; }
      doc.setFontSize(14).setTextColor(15,23,42).text('City Wise Pendency', pw/2, currentY, {align:'center'});
      doc.autoTable({
        head:[['City','Pendency']], body:[...byCity.entries,['TOTAL',byCity.total]], 
        startY:currentY+6, headStyles:hd, styles:bd, theme:'grid', margin:{left:14,right:14},
        didParseCell: cellStyleMap
      });
    }

    doc.save('Disprz_Report_' + todayStr() + '.pdf');
  }catch(e){
    alert('PDF export failed. Try again.');
  }finally{
    btn.disabled=false;
    btn.innerHTML='📄 Export Full PDF Report';
  }
}
</script>
</body>
</html>
