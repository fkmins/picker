</div>

<div class="glass-panel" id="mainPanel">
  <div class="hdr-wrap">
    <div class="brand-hdr">
      <img src="https://2dioqsev90.ucarecd.net/1e9d129e-8ea7-488c-919d-345bc4d7dcc4/l71720260823162158.webp" class="brand-img" alt="FK Minutes" decoding="async">

  <div id="results">

    <div class="title-bar">~ : Cluster Manager Wise Pendency : ~</div>
    <div class="tbl-wrap"><table class="tbl"><thead id="th2"></thead><tbody id="tb2"></tbody></table></div>
    
    <div class="title-bar">~ : City Wise Pendency : ~</div>
    <div class="tbl-wrap"><table class="tbl"><thead id="th3"></thead><tbody id="tb3"></tbody></table></div>
  </div>
</div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbx9zhgvcvgP00sLBrNksUB5L0h2E30hyjywQmK5n8N3e92bVKlSKrt_mS-5mQXFy_XA/exec';
const LOCAL_CACHE_KEY='completionDash_v2';
const CACHE_TTL=10*60*1000;
let rawData=[], trainerTS;

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clean=s=>s?String(s).trim():'';
const isNA=str=>{const v=String(str??"").trim().toUpperCase();return !v||v==="N/A"||v==="#N/A"||v==="#NA"};
function toTitleCase(str) { return str ? String(str).toLowerCase().replace(/\b\w/g, c => c.toUpperCase()) : str; }
const todayStr=()=>{const d=new Date();return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear()};

async function apiFetch(url){
  for(let a=0;a<=2;a++){
    try{
      const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);
      const r=await fetch(url,{redirect:'follow',signal:c.signal});
      clearTimeout(t);
      return await r.json();
    }catch(e){if(a===2)throw e;await new Promise(r=>setTimeout(r,1000*(a+1)))}
  }
}

function updateThemeTooltip() {
  const isDark = document.documentElement.classList.contains('dark-mode');
  const btn = document.getElementById('themeToggleBtn');
  if (btn) btn.title = isDark ? "Save Your Eyes" : "Damage Your Eyes";
}

function toggleTheme(){
  const d=document.documentElement.classList.toggle('dark-mode');
  try{localStorage.setItem('theme',d?'dark':'light')}catch(e){}
  updateThemeTooltip();
}

function normalizeRow(r){
  if(isNA(r.tn)) return null; 
  return{id:clean(r.id),name:toTitleCase(clean(r.nm)),trainer:toTitleCase(clean(r.tn)),store:toTitleCase(clean(r.ds)),city:toTitleCase(clean(r.ct)),cm:toTitleCase(clean(r.cm)),status:clean(r.ts)};
}

// Dynamic Skeleton Render instead of Full-Screen Loader
function renderSkeleton() {
  document.getElementById('results').style.display = 'block';
  document.getElementById('btnPdf').style.display = 'none';
  
  const headers = [
    {h:'th1', b:'tb1', cols:['Store Name','Pendency']},
    {h:'th2', b:'tb2', cols:['Cluster Manager','Pendency']},
    {h:'th3', b:'tb3', cols:['City','Pendency']}
  ];
  
  headers.forEach(grp => {
    document.getElementById(grp.h).innerHTML = `<tr>${grp.cols.map(c=>`<th>${c}</th>`).join('')}</tr>`;
    let skelHtml = '';
    for(let i=0; i<3; i++){
      skelHtml += `<tr><td><div class="skeleton-box skel-text"></div></td><td><div class="skeleton-box skel-text" style="width:40px"></div></td></tr>`;
    }
    document.getElementById(grp.b).innerHTML = skelHtml;
  });
}

function fetchData(){
  const c=(()=>{try{const r=localStorage.getItem(LOCAL_CACHE_KEY);if(r){const p=JSON.parse(r);if(Date.now()-p.ts<CACHE_TTL)return p.data}}catch(e){}return null})();
  if(c){
    rawData=c.map(normalizeRow).filter(x=>x&&x.trainer);
    populateTrainers();
    document.getElementById('btnPdf').style.display='block';
    return;
  }
  
  renderSkeleton(); // Only show skeleton if NO cache available
  apiFetch(SCRIPT_URL+'?action=getData').then(d=>{
    if(d?.error) return;
    try{localStorage.setItem(LOCAL_CACHE_KEY,JSON.stringify({data:d,ts:Date.now()}))}catch(e){}
    rawData=Array.isArray(d) ? d.map(normalizeRow).filter(x=>x&&x.trainer) : [];
    populateTrainers();
    document.getElementById('btnPdf').style.display='block';
  }).catch(()=>{});
}

function populateTrainers(){
  const trainers=[...new Set(rawData.map(r=>r.trainer))].filter(Boolean).sort();
  trainerTS.clearOptions();
  trainers.forEach(t=>trainerTS.addOption({value:t,text:t}));
}

window.onload=()=>{
  updateThemeTooltip();
  trainerTS=new TomSelect('#trainerSelect',{
    plugins: ['remove_button'],
    placeholder:'Select Trainer(s)',
    create:false,
    maxItems:null,
    sortField:{field:'text'},
    onChange:onTrainerChange
  });
  
  // Auth Logic: Wait to fetch data until AFTER they enter the correct password
  const authInput = document.getElementById('authInput');
  const overlay = document.getElementById('authOverlay');
  authInput.addEventListener('keypress', function(e){
    if(e.key==='Enter'){
      if(authInput.value==='Disprz@2024'){
        overlay.style.display='none';
        fetchData(); 
      }else{
        document.getElementById('authError').style.display='block';
      }
    }
  });
};

function onTrainerChange(val){
  if(!val || val.length === 0){document.getElementById('results').style.display='none';return}
  const data=rawData.filter(r=>val.includes(r.trainer));
  renderSection('th1','tb1',['Store Name','Pendency'],groupBy(data,'store'));
  renderSection('th2','tb2',['Cluster Manager','Pendency'],groupBy(data,'cm'));
  renderSection('th3','tb3',['City','Pendency'],groupBy(data,'city'));
  document.getElementById('results').style.display='block';
}

function groupBy(arr,key){
  const map={};let total=0;
  arr.forEach(r=>{const v=r[key];if(isNA(v))return;map[v]=(map[v]||0)+1;total++});
  const entries=Object.entries(map).sort((a,b)=> b[1] - a[1] || a[0].localeCompare(b[0]));
  return{entries,total};
}

function renderSection(thId,tbId,headers,{entries,total}){
  document.getElementById(thId).innerHTML='<tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>';
  let html=entries.map(([name,count])=> '<tr><td>'+esc(name)+'</td><td><span class="normal-count">'+count+'</span></td></tr>').join('');
  html+='<tr class="total-row"><td><strong>TOTAL</strong></td><td><strong>'+total+'</strong></td></tr>';
  document.getElementById(tbId).innerHTML=html;
}

const _ls={};
function loadScript(src){if(_ls[src])return _ls[src];_ls[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=()=>{delete _ls[src];rej(new Error('Failed: '+src))};document.head.appendChild(s)});return _ls[src]}
async function ensureJsPdf(){if(window.jspdf&&typeof window.jspdf.jsPDF==='function')return;await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js');}

async function exportPdf(){
  const trns=trainerTS.getValue();
  if(!trns || trns.length===0)return;
  const btn=document.getElementById('btnPdf');
  btn.disabled=true;btn.textContent='Generating Single Report PDF...';
  try{
    await ensureJsPdf();
    const{jsPDF}=window.jspdf;
    const data=rawData.filter(r=>trns.includes(r.trainer));
    const byStore=groupBy(data,'store');
    const byCM=groupBy(data,'cm');
    const byCity=groupBy(data,'city');
    
    let doc = new jsPDF({compress:true});
    let pw = doc.internal.pageSize.getWidth();
    const hd={fillColor:[230,230,230],textColor:[0,0,0],fontStyle:'bold',halign:'center',lineWidth:0.8,lineColor:[0,0,0]};
    const bd={halign:'center',textColor:[0,0,0],fontSize:9,lineWidth:0.8,lineColor:[0,0,0]};
    const cellStyleMap = function(data) {
      if (data.section === 'body' && data.column.index === 1) {
        const val = parseInt(data.cell.raw);
        if (!isNaN(val)) {
          if (val > 20) { data.cell.styles.fillColor = [254, 226, 226]; data.cell.styles.textColor = [153, 27, 27]; }
          else if (val >= 10) { data.cell.styles.fillColor = [254, 240, 138]; data.cell.styles.textColor = [133, 77, 14]; }
          else { data.cell.styles.fillColor = [220, 252, 231]; data.cell.styles.textColor = [22, 101, 52]; }
        }
        if (data.row.raw[0] === 'TOTAL') data.cell.styles.fontStyle = 'bold';
      }
      if (data.section === 'body' && data.column.index === 0 && data.row.raw[0] === 'TOTAL') data.cell.styles.fontStyle = 'bold';
    };

    let currentY = 14;

    if(byStore.entries.length) {
      doc.setFontSize(14).setTextColor(0,0,0).text('~ : Store Name Wise Pendency : ~', pw/2, currentY, {align:'center'});
      doc.autoTable({
        head:[['Store Name','Pendency']], body:[...byStore.entries,['TOTAL',byStore.total]], 
        startY:currentY+6, headStyles:hd, styles:bd, theme:'grid', margin:{left:14,right:14},
        didParseCell: cellStyleMap
      });
      currentY = doc.lastAutoTable.finalY + 15;
    }

    if(byCM.entries.length) {
      if (currentY > doc.internal.pageSize.getHeight() - 40) { doc.addPage(); currentY = 14; }
      doc.setFontSize(14).setTextColor(0,0,0).text('~ : Cluster Manager Wise Pendency : ~', pw/2, currentY, {align:'center'});
      doc.autoTable({
        head:[['Cluster Manager','Pendency']], body:[...byCM.entries,['TOTAL',byCM.total]], 
        startY:currentY+6, headStyles:hd, styles:bd, theme:'grid', margin:{left:14,right:14},
        didParseCell: cellStyleMap
      });
      currentY = doc.lastAutoTable.finalY + 15;
    }

    if(byCity.entries.length) {
      if (currentY > doc.internal.pageSize.getHeight() - 40) { doc.addPage(); currentY = 14; }
      doc.setFontSize(14).setTextColor(0,0,0).text('~ : City Wise Pendency : ~', pw/2, currentY, {align:'center'});
      doc.autoTable({
        head:[['City','Pendency']], body:[...byCity.entries,['TOTAL',byCity.total]], 
        startY:currentY+6, headStyles:hd, styles:bd, theme:'grid', margin:{left:14,right:14},
        didParseCell: cellStyleMap
      });
    }

    doc.save('Disprz_Report_' + todayStr() + '.pdf');
  }catch(e){
    alert('PDF export failed');
  }finally{
    btn.disabled=false;
    btn.innerHTML='Export Full PDF Report';
  }
}

function initSnow(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cvs=document.getElementById('snowCanvas');if(!cvs)return;const ctx=cvs.getContext('2d');
  let w,h,fl=[],on=true;const N=innerWidth<768?12:35;
  function rz(){w=cvs.width=innerWidth;h=cvs.height=innerHeight}
  function mk(){return{x:Math.random()*w,y:Math.random()*h,r:Math.random()*2.5+.7,sp:Math.random()*.8+.18,dr:Math.random()*.5-.25,op:Math.random()*.4+.18,wb:Math.random()*Math.PI*2,ws:Math.random()*.02+.005}}
  function sd(){fl=Array.from({length:N},mk)}
  function tk(){if(!on)return;ctx.clearRect(0,0,w,h);for(let k=0;k<fl.length;k++){const f=fl[k];f.wb+=f.ws;f.y+=f.sp;f.x+=f.dr+Math.sin(f.wb)*.35;if(f.y>h+5)Object.assign(f,mk(),{y:-5,x:Math.random()*w});if(f.x>w+5)f.x=-5;else if(f.x<-5)f.x=w+5;ctx.globalAlpha=f.op;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(tk)}
  addEventListener('resize',()=>{rz();sd()},{passive:true});
  document.addEventListener('visibilitychange',()=>{on=!document.hidden;if(on)tk()});
  rz();sd();tk();
}
if('requestIdleCallback'in window)requestIdleCallback(initSnow,{timeout:1500});else setTimeout(initSnow,300);
</script>
