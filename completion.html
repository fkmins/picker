<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{display:none}
html,body{scrollbar-width:none;-ms-overflow-style:none}
.tbl-wrap::-webkit-scrollbar{display:block;width:4px;height:4px}
.tbl-wrap::-webkit-scrollbar-track{background:transparent}
.tbl-wrap::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:4px}
.tbl-wrap{scrollbar-width:thin}

:root{
  --fk-blue:#2874F0;--fk-yellow:#FFB400;
  --gold:#D4AF37;--gold-light:#F5E6B8;--gold-glow:rgba(212,175,55,0.25);
  --danger:#ef4444;--success:#10b981;
  --bg-panel:rgba(255,255,255,0.82);--card-bg:rgba(255,255,255,0.97);
  --table-header:rgba(248,250,252,0.99);--table-hover:rgba(241,245,249,0.99);
  --dropdown-hover:rgba(40,116,240,0.10);
  --text-main:#0f172a;--text-muted:#64748b;
  --border-color:rgba(203,213,225,0.8);
  --shadow-panel:0 24px 64px rgba(0,0,0,0.20);
  --shadow-card:0 4px 16px rgba(0,0,0,0.07);
  --blur:blur(22px);
}
:root.dark-mode{
  --bg-panel:rgba(15,23,42,0.88);--card-bg:rgba(15,23,42,0.98);
  --table-header:rgba(8,14,31,0.98);--table-hover:rgba(30,41,59,0.98);
  --dropdown-hover:rgba(40,116,240,0.18);
  --text-main:#f1f5f9;--text-muted:#94a3b8;
  --border-color:rgba(51,65,85,0.8);
}

body::before{content:"";position:fixed;top:0;left:0;width:100vw;height:100vh;background-size:cover;background-position:center;background-repeat:no-repeat;z-index:0;animation:wallIn .8s ease both}
body::after{content:"";position:fixed;inset:0;background:rgba(15,23,42,0.65);z-index:1;transition:background .3s}
:root.dark-mode body::after{background:rgba(5,10,25,0.75)}

@keyframes wallIn{from{opacity:0}to{opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes panelUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
#snowCanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:2}

#appLoader{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(20,15,5,0.96),rgba(5,10,25,0.98));z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .45s ease}
#appLoader.hidden{opacity:0;pointer-events:none}
.loader-svg{width:110px;height:110px;background:transparent;object-fit:contain;margin-bottom:10px;filter:drop-shadow(0 0 16px var(--gold-glow))}
.loading-text{font-family:Inter,sans-serif;font-weight:800;font-size:14px;color:var(--gold-light);text-align:center;letter-spacing:.5px;animation:pulseTxt 1.6s ease-in-out infinite}
@keyframes pulseTxt{0%,100%{opacity:1}50%{opacity:.5}}

.auth-overlay{position:fixed;inset:0;background:#0f172a;z-index:999999;display:flex;align-items:center;justify-content:center;animation:fadeIn .3s ease}
.auth-modal{background:var(--card-bg);border:1.5px solid var(--border-color);border-radius:24px;padding:36px 32px;width:90%;max-width:380px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.6);animation:panelUp .4s cubic-bezier(.22,1,.36,1)}
.auth-icon{font-size:48px;margin-bottom:12px;line-height:1}
.auth-input{width:100%;border-radius:14px;padding:14px 22px;border:1.5px solid var(--border-color);font-weight:700;font-size:16px;background:var(--bg-panel);color:var(--text-main);text-align:center;margin-bottom:20px;letter-spacing:4px}
.auth-input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-glow)}
.auth-btn-secondary{width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:14px;border:1.5px solid var(--border-color);cursor:pointer;background:transparent;color:var(--text-main)}
.auth-error{color:var(--danger);font-size:13px;font-weight:800;margin-top:16px;display:none}

body{font-family:Inter,system-ui,sans-serif;color:var(--text-main);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px 48px;position:relative;z-index:3;text-align:center}
.glass-panel{background:var(--bg-panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:28px;padding:36px 32px;width:100%;max-width:960px;border:1px solid var(--border-color);box-shadow:var(--shadow-panel);position:relative;z-index:10;animation:panelUp .5s cubic-bezier(.22,1,.36,1) both}

.hdr{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.hdr-brand{display:flex;align-items:center;justify-content:center;gap:12px;flex:1}
.hdr-logo{width:80px;height:44px;border-radius:12px;object-fit:cover;box-shadow:0 4px 14px rgba(40,116,240,.3)}
.hdr-title{font-weight:900;font-size:24px;letter-spacing:-.6px;background:linear-gradient(105deg,var(--text-main) 35%,var(--gold) 50%,var(--text-main) 65%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 4s linear infinite}
.hdr-sub{font-size:12px;font-weight:700;color:var(--fk-blue);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.hdr-actions{display:flex;gap:8px}
.icon-btn{background:var(--card-bg);border:1.5px solid var(--border-color);color:var(--text-main);border-radius:50px;padding:9px 18px;font-size:14px;font-weight:800;cursor:pointer;text-decoration:none;line-height:1}
.divider{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 0 24px;border:none}

.filter-area{display:flex;justify-content:center;gap:14px;margin-bottom:24px;width:100%}
.filter-col{flex:1 1 320px;max-width:480px;text-align:center}

/* TomSelect Strict Absolute Centering Overrides for completion too */
.ts-wrapper .ts-control { border-radius: 14px !important; padding: 13px 18px !important; border: 1.5px solid var(--border-color) !important; font-weight: 700 !important; font-size: 14px !important; font-family: Inter, sans-serif !important; background: var(--card-bg) !important; color: var(--text-main) !important; display: flex !important; justify-content: center !important; align-items: center !important; text-align: center !important; }
.ts-wrapper .ts-control > input { text-align: center !important; color: var(--text-main) !important; width: 100% !important; margin: 0 !important; padding: 0 !important; flex: 1 1 auto !important; }
.ts-wrapper .ts-control > input::placeholder { text-align: center !important; color: var(--text-muted) !important; }
.ts-wrapper .ts-control .item { flex-grow: 1 !important; text-align: center !important; width: 100% !important; display: block !important; }
.ts-wrapper.has-items .ts-control > input { width: 0 !important; opacity: 0 !important; position: absolute !important; }
.ts-wrapper .ts-control.focus { border-color: var(--gold) !important; box-shadow: 0 0 0 3px var(--gold-glow) !important; }
.ts-dropdown { padding: 0 !important; border-radius: 14px !important; border: 1px solid var(--border-color) !important; background: var(--card-bg) !important; overflow: hidden !important; box-shadow: 0 12px 32px rgba(0,0,0,0.15) !important; text-align: center !important; }
.ts-dropdown .ts-dropdown-content { display: flex; flex-direction: column; text-align: center !important; }
.ts-dropdown .option { background: transparent !important; color: var(--text-main) !important; text-align: center !important; padding: 12px 16px !important; font-weight: 600 !important; font-size: 14px !important; border-radius: 0 !important; margin: 0 !important; border: none !important; border-bottom: 1px solid var(--border-color) !important; box-shadow: none !important; width: 100% !important; justify-content: center !important; }
.ts-dropdown .option:last-child { border-bottom: none !important; }
.ts-dropdown .option:hover, .ts-dropdown .option.active { background: var(--dropdown-hover) !important; color: var(--fk-blue) !important; font-weight: 800 !important; }

#results{display:none;animation:fadeIn .4s ease both}
.section{margin-bottom:28px}
.section-title{font-weight:900;font-size:15px;text-transform:uppercase;color:var(--fk-yellow);margin-bottom:12px;text-align:center}

.tbl-wrap{background:var(--card-bg);border-radius:18px;width:100%;border:1px solid var(--border-color);overflow:auto;max-height:380px}
.tbl{border-collapse:collapse;width:100%;min-width:300px;text-align:center}
.tbl th,.tbl td{padding:14px 16px;vertical-align:middle;text-align:center!important}
.tbl thead th{background:var(--table-header);color:var(--fk-yellow);font-size:11px;font-weight:800;text-transform:uppercase;position:sticky;top:0;border-bottom:2px solid var(--border-color)}
.tbl td{font-weight:600;font-size:14px;border-bottom:1px solid var(--border-color)}
.tbl tbody tr:nth-child(even) td{background:var(--table-hover)}
.normal-count{font-weight:800;font-size:15px;color:var(--text-main)}
.total-row td{font-weight:900!important;background:var(--table-header)!important;border-top:2px solid var(--gold)!important}

.btn-export{border:none;padding:14px 30px;border-radius:14px;font-weight:800;font-size:14px;cursor:pointer;background:linear-gradient(135deg,#334155,#1e293b);color:#fff;margin:6px 0 24px}

@media(max-width:768px){
  body{padding:16px 10px 36px}
  .glass-panel{padding:28px 16px;border-radius:22px}
  .hdr{flex-direction:column;gap:12px}
  .btn-export{width:100%;justify-content:center}
}
</style>

<canvas id="snowCanvas" aria-hidden="true"></canvas>

  <div class="auth-modal">

<div id="appLoader">
  <img class="loader-svg" src="https://2dioqsev90.ucarecd.net/aeeac257-6b3a-4e9e-a8ac-10f5a73d9bc1/Loadercat1.svg" alt="Loading" decoding="async">

<div class="glass-panel">
  <div class="hdr">
    <div class="hdr-brand">
      <img src="https://2dioqsev90.ucarecd.net/1e9d129e-8ea7-488c-919d-345bc4d7dcc4/l71720260823162158.webp" class="hdr-logo" alt="FK Minutes" decoding="async">

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbx9zhgvcvgP00sLBrNksUB5L0h2E30hyjywQmK5n8N3e92bVKlSKrt_mS-5mQXFy_XA/exec';
const LOCAL_CACHE_KEY='completionDash_v2';
const CACHE_TTL=10*60*1000;

let rawData=[],trainerTS;

function hideLoader(){const l=document.getElementById('appLoader');if(!l)return;l.classList.add('hidden');setTimeout(()=>l.style.display='none',450)}

function checkAuth() {
  const pwd = document.getElementById('authInput').value;
  if(pwd === "Kitkat") document.getElementById('authOverlay').style.display = 'none';
  else {
    document.getElementById('authError').style.display = 'block';
    document.getElementById('authInput').value = '';
    setTimeout(() => document.getElementById('authError').style.display = 'none', 2500);
  }
}
document.getElementById('authInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') checkAuth(); });
document.getElementById('authInput').focus();

const isNA=v=>{if(v==null)return true;const s=String(v).trim().toUpperCase();return !s||s==='N/A'||s==='#N/A'||s==='#NA'};
const clean=v=>isNA(v)?null:String(v).trim();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad=n=>String(n).padStart(2,'0');

function todayStr(){const d=new Date();return pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+d.getFullYear()}
function toTitleCase(str) { return str ? String(str).toLowerCase().replace(/\b\w/g, c => c.toUpperCase()) : str; }
function toggleTheme(){const d=document.documentElement.classList.toggle('dark-mode');try{localStorage.setItem('theme',d?'dark':'light')}catch(e){}}

async function apiFetch(url){
  const MAX=2;
  for(let a=0;a<=MAX;a++){
    try{
      const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);
      const r=await fetch(url,{redirect:'follow',signal:c.signal});
      clearTimeout(t);const txt=await r.text();
      try{return JSON.parse(txt)}catch{throw new Error('Invalid response')}
    }catch(e){if(a===MAX)throw e;await new Promise(r=>setTimeout(r,1000*(a+1)))}
  }
}

function normalizeRow(r){
  if(isNA(r.tn)) return null; 
  return{id:clean(r.id),name:toTitleCase(clean(r.nm)),trainer:toTitleCase(clean(r.tn)),store:toTitleCase(clean(r.ds)),city:toTitleCase(clean(r.ct)),cm:toTitleCase(clean(r.cm)),status:clean(r.ts)};
}

function loadData(){
  apiFetch(SCRIPT_URL+'?action=getData').then(d=>{
    hideLoader();
    if(d?.error) return;
    rawData=Array.isArray(d) ? d.map(normalizeRow).filter(x=>x&&x.trainer) : [];
    try{localStorage.setItem(LOCAL_CACHE_KEY,JSON.stringify({data:rawData,ts:Date.now()}))}catch(e){}
    populateTrainers();
  }).catch(()=>{ hideLoader(); });
}

function populateTrainers(){
  const trainers=[...new Set(rawData.map(r=>r.trainer))].filter(Boolean).sort();
  trainerTS.clearOptions();
  trainers.forEach(t=>trainerTS.addOption({value:t,text:t}));
}

window.onload=()=>{
  trainerTS=new TomSelect('#trainerSelect',{placeholder:'Select Trainer(s)',create:false,maxItems:null,sortField:{field:'text'},onChange:onTrainerChange});
  
  const cached=(()=>{try{const r=localStorage.getItem(LOCAL_CACHE_KEY);if(!r)return null;const p=JSON.parse(r);return(Date.now()-p.ts<=CACHE_TTL)?p:null}catch(e){return null}})();
  
  if(cached){
    rawData = cached.data;
    populateTrainers();
    hideLoader();
  } else {
    loadData();
  }
};

function onTrainerChange(val){
  if(!val || val.length === 0){document.getElementById('results').style.display='none';return}
  const data=rawData.filter(r=>val.includes(r.trainer));
  renderSection('th1','tb1',['Store Name','Pendency'],groupBy(data,'store'));
  renderSection('th2','tb2',['Cluster Manager','Pendency'],groupBy(data,'cm'));
  renderSection('th3','tb3',['City','Pendency'],groupBy(data,'city'));
  document.getElementById('results').style.display='block';
}

function groupBy(arr,key){
  const map={};let total=0;
  arr.forEach(r=>{const v=r[key];if(isNA(v))return;map[v]=(map[v]||0)+1;total++});
  const entries=Object.entries(map).sort((a,b)=> b[1] - a[1] || a[0].localeCompare(b[0]));
  return{entries,total};
}

function renderSection(thId,tbId,headers,{entries,total}){
  document.getElementById(thId).innerHTML='<tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>';
  let html=entries.map(([name,count])=> '<tr><td>'+esc(name)+'</td><td><span class="normal-count">'+count+'</span></td></tr>').join('');
  html+='<tr class="total-row"><td><strong>TOTAL</strong></td><td><strong>'+total+'</strong></td></tr>';
  document.getElementById(tbId).innerHTML=html;
}

const _ls={};
function loadScript(src){if(_ls[src])return _ls[src];_ls[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=()=>{delete _ls[src];rej(new Error('Failed: '+src))};document.head.appendChild(s)});return _ls[src]}
async function ensureJsPdf(){if(window.jspdf&&typeof window.jspdf.jsPDF==='function')return;await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js');}

async function exportPdf(){
  const trns=trainerTS.getValue();
  if(!trns || trns.length===0)return;
  const btn=document.getElementById('btnPdf');
  btn.disabled=true;btn.textContent='Generating Single Report PDF...';
  try{
    await ensureJsPdf();
    const{jsPDF}=window.jspdf;
    const data=rawData.filter(r=>trns.includes(r.trainer));
    const byStore=groupBy(data,'store');
    const byCM=groupBy(data,'cm');
    const byCity=groupBy(data,'city');
    
    let doc = new jsPDF({compress:true});
    let pw = doc.internal.pageSize.getWidth();
    const hd={fillColor:[230,230,230],textColor:[0,0,0],fontStyle:'bold',halign:'center',lineWidth:0.8,lineColor:[0,0,0]};
    const bd={halign:'center',textColor:[0,0,0],fontSize:9,lineWidth:0.8,lineColor:[0,0,0]};
    const cellStyleMap = function(data) {
      if (data.section === 'body' && data.column.index === 1) {
        const val = parseInt(data.cell.raw);
        if (!isNaN(val)) {
          if (val > 20) { data.cell.styles.fillColor = [254, 226, 226]; data.cell.styles.textColor = [153, 27, 27]; }
          else if (val >= 10) { data.cell.styles.fillColor = [254, 240, 138]; data.cell.styles.textColor = [133, 77, 14]; }
          else { data.cell.styles.fillColor = [220, 252, 231]; data.cell.styles.textColor = [22, 101, 52]; }
        }
        if (data.row.raw[0] === 'TOTAL') data.cell.styles.fontStyle = 'bold';
      }
      if (data.section === 'body' && data.column.index === 0 && data.row.raw[0] === 'TOTAL') data.cell.styles.fontStyle = 'bold';
    };

    let currentY = 14;

    if(byStore.entries.length) {
      doc.setFontSize(14).setTextColor(0,0,0).text('~ : Store Name Wise Pendency : ~', pw/2, currentY, {align:'center'});
      doc.autoTable({
        head:[['Store Name','Pendency']], body:[...byStore.entries,['TOTAL',byStore.total]], 
        startY:currentY+6, headStyles:hd, styles:bd, theme:'grid', margin:{left:14,right:14},
        didParseCell: cellStyleMap
      });
      currentY = doc.lastAutoTable.finalY + 15;
    }

    if(byCM.entries.length) {
      if (currentY > doc.internal.pageSize.getHeight() - 40) { doc.addPage(); currentY = 14; }
      doc.setFontSize(14).setTextColor(0,0,0).text('~ : Cluster Manager Wise Pendency : ~', pw/2, currentY, {align:'center'});
      doc.autoTable({
        head:[['Cluster Manager','Pendency']], body:[...byCM.entries,['TOTAL',byCM.total]], 
        startY:currentY+6, headStyles:hd, styles:bd, theme:'grid', margin:{left:14,right:14},
        didParseCell: cellStyleMap
      });
      currentY = doc.lastAutoTable.finalY + 15;
    }

    if(byCity.entries.length) {
      if (currentY > doc.internal.pageSize.getHeight() - 40) { doc.addPage(); currentY = 14; }
      doc.setFontSize(14).setTextColor(0,0,0).text('~ : City Wise Pendency : ~', pw/2, currentY, {align:'center'});
      doc.autoTable({
        head:[['City','Pendency']], body:[...byCity.entries,['TOTAL',byCity.total]], 
        startY:currentY+6, headStyles:hd, styles:bd, theme:'grid', margin:{left:14,right:14},
        didParseCell: cellStyleMap
      });
    }

    doc.save('Disprz_Report_' + todayStr() + '.pdf');
  }catch(e){
    alert('PDF export failed');
  }finally{
    btn.disabled=false;
    btn.innerHTML='Export Full PDF Report';
  }
}

function initSnow(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cvs=document.getElementById('snowCanvas');if(!cvs)return;const ctx=cvs.getContext('2d');
  let w,h,fl=[],on=true;const N=innerWidth<768?12:35;
  function rz(){w=cvs.width=innerWidth;h=cvs.height=innerHeight}
  function mk(){return{x:Math.random()*w,y:Math.random()*h,r:Math.random()*2.5+.7,sp:Math.random()*.8+.18,dr:Math.random()*.5-.25,op:Math.random()*.4+.18,wb:Math.random()*Math.PI*2,ws:Math.random()*.02+.005}}
  function sd(){fl=Array.from({length:N},mk)}
  function tk(){if(!on)return;ctx.clearRect(0,0,w,h);for(let k=0;k<fl.length;k++){const f=fl[k];f.wb+=f.ws;f.y+=f.sp;f.x+=f.dr+Math.sin(f.wb)*.35;if(f.y>h+5)Object.assign(f,mk(),{y:-5,x:Math.random()*w});if(f.x>w+5)f.x=-5;else if(f.x<-5)f.x=w+5;ctx.globalAlpha=f.op;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(tk)}
  addEventListener('resize',()=>{rz();sd()},{passive:true});
  document.addEventListener('visibilitychange',()=>{on=!document.hidden;if(on)tk()});
  rz();sd();tk();
}
if('requestIdleCallback'in window)requestIdleCallback(initSnow,{timeout:1500});else setTimeout(initSnow,300);
</script>
